
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Admin — rabbit-kombat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:#f3f4f6;min-height:100vh;color:#1a1a1a;font-size:14px}
/* Tabler icons via CDN */
.ti{font-family:'tabler-icons'!important;speak:none;font-style:normal;font-weight:400;font-variant:normal;text-transform:none;line-height:1;display:inline-block;vertical-align:middle}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.logo{font-size:18px;color:#f97316}
.topbar h1{font-size:14px;font-weight:700;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;display:inline-block}
.dot.ok{background:#22c55e}.dot.err{background:#ef4444}
#statusText{font-size:12px;color:#6b7280}
.layout{display:flex;min-height:calc(100vh - 46px)}
.sidebar{width:200px;flex-shrink:0;background:#fff;border-left:1px solid #e5e7eb;overflow-y:auto;padding:8px 0}
.sb-title{font-size:10px;font-weight:700;color:#9ca3af;padding:10px 14px 4px;text-transform:uppercase;letter-spacing:.5px}
.sb-item{display:flex;align-items:center;gap:7px;padding:8px 14px;cursor:pointer;font-size:13px;color:#374151;border-right:2px solid transparent;transition:.1s;user-select:none}
.sb-item:hover{background:#f9fafb}.sb-item.active{background:#eff6ff;color:#1d4ed8;border-right-color:#3b82f6}
.sb-cnt{margin-right:auto;background:#dbeafe;color:#1e40af;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
.sb-sep{border-top:1px solid #f3f4f6;margin:6px 0}
.content{flex:1;padding:16px;overflow-y:auto;min-width:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#374151;font-size:12px;cursor:pointer;font-family:inherit;transition:.1s;white-space:nowrap;user-select:none}
.btn:hover{background:#f3f4f6}.btn:active{transform:scale(.98)}
.btn.primary{background:#3b82f6;border-color:#2563eb;color:#fff}.btn.primary:hover{background:#2563eb}
.btn.danger{border-color:#fca5a5;color:#dc2626}.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:4px 8px;font-size:11px}
.btn.green{background:#22c55e;border-color:#16a34a;color:#fff}.btn.green:hover{background:#16a34a}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.hdr h2{font-size:15px;font-weight:700;flex:1}
.bc{font-size:12px;color:#9ca3af;margin-bottom:12px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bc .seg{color:#3b82f6;cursor:pointer;padding:1px 4px;border-radius:4px}.bc .seg:hover{background:#eff6ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.sc{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;text-align:center}
.sc-n{font-size:22px;font-weight:700;color:#111}.sc-l{font-size:11px;color:#9ca3af;margin-top:2px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;margin-bottom:14px}
.card-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;font-size:11px;font-weight:700;color:#6b7280;text-align:right;padding:9px 13px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid #f3f4f6;vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border:none}tr:hover td{background:#f9fafb}
.acts{display:flex;gap:5px;align-items:center}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.b-str{background:#dbeafe;color:#1e40af}.b-num{background:#dcfce7;color:#15803d}
.b-bool{background:#fef3c7;color:#92400e}.b-obj{background:#f3e8ff;color:#6b21a8}.b-null{background:#f1f5f9;color:#64748b}
.nest{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#1d4ed8;background:#dbeafe;padding:2px 8px;border-radius:10px;cursor:pointer;font-weight:600}
.nest:hover{background:#bfdbfe}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:7px 12px;margin-bottom:12px}
.srch input{border:none;background:transparent;flex:1;font-size:13px;color:#111;outline:none;font-family:inherit}
.empty{text-align:center;padding:50px;color:#9ca3af;font-size:13px}
.empty-icon{font-size:40px;display:block;margin-bottom:10px;color:#d1d5db}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.mh{padding:14px 18px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px}
.mh h3{font-size:14px;font-weight:700;flex:1}
.mb{padding:18px;overflow-y:auto;flex:1}
.mf{padding:12px 18px;border-top:1px solid #e5e7eb;display:flex;gap:8px;justify-content:flex-end}
.fl{margin-bottom:13px}
.fl label{display:block;font-size:11px;color:#6b7280;margin-bottom:4px;font-weight:600}
.fl input,.fl textarea,.fl select{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:8px 10px;font-size:13px;background:#fff;color:#111;outline:none;font-family:inherit;transition:.1s}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.fl textarea{resize:vertical;font-family:monospace;font-size:12px;line-height:1.5}
.hint{font-size:10px;color:#9ca3af;margin-top:3px}
.jpre{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:13px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:360px;overflow-y:auto;line-height:1.6}
.toast-wrap{position:fixed;bottom:20px;left:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:11px 16px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;align-items:center;gap:9px;animation:tin .25s ease;max-width:320px}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.ok{border-right:3px solid #22c55e}.toast.err{border-right:3px solid #ef4444}
code{font-family:monospace;font-size:11px;background:#f3f4f6;padding:1px 5px;border-radius:4px;color:#374151}
.warn-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 14px;font-size:12px;color:#92400e;margin-bottom:14px;line-height:1.6}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">&#128database;</span>
  <h1>&#128;&#57344; Firebase Admin &mdash; rabbit-kombat</h1>
  <span class="dot" id="dot"></span>
  <span id="statusText">جاري الاتصال...</span>
  <button class="btn sm" onclick="refreshAll()">&#8635; تحديث</button>
</div>
<div class="layout">
  <div class="sidebar">
    <div class="sb-title">المجموعات</div>
    <div id="sbList"><div style="padding:14px;font-size:12px;color:#9ca3af">جاري التحميل...</div></div>
  </div>
  <div class="content" id="main">
    <div class="empty"><span class="empty-icon">🗄️</span><p>اختر مجموعة من القائمة</p></div>
  </div>
</div>
<div id="modals"></div>
<div class="toast-wrap" id="toasts"></div>

<!-- Firebase via module (works from file://) -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, get, set, update, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

// ── Config ──────────────────────────────────────────────
const CFG = {
  apiKey:"AIzaSyCAyf3HizLe6s8N9Xa7ONXxI7UgWt-gZ3U",
  authDomain:"rabbit-kombat.firebaseapp.com",
  databaseURL:"https://rabbit-kombat-default-rtdb.firebaseio.com",
  projectId:"rabbit-kombat",
  storageBucket:"rabbit-kombat.firebasestorage.app",
  messagingSenderId:"726035321546",
  appId:"1:726035321546:web:b41785e7cd0e2f56d45a33"
};

const app = initializeApp(CFG);
const DB  = getDatabase(app);

// ── State ────────────────────────────────────────────────
let ROOT = {}, PATH = [];
const STORE = {};
let SID = 0;
function stor(v){ const id='s'+(++SID); STORE[id]=v; return id; }
function getStor(id){ return STORE[id]; }

// ── Helpers ──────────────────────────────────────────────
const $ = id => document.getElementById(id);
const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cnt = v => (!v && v!==0 && v!==false) ? 0 : typeof v==='object' ? Object.keys(v).length : 1;
function depth(o,d=0){ if(typeof o!=='object'||!o) return d; const vs=Object.values(o); return vs.length?Math.max(...vs.map(v=>depth(v,d+1))):d; }
function badge(v){
  if(v===null||v===undefined) return '<span class="badge b-null">null</span>';
  if(typeof v==='object') return '<span class="badge b-obj">object ('+ Object.keys(v).length +' عناصر)</span>';
  if(typeof v==='boolean') return '<span class="badge b-bool">'+v+'</span>';
  if(typeof v==='number') return '<span class="badge b-num">'+v+'</span>';
  return '<span class="badge b-str">string</span>';
}
function fmtVal(v){
  if(v===null||v===undefined) return '<span class="badge b-null">null</span>';
  if(typeof v==='boolean') return '<span class="badge b-bool">'+v+'</span>';
  if(typeof v==='number') return '<span class="badge b-num">'+v+'</span>';
  if(typeof v==='object') return '<span class="badge b-obj">object</span>';
  const s=String(v); return '<span title="'+h(s)+'">'+h(s.length>55?s.slice(0,55)+'…':s)+'</span>';
}
function setMain(html){ $('main').innerHTML=html; }
function setStatus(ok,txt){
  $('dot').className='dot '+(ok?'ok':'err');
  $('statusText').textContent=txt;
}

// ── Firebase ops ─────────────────────────────────────────
async function fbGet(path){ const s=await get(ref(DB,path)); return s.val(); }
async function fbSet(path,val){ await set(ref(DB,path),val); }
async function fbUpdate(path,obj){ await update(ref(DB,path),obj); }
async function fbDel(path){ await remove(ref(DB,path)); }

// ── Load root ────────────────────────────────────────────
async function loadRoot(){
  setMain('<div class="empty"><span class="spin">⏳</span><p style="margin-top:8px">جاري تحميل البيانات...</p></div>');
  try {
    ROOT = (await fbGet('/')) || {};
    buildSidebar();
    showHome();
    setStatus(true,'متصل ✓');
  } catch(e){
    setStatus(false,'خطأ في الاتصال');
    setMain('<div class="empty"><p style="color:#ef4444">'+h(e.message)+'</p></div>');
    toast(e.message,false);
  }
}

// ── Sidebar ──────────────────────────────────────────────
function buildSidebar(){
  const keys = ROOT && typeof ROOT==='object' ? Object.keys(ROOT) : [];
  let html = keys.map(k=>
    '<div class="sb-item" data-key="'+h(k)+'" onclick="APP.openCol(this.dataset.key)">'+
    '📁 <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+h(k)+'</span>'+
    '<span class="sb-cnt">'+cnt(ROOT[k])+'</span></div>'
  ).join('');
  html += '<div class="sb-sep"></div>';
  html += '<div class="sb-item" onclick="APP.showRaw()">📄 JSON كامل</div>';
  html += '<div class="sb-item" onclick="APP.modalNewCol()">➕ مجموعة جديدة</div>';
  $('sbList').innerHTML = html;
  // restore active
  if(PATH.length){
    const el = $('sbList').querySelector('[data-key="'+PATH[0]+'"]');
    if(el) el.classList.add('active');
  }
}

function activeSb(key){
  $('sbList').querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const el = $('sbList').querySelector('[data-key="'+key+'"]');
  if(el) el.classList.add('active');
}

// ── Home ────────────────────────────────────────────────
function showHome(){
  PATH=[];
  const keys = ROOT&&typeof ROOT==='object' ? Object.keys(ROOT) : [];
  let total=0; keys.forEach(k=>total+=cnt(ROOT[k]));
  const rows = keys.map(k=>{
    const sid = stor({action:'delNode', fpath:k});
    const sid2= stor({action:'openCol',key:k});
    return '<tr>'+
      '<td><strong>'+h(k)+'</strong></td>'+
      '<td>'+cnt(ROOT[k])+'</td>'+
      '<td>'+badge(ROOT[k])+'</td>'+
      '<td><div class="acts">'+
      '<button class="btn sm" data-sid="'+sid2+'" onclick="APP.runStor(this.dataset.sid)">👁 فتح</button>'+
      '<button class="btn sm danger" data-sid="'+sid+'" onclick="APP.runStor(this.dataset.sid)">🗑 حذف</button>'+
      '</div></td></tr>';
  }).join('');
  setMain(
    '<div class="stats">'+
    '<div class="sc"><div class="sc-n">'+keys.length+'</div><div class="sc-l">مجموعات</div></div>'+
    '<div class="sc"><div class="sc-n">'+total+'</div><div class="sc-l">إجمالي السجلات</div></div>'+
    '<div class="sc"><div class="sc-n">'+JSON.stringify(ROOT).length+'</div><div class="sc-l">حجم (bytes)</div></div>'+
    '<div class="sc"><div class="sc-n">'+depth(ROOT)+'</div><div class="sc-l">عمق التداخل</div></div>'+
    '</div>'+
    '<div class="card"><div class="card-scroll"><table>'+
    '<thead><tr><th>المجموعة</th><th>السجلات</th><th>النوع</th><th>إجراءات</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div></div>'
  );
}

// ── Render node ──────────────────────────────────────────
function renderNode(){
  let node=ROOT;
  for(const p of PATH){ node=(node&&typeof node==='object')?node[p]:undefined; }
  const fpath=PATH.join('/');

  let bc='<div class="bc"><span class="seg" onclick="APP.showHome()">🏠</span>';
  PATH.forEach((p,i)=>{ bc+=' <span style="color:#9ca3af">/</span> <span class="seg" data-idx="'+i+'" onclick="APP.navTo(this.dataset.idx)">'+h(p)+'</span>'; });
  bc+='</div>';

  if(node===null||node===undefined){ setMain(bc+'<div class="empty">🕳 لا توجد بيانات</div>'); return; }
  if(typeof node!=='object'){ renderScalar(bc,fpath,node); return; }
  renderObj(bc,fpath,node);
}

function navTo(idx){ PATH=PATH.slice(0,Number(idx)+1); renderNode(); }
function drillPath(base,key){ PATH=[...base.split('/').filter(Boolean),key]; renderNode(); }

// ── Render scalar ────────────────────────────────────────
function renderScalar(bc,fpath,val){
  const sidEdit = stor({action:'modalScalar',fpath,val});
  const sidDel  = stor({action:'delNode',fpath});
  setMain(bc+
    '<div class="hdr"><h2>'+h(PATH[PATH.length-1])+'</h2>'+
    '<button class="btn" data-sid="'+sidEdit+'" onclick="APP.runStor(this.dataset.sid)">✏️ تعديل</button>'+
    '<button class="btn danger" data-sid="'+sidDel+'" onclick="APP.runStor(this.dataset.sid)">🗑 حذف</button></div>'+
    '<div class="card" style="padding:14px">'+
    '<div class="fl"><label>القيمة</label><div class="jpre">'+h(JSON.stringify(val,null,2))+'</div></div>'+
    '<div class="fl"><label>النوع</label>'+badge(val)+'</div></div>'
  );
}

// ── Render object ────────────────────────────────────────
function renderObj(bc,fpath,node){
  const keys=Object.keys(node);
  const allCols=new Set();
  const isRecords=keys.length>0&&keys.every(k=>node[k]&&typeof node[k]==='object');
  if(isRecords) keys.forEach(k=>Object.keys(node[k]).forEach(c=>allCols.add(c)));
  const cols=[...allCols].slice(0,6);

  const sfpath=stor(fpath);
  let tableHtml='';

  if(isRecords&&cols.length>0){
    const rows=keys.map(k=>{
      const row=node[k];
      const sidEdit=stor({action:'modalEditRow',fpath:fpath+'/'+k,key:k,row});
      const sidDel =stor({action:'delNode',fpath:fpath+'/'+k});
      const sidDrill=stor({action:'drillPath',base:fpath,key:k});
      return '<tr>'+
        '<td><code>'+h(k)+'</code></td>'+
        cols.map(c=>{
          const v=row&&row[c]!==undefined?row[c]:'';
          if(v&&typeof v==='object'){
            const ds=stor({action:'drillPath',base:fpath+'/'+k,key:c});
            return '<td><span class="nest" data-sid="'+ds+'" onclick="APP.runStor(this.dataset.sid)">📁 '+Object.keys(v).length+'</span></td>';
          }
          return '<td>'+fmtVal(v)+'</td>';
        }).join('')+
        '<td><div class="acts">'+
        '<button class="btn sm" data-sid="'+sidEdit+'" onclick="APP.runStor(this.dataset.sid)">✏️ تعديل</button>'+
        '<button class="btn sm danger" data-sid="'+sidDel+'" onclick="APP.runStor(this.dataset.sid)">🗑</button>'+
        '<button class="btn sm" data-sid="'+sidDrill+'" onclick="APP.runStor(this.dataset.sid)">↪</button>'+
        '</div></td></tr>';
    }).join('');
    tableHtml='<div class="card"><div class="card-scroll"><table style="min-width:600px">'+
      '<thead><tr><th>المعرف</th>'+cols.map(c=>'<th>'+h(c)+'</th>').join('')+'<th>إجراءات</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
  } else {
    const rows=keys.map(k=>{
      const v=node[k];
      const isObj=v&&typeof v==='object';
      const sidEdit=stor(isObj?{action:'drillPath',base:fpath,key:k}:{action:'modalScalar',fpath:fpath+'/'+k,val:v});
      const sidDel =stor({action:'delNode',fpath:fpath+'/'+k});
      return '<tr>'+
        '<td><code>'+h(k)+'</code></td>'+
        '<td>'+(isObj?'<span class="nest" data-sid="'+stor({action:'drillPath',base:fpath,key:k})+'" onclick="APP.runStor(this.dataset.sid)">📁 '+Object.keys(v).length+' عنصر</span>':fmtVal(v))+'</td>'+
        '<td>'+badge(v)+'</td>'+
        '<td><div class="acts">'+
        '<button class="btn sm" data-sid="'+sidEdit+'" onclick="APP.runStor(this.dataset.sid)">'+(isObj?'↪ فتح':'✏️ تعديل')+'</button>'+
        '<button class="btn sm danger" data-sid="'+sidDel+'" onclick="APP.runStor(this.dataset.sid)">🗑</button>'+
        '</div></td></tr>';
    }).join('');
    tableHtml='<div class="card"><div class="card-scroll"><table>'+
      '<thead><tr><th>المفتاح</th><th>القيمة</th><th>النوع</th><th>إجراءات</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
  }

  const sidAdd  =stor({action:'modalAddField',fpath});
  const sidJson =stor({action:'modalJson',fpath});
  const sidDelAll=stor({action:'delNode',fpath});

  setMain(bc+
    '<div class="hdr"><h2>'+h(PATH[PATH.length-1])+' <span style="font-size:12px;color:#9ca3af;font-weight:400">('+keys.length+' عنصر)</span></h2>'+
    '<button class="btn sm green" data-sid="'+sidAdd+'" onclick="APP.runStor(this.dataset.sid)">➕ إضافة</button>'+
    '<button class="btn sm" data-sid="'+sidJson+'" onclick="APP.runStor(this.dataset.sid)">📄 JSON</button>'+
    '<button class="btn sm danger" data-sid="'+sidDelAll+'" onclick="APP.runStor(this.dataset.sid)">🗑 حذف الكل</button></div>'+
    '<div class="srch"><span>🔍</span><input placeholder="بحث في البيانات..." oninput="APP.filter(this.value)"></div>'+
    '<div id="tbl">'+tableHtml+'</div>'
  );
}

// ── Action dispatcher ─────────────────────────────────────
function runStor(sid){
  const d=STORE[sid]; if(!d) return;
  const a=d.action;
  if(a==='openCol') openCol(d.key);
  else if(a==='delNode') delNode(d.fpath);
  else if(a==='drillPath') drillPath(d.base,d.key);
  else if(a==='modalScalar') modalScalar(d.fpath,d.val);
  else if(a==='modalEditRow') modalEditRow(d.fpath,d.key,d.row);
  else if(a==='modalAddField') modalAddField(d.fpath);
  else if(a==='modalJson') modalJson(d.fpath);
}

function openCol(key){ activeSb(key); PATH=[key]; renderNode(); }
function filter(q){ $('tbl')&&$('tbl').querySelectorAll('tbody tr').forEach(r=>{ r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'; }); }

// ── Modals ───────────────────────────────────────────────
function openModal(title,body,onSave,saveLabel='حفظ'){
  $('modals').innerHTML=
    '<div class="ov" id="ov">'+
    '<div class="modal">'+
    '<div class="mh"><h3>'+h(title)+'</h3><button class="btn sm" onclick="APP.closeModal()">✕</button></div>'+
    '<div class="mb">'+body+'</div>'+
    '<div class="mf">'+
    '<button class="btn" onclick="APP.closeModal()">إلغاء</button>'+
    '<button class="btn primary" id="msave">✔ '+h(saveLabel)+'</button>'+
    '</div></div></div>';
  $('msave').onclick=onSave;
  $('ov').addEventListener('click',e=>{ if(e.target===$('ov')) closeModal(); });
}
function closeModal(){ $('modals').innerHTML=''; }

// Edit record row
function modalEditRow(fpath,key,row){
  const isObj = row&&typeof row==='object';
  const entries= isObj?Object.entries(row):[['value',row]];
  const PREFIX='mfld_'+SID+'_';
  const inputs=entries.map(([k,v])=>{
    const fid=PREFIX+k.replace(/\W/g,'_');
    const isO=v&&typeof v==='object';
    return '<div class="fl"><label><code>'+h(k)+'</code> <span class="hint" style="display:inline">'+typeof v+'</span></label>'+
      (isO
        ? '<textarea id="'+fid+'" rows="4">'+h(JSON.stringify(v,null,2))+'</textarea>'
        : '<input id="'+fid+'" value="'+h(String(v===null?'':v))+'">')+
      '</div>';
  }).join('');
  openModal('تعديل: '+key, inputs, async ()=>{
    const updates={};
    let ok=true;
    for(const [k,v] of entries){
      const fid=PREFIX+k.replace(/\W/g,'_');
      const el=$(fid); if(!el) continue;
      let val=el.value;
      if(v&&typeof v==='object'){ try{val=JSON.parse(val);}catch(e){toast('JSON خطأ في: '+k,false);ok=false;break;} }
      else if(v===true||v===false){ val=val==='true'; }
      else if(typeof v==='number'){ val=isNaN(Number(val))?val:Number(val); }
      updates[k]=val;
    }
    if(!ok) return;
    closeModal();
    try{ await fbUpdate(fpath,updates); toast('تم التحديث ✓'); reload(); }
    catch(e){ toast(e.message,false); }
  });
}

// Edit scalar
function modalScalar(fpath,val){
  const key=fpath.split('/').pop();
  const fid='scl_'+SID;
  openModal('تعديل: '+key,
    '<div class="fl"><label>القيمة <span class="hint" style="display:inline">('+typeof val+')</span></label>'+
    '<input id="'+fid+'" value="'+h(String(val===null?'':val))+'"></div>',
    async ()=>{
      let nv=$(fid).value;
      if(typeof val==='number') nv=isNaN(Number(nv))?nv:Number(nv);
      if(typeof val==='boolean') nv=nv==='true';
      closeModal();
      try{ await fbSet(fpath,nv); toast('تم التحديث ✓'); reload(); }
      catch(e){ toast(e.message,false); }
    }
  );
}

// Add field
function modalAddField(fpath){
  openModal('إضافة حقل جديد',
    '<div class="fl"><label>المفتاح</label><input id="nk" placeholder="اسم الحقل"></div>'+
    '<div class="fl"><label>النوع</label>'+
    '<select id="nt" onchange="APP.toggleNt()">'+
    '<option value="string">نص (string)</option>'+
    '<option value="number">رقم (number)</option>'+
    '<option value="boolean">منطقي (boolean)</option>'+
    '<option value="json">JSON / Object</option>'+
    '</select></div>'+
    '<div id="nvw"><div class="fl"><label>القيمة</label><input id="nv" placeholder="القيمة"></div></div>',
    async ()=>{
      const k=$('nk').value.trim();
      if(!k){toast('أدخل اسم الحقل',false);return;}
      const t=$('nt').value;
      const el=$('nv'); if(!el){toast('خطأ',false);return;}
      let v=el.value;
      if(t==='number') v=Number(v);
      else if(t==='boolean') v=v==='true';
      else if(t==='json'){try{v=JSON.parse(v);}catch(e){toast('JSON غير صحيح',false);return;}}
      closeModal();
      try{ await fbSet(fpath+'/'+k,v); toast('تمت الإضافة ✓'); reload(); }
      catch(e){ toast(e.message,false); }
    },'إضافة'
  );
}
function toggleNt(){
  const t=$('nt').value, w=$('nvw');
  if(t==='json') w.innerHTML='<div class="fl"><label>قيمة JSON</label><textarea id="nv" rows="4">{}</textarea></div>';
  else if(t==='boolean') w.innerHTML='<div class="fl"><label>القيمة</label><select id="nv"><option>true</option><option>false</option></select></div>';
  else w.innerHTML='<div class="fl"><label>القيمة</label><input id="nv" placeholder="القيمة"></div>';
}

// JSON editor
async function modalJson(fpath){
  const data=await fbGet(fpath);
  const fid='rj_'+SID;
  openModal('تعديل JSON: '+fpath,
    '<div class="fl"><label>البيانات</label><textarea id="'+fid+'" rows="12">'+h(JSON.stringify(data,null,2))+'</textarea></div>',
    async ()=>{
      let nd; try{nd=JSON.parse($(fid).value);}catch(e){toast('JSON غير صحيح',false);return;}
      closeModal();
      try{ await fbSet(fpath,nd); toast('تم الحفظ ✓'); reload(); }
      catch(e){ toast(e.message,false); }
    },'حفظ JSON'
  );
}

// New collection
function modalNewCol(){
  openModal('مجموعة جديدة',
    '<div class="fl"><label>اسم المجموعة</label><input id="cn" placeholder="مثال: products"></div>'+
    '<div class="fl"><label>معرف أول سجل</label><input id="ck" placeholder="مثال: item_001"></div>'+
    '<div class="fl"><label>البيانات (JSON)</label><textarea id="cv" rows="5">{"name": "", "value": 0}</textarea></div>',
    async ()=>{
      const col=$('cn').value.trim(), key=$('ck').value.trim();
      if(!col||!key){toast('أدخل الاسم والمعرف',false);return;}
      let val; try{val=JSON.parse($('cv').value);}catch(e){toast('JSON غير صحيح',false);return;}
      closeModal();
      try{ await fbSet(col+'/'+key,val); toast('تم الإنشاء ✓'); reloadFull(true); }
      catch(e){ toast(e.message,false); }
    },'إنشاء'
  );
}

// Show raw JSON
function showRaw(){
  $('sbList').querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  PATH=[];
  setMain(
    '<div class="hdr"><h2>JSON كامل لقاعدة البيانات</h2>'+
    '<button class="btn sm" onclick="navigator.clipboard.writeText(JSON.stringify(ROOT,null,2)).then(()=>APP.toast(\'تم النسخ ✓\'))">📋 نسخ</button>'+
    '<button class="btn sm primary" onclick="APP.modalJsonRoot()">✏️ تعديل مباشر</button></div>'+
    '<div class="jpre">'+h(JSON.stringify(ROOT,null,2))+'</div>'
  );
}
async function modalJsonRoot(){
  const fid='rjr_'+SID;
  openModal('تعديل JSON كامل',
    '<div class="fl"><label>البيانات الكاملة</label><textarea id="'+fid+'" rows="14">'+h(JSON.stringify(ROOT,null,2))+'</textarea></div>',
    async ()=>{
      let nd; try{nd=JSON.parse($(fid).value);}catch(e){toast('JSON غير صحيح',false);return;}
      closeModal();
      try{ await fbSet('/',nd); toast('تم الحفظ ✓'); reloadFull(false); }
      catch(e){ toast(e.message,false); }
    },'حفظ'
  );
}

// Delete
async function delNode(fpath){
  if(!confirm('هل أنت متأكد من حذف:\n'+fpath+'\n\nلا يمكن التراجع!')) return;
  try{ await fbDel(fpath); toast('تم الحذف ✓'); reloadFull(PATH.join('/')===fpath); }
  catch(e){ toast(e.message,false); }
}

// Reload
async function reload(){
  const saved=[...PATH];
  ROOT=(await fbGet('/'))||{};
  buildSidebar();
  PATH=saved;
  if(PATH.length){ activeSb(PATH[0]); renderNode(); } else showHome();
}
async function reloadFull(goHome){
  ROOT=(await fbGet('/'))||{};
  buildSidebar();
  if(goHome||!PATH.length) showHome(); else renderNode();
}
async function refreshAll(){ PATH=[]; await loadRoot(); }

// Toast
function toast(msg,ok=true){
  const el=document.createElement('div');
  el.className='toast '+(ok?'ok':'err');
  el.textContent=(ok?'✓ ':'✗ ')+msg;
  $('toasts').appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

// ── Expose to global for onclick ─────────────────────────
window.APP={
  openCol,showHome,showRaw,showRaw,refreshAll,closeModal,toggleNt,filter,navTo,
  runStor,modalNewCol,modalJsonRoot,toast
};

// ── Start ────────────────────────────────────────────────
loadRoot();
</script>
