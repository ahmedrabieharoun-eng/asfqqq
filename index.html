<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAG RACE - PHOTOREALISTIC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }

        /* حاوية المشهد ثلاثي الأبعاد */
        #scene {
            position: absolute;
            width: 100vw; height: 100vh;
            perspective: 800px; /* عمق المشهد */
            overflow: hidden;
        }

        /* السماء */
        #sky {
            position: absolute;
            width: 100%; height: 55%;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); /* تدرج واقعي */
            z-index: 0;
        }

        /* السحب */
        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.6);
            border-radius: 50px;
            filter: blur(15px);
            animation: floatCloud 40s linear infinite;
        }
        @keyframes floatCloud { from { transform: translateX(-100vw); } to { transform: translateX(100vw); } }

        /* الجبال */
        #mountains {
            position: absolute;
            bottom: 45%; width: 100%; height: 25%;
            z-index: 1;
        }
        .mountain {
            position: absolute; bottom: 0;
            background: #1a252f;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* الطريق الأسفلتي */
        #road {
            position: absolute;
            bottom: -100px; left: 50%;
            width: 3000px; height: 2000px;
            transform: translateX(-50%) rotateX(65deg); /* المنظور */
            transform-origin: bottom center;
            background: #111;
            z-index: 2;
            /* خطوط الطريق */
            background-image: 
                linear-gradient(90deg, transparent 49%, #fff 49%, #fff 51%, transparent 51%),
                repeating-linear-gradient(to bottom, transparent 0px, transparent 100px, rgba(255,255,255,0.5) 100px, rgba(255,255,255,0.5) 200px);
            background-size: 100% 100%, 100% 400px;
            box-shadow: 0 0 200px #000;
        }

        /* العشب على الجوانب */
        #road::before, #road::after {
            content: ''; position: absolute; top: 0; width: 500px; height: 100%;
        }
        #road::before { left: -600px; background: linear-gradient(to right, #0b140b, #1e3c1e); }
        #road::after { right: -600px; background: linear-gradient(to left, #0b140b, #1e3c1e); }

        /* النخيل */
        #palms {
            position: absolute; bottom: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none;
        }
        .palm {
            position: absolute; bottom: 40%;
            font-size: 150px; /* حجم النخلة */
            filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.8));
        }

        /* تأثير الظلام على الأطراف (Vignette) */
        #vignette {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.8) 100%);
            z-index: 4; pointer-events: none;
        }

        /* واجهة المستخدم HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }
        
        .info-panel {
            position: absolute; top: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff; padding: 15px; border-radius: 15px;
            border: 1px solid #444; backdrop-filter: blur(5px);
            min-width: 200px;
        }
        #p1-panel { right: 20px; text-align: right; }
        #p2-panel { left: 20px; text-align: left; }

        .stat { font-size: 18px; margin: 5px 0; font-weight: bold; }
        .val { color: #00ffcc; }

        #center-hud {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%); text-align: center;
        }
        #timer { font-size: 70px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #000; font-family: monospace; }
        
        #lights { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
        .light { width: 50px; height: 50px; border-radius: 50%; background: #222; border: 3px solid #555; transition: 0.1s; }
        .light.active { background: #ff0000; box-shadow: 0 0 30px #ff0000; border-color: #ff5555; }
        .light.green { background: #00ff00; box-shadow: 0 0 30px #00ff00; border-color: #55ff55; }

        #bars-container {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            width: 60%; display: flex; gap: 20px;
        }
        .prog-track { flex: 1; height: 15px; background: #333; border-radius: 10px; overflow: hidden; border: 1px solid #555; }
        .prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff0, #f00); transition: width 0.1s; }

        #message {
            position: absolute; top: 60%; width: 100%; text-align: center;
            font-size: 40px; color: yellow; font-weight: bold; text-shadow: 0 0 10px black;
            display: none;
        }
        
        #hint {
            position: absolute; bottom: 30px; width: 100%; text-align: center;
            color: #aaa; font-size: 20px; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

    </style>
</head>
<body>

<div id="scene">
    <div id="sky">
        <div class="cloud" style="top:10%; left:10%; width:200px; height:60px;"></div>
        <div class="cloud" style="top:20%; left:60%; width:300px; height:80px; animation-duration:50s;"></div>
    </div>
    <div id="mountains">
        <div class="mountain" style="left:-5%; width:40%; height:100%; background:#15202b;"></div>
        <div class="mountain" style="right:-5%; width:40%; height:80%; background:#15202b;"></div>
        <div class="mountain" style="left:35%; width:30%; height:120%; background:#0f161c;"></div>
    </div>
    <div id="road"></div>
    <div id="palms"></div>
    <div id="vignette"></div>
</div>

<div id="hud">
    <div id="bars-container">
        <div class="prog-track"><div class="prog-fill" id="p1-fill"></div></div>
        <div class="prog-track"><div class="prog-fill" id="p2-fill"></div></div>
    </div>

    <div id="p1-panel" class="info-panel">
        <div style="color:#ff5555; font-size:20px; margin-bottom:5px;">🏎 لاعب 1</div>
        <div class="stat">السرعة: <span id="p1-speed" class="val">0</span> km/h</div>
        <div class="stat">RPM: <span id="p1-rpm" class="val">0</span></div>
        <div class="stat">الترس: <span id="p1-gear" class="val">N</span></div>
    </div>

    <div id="p2-panel" class="info-panel">
        <div style="color:#5555ff; font-size:20px; margin-bottom:5px;">لاعب 2 🏎</div>
        <div class="stat">السرعة: <span id="p2-speed" class="val">0</span> km/h</div>
        <div class="stat">RPM: <span id="p2-rpm" class="val">0</span></div>
        <div class="stat">الترس: <span id="p2-gear" class="val">N</span></div>
    </div>

    <div id="center-hud">
        <div id="lights">
            <div class="light" id="l1"></div>
            <div class="light" id="l2"></div>
            <div class="light" id="l3"></div>
        </div>
        <div id="timer">0.000</div>
    </div>

    <div id="message"></div>
    <div id="hint">اضغط SPACE للانطلاق</div>
</div>

<script>
    // إعداد النخيل
    const palmsDiv = document.getElementById('palms');
    for(let i=0; i<12; i++) {
        let p = document.createElement('div');
        p.className = 'palm';
        p.innerHTML = '';
        // توزيع عشوائي على الجانبين
        let side = Math.random() > 0.5 ? 1 : -1;
        p.style.left = (50 + side * (15 + Math.random() * 35)) + '%';
        p.style.bottom = (40 + Math.random() * 15) + '%';
        p.style.transform = `scale(${0.5 + Math.random()}) rotate(${Math.random()*10 - 5}deg)`;
        palmsDiv.appendChild(p);
    }

    // متغيرات اللعبة
    let gameState = 'idle'; // idle, countdown, racing, end
    let raceTime = 0;
    let startTime = 0;
    
    const cars = {
        p1: { speed: 0, rpm: 0, gear: 0, dist: 0, power: 1.1 }, // لاعب أقوى قليلاً
        p2: { speed: 0, rpm: 0, gear: 0, dist: 0, power: 0.95 }  // خصم
    };

    const els = {
        p1: { speed: document.getElementById('p1-speed'), rpm: document.getElementById('p1-rpm'), gear: document.getElementById('p1-gear'), fill: document.getElementById('p1-fill') },
        p2: { speed: document.getElementById('p2-speed'), rpm: document.getElementById('p2-rpm'), gear: document.getElementById('p2-gear'), fill: document.getElementById('p2-fill') },
        timer: document.getElementById('timer'),
        msg: document.getElementById('message'),
        hint: document.getElementById('hint'),
        lights: [document.getElementById('l1'), document.getElementById('l2'), document.getElementById('l3')]
    };

    function updatePhysics(car, dt, isPlayer) {
        if (car.gear === 0) return;
        
        // محاكاة فيزياء بسيطة
        let maxRpm = 8000;
        let gearRatios = [0, 3.5, 2.8, 2.1, 1.6, 1.2]; // نسب التروس
        let ratio = gearRatios[car.gear];
        
        // زيادة RPM
        let throttle = isPlayer ? 1.0 : 0.9; // AI ثابت
        car.rpm += (2000 * throttle * dt * ratio);
        if (car.rpm > maxRpm) car.rpm = maxRpm; // Cut-off
        
        // حساب السرعة
        car.speed = (car.rpm / maxRpm) * 320 / ratio;
        
        // التعشيق التلقائي (Auto Shift)
        if (car.rpm > 7000 && car.gear < 6) {
            car.gear++;
            car.rpm = 4000; // هبوط RPM عند التعشيق
        }

        // المسافة (متر)
        car.dist += (car.speed / 3.6) * dt;
    }

    function loop(timestamp) {
        if (!startTime && gameState === 'racing') startTime = timestamp;
        
        if (gameState === 'racing') {
            let now = timestamp;
            let dt = (now - (lastTime || now)) / 1000;
            lastTime = now;
            raceTime = (now - startTime) / 1000;

            updatePhysics(cars.p1, dt, true);
            updatePhysics(cars.p2, dt, false);

            // تحديث الواجهة
            ['p1', 'p2'].forEach(p => {
                let c = cars[p];
                els[p].speed.innerText = Math.floor(c.speed);
                els[p].rpm.innerText = Math.floor(c.rpm);
                els[p].gear.innerText = c.gear === 0 ? 'N' : c.gear;
                els[p].fill.style.width = Math.min(100, (c.dist / 402) * 100) + '%';
            });

            els.timer.innerText = raceTime.toFixed(3);

            // شرط الفوز (402 متر = ربع ميل)
            if (cars.p1.dist >= 402 || cars.p2.dist >= 402) {
                gameState = 'end';
                let winner = cars.p1.dist >= 402 ? '🏆 فاز لاعب 1' : 'فاز لاعب 2';
                els.msg.innerText = `${winner} | الوقت: ${raceTime.toFixed(3)}s`;
                els.msg.style.display = 'block';
                els.hint.innerText = "اضغط SPACE لإعادة اللعب";
            }
        }
        requestAnimationFrame(loop);
    }

    let lastTime = 0;
    requestAnimationFrame(loop);

    // التحكم
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            if (gameState === 'idle') {
                startRace();
            } else if (gameState === 'end') {
                resetRace();
            } else if (gameState === 'racing') {
                // تعشيق يدوي للاعب
                if (cars.p1.rpm > 6000 && cars.p1.gear < 6) {
                    cars.p1.gear++;
                    cars.p1.rpm = 4500;
                }
            }
        }
    });

    function startRace() {
        gameState = 'countdown';
        els.hint.innerText = "";
        let step = 0;
        els.lights.forEach(l => { l.classList.remove('active', 'green'); });
        
        let interval = setInterval(() => {
            if (step < 3) {
                els.lights[step].classList.add('active');
                step++;
            } else {
                clearInterval(interval);
                els.lights.forEach(l => { l.classList.remove('active'); l.classList.add('green'); });
                gameState = 'racing';
                startTime = 0;
                cars.p1.gear = 1;
                cars.p2.gear = 1;
            }
        }, 1000);
    }

    function resetRace() {
        gameState = 'idle';
        raceTime = 0;
        cars.p1 = { speed: 0, rpm: 0, gear: 0, dist: 0, power: 1.1 };
        cars.p2 = { speed: 0, rpm: 0, gear: 0, dist: 0, power: 0.95 };
        els.timer.innerText = "0.000";
        els.msg.style.display = 'none';
        els.hint.innerText = "اضغط SPACE للانطلاق";
        els.lights.forEach(l => l.className = 'light');
        ['p1', 'p2'].forEach(p => els[p].fill.style.width = '0%');
    }
</script>
</body>
</html>
