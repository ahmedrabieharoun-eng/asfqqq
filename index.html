<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAG RACE — PHOTOREALISTIC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  #canvas-container { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100% !important; height: 100% !important; }

  /* ============ OVERLAYS ============ */
  #vignette {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  #speed-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 6; opacity: 0; transition: opacity 0.25s;
    background: radial-gradient(ellipse at center, transparent 20%, rgba(180,200,255,0.04) 100%);
  }
  #chromatic-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 7; opacity: 0;
    mix-blend-mode: screen;
  }
  #heat-canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 4; opacity: 0.35;
  }
  #lens-flare {
    position: absolute; pointer-events: none; z-index: 8;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,180,0.45) 0%, rgba(255,200,80,0.15) 40%, transparent 70%);
    display: none;
    transform: translate(-50%,-50%);
    filter: blur(6px);
  }

  /* ============ HUD ============ */
  #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

  /* ---- P1 HUD ---- */
  #p1-hud {
    position: absolute; top: 16px; left: 16px;
    background: linear-gradient(135deg, rgba(0,0,0,0.72) 0%, rgba(20,10,0,0.65) 100%);
    border: 1px solid rgba(255,180,0,0.45);
    border-radius: 14px;
    padding: 14px 20px;
    min-width: 190px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,200,0,0.12);
  }
  /* ---- P2 HUD ---- */
  #p2-hud {
    position: absolute; top: 16px; right: 16px;
    background: linear-gradient(135deg, rgba(0,0,0,0.72) 0%, rgba(0,10,30,0.65) 100%);
    border: 1px solid rgba(0,160,255,0.45);
    border-radius: 14px;
    padding: 14px 20px;
    min-width: 190px;
    text-align: right;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(0,180,255,0.12);
  }
  .car-name {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  #p1-hud .car-name { color: #FFB800; }
  #p2-hud .car-name { color: #00CFFF; }

  /* Speed gauge circle */
  .speed-gauge-wrap { position: relative; display: inline-flex; align-items: center; margin-bottom: 6px; }
  .speed-num {
    font-size: 38px; font-weight: 900; color: #fff; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }
  .speed-unit { font-size: 11px; color: rgba(255,255,255,0.45); margin-left: 4px; align-self: flex-end; margin-bottom: 4px; }

  /* RPM bar */
  .rpm-label { font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; }
  .rpm-bar-bg {
    width: 100%; height: 6px; background: rgba(255,255,255,0.07);
    border-radius: 3px; overflow: hidden;
  }
  .rpm-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.06s linear, background 0.1s;
    background: linear-gradient(90deg, #00FF88, #FFB800, #FF2200);
    background-size: 200% 100%;
    background-position: 0% 0%;
  }
  .gear-row {
    display: flex; align-items: baseline; margin-top: 7px; gap: 8px;
  }
  .gear-label { font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 2px; text-transform: uppercase; }
  .gear-num { font-size: 22px; font-weight: 900; color: #FF8C00; line-height: 1; }
  #p2-hud .gear-row { flex-direction: row-reverse; }
  #p2-hud .gear-num { color: #00CFFF; }

  /* ---- TIMER ---- */
  #timer-hud {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 28px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .timer-label { font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 3px; }
  .timer-value { font-size: 28px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: 2px; }

  /* ---- PROGRESS BARS ---- */
  .prog-wrap { position: absolute; bottom: 28px; width: 38%; height: 5px; }
  #p1-prog-wrap { left: 5%; }
  #p2-prog-wrap { right: 5%; }
  .prog-label { font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
  #p2-prog-wrap .prog-label { text-align: right; }
  .prog-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  #p1-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #FFB800, #FF4400); width: 0%; transition: width 0.05s; }
  #p2-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0088FF, #AA00FF); width: 0%; transition: width 0.05s; }

  /* ---- COUNTDOWN ---- */
  #countdown {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    font-size: 160px; font-weight: 900; color: #fff;
    text-shadow: 0 0 40px rgba(255,60,60,0.95), 0 0 80px rgba(255,60,60,0.5), 5px 5px 0 #000;
    letter-spacing: 4px; pointer-events: none;
    display: none; text-align: center; white-space: nowrap;
    animation: countPulse 0.6s ease-out;
  }
  #countdown.go {
    color: #00FF88;
    text-shadow: 0 0 40px rgba(0,255,120,0.95), 0 0 80px rgba(0,255,120,0.5), 5px 5px 0 #003300;
    font-size: 180px;
  }
  @keyframes countPulse {
    0% { transform: translate(-50%,-50%) scale(1.6); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  }

  /* ---- WINNER BANNER ---- */
  #winner-banner {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.88);
    border: 2px solid #FFB800;
    border-radius: 20px;
    padding: 40px 70px;
    text-align: center;
    display: none; pointer-events: all; z-index: 25;
    backdrop-filter: blur(20px) saturate(1.4);
    box-shadow: 0 0 80px rgba(255,180,0,0.35), 0 20px 60px rgba(0,0,0,0.7);
  }
  #winner-title { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 5px; text-transform: uppercase; margin-bottom: 10px; }
  #winner-name { font-size: 56px; font-weight: 900; color: #FFB800; text-shadow: 0 0 30px rgba(255,180,0,0.7); margin-bottom: 10px; }
  #winner-time { font-size: 18px; color: rgba(255,255,255,0.7); margin-bottom: 5px; }
  #winner-margin { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 32px; }
  #race-again-btn {
    background: linear-gradient(135deg, #FFB800, #FF5500);
    color: #000; border: none; border-radius: 50px;
    padding: 15px 50px; font-size: 16px; font-weight: 800;
    cursor: pointer; text-transform: uppercase; letter-spacing: 3px;
    transition: transform 0.12s, box-shadow 0.12s;
    pointer-events: all;
    box-shadow: 0 4px 20px rgba(255,100,0,0.4);
  }
  #race-again-btn:hover { transform: scale(1.06); box-shadow: 0 8px 36px rgba(255,140,0,0.6); }
  #race-again-btn:active { transform: scale(0.97); }

  /* ---- LAUNCH INDICATOR ---- */
  #launch-hint {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 3px;
    text-transform: uppercase; pointer-events: none;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
</style>
</head>
<body>
<div id="canvas-container">
  <canvas id="c"></canvas>
  <canvas id="heat-canvas"></canvas>
  <div id="vignette"></div>
  <div id="speed-overlay"></div>
  <div id="lens-flare"></div>

  <!-- HUD -->
  <div id="hud">
    <!-- P1 -->
    <div id="p1-hud">
      <div class="car-name">🏎 Player 1</div>
      <div class="speed-gauge-wrap">
        <span class="speed-num" id="p1-speed">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="rpm-label">RPM</div>
      <div class="rpm-bar-bg"><div class="rpm-fill" id="p1-rpm" style="width:0%"></div></div>
      <div class="gear-row">
        <span class="gear-label">GEAR</span>
        <span class="gear-num" id="p1-gear">N</span>
      </div>
    </div>

    <!-- Timer -->
    <div id="timer-hud">
      <div class="timer-label">⏱ Race Time</div>
      <div class="timer-value" id="timer-val">0.000</div>
    </div>

    <!-- P2 -->
    <div id="p2-hud">
      <div class="car-name">Player 2 🏎</div>
      <div class="speed-gauge-wrap" style="flex-direction:row-reverse;width:100%;">
        <span class="speed-num" id="p2-speed">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="rpm-label" style="text-align:right">RPM</div>
      <div class="rpm-bar-bg"><div class="rpm-fill" id="p2-rpm" style="width:0%;background:linear-gradient(90deg,#00CFFF,#0044FF,#AA00FF);"></div></div>
      <div class="gear-row" style="flex-direction:row-reverse;">
        <span class="gear-label">GEAR</span>
        <span class="gear-num" id="p2-gear">N</span>
      </div>
    </div>

    <!-- Progress Bars -->
    <div class="prog-wrap" id="p1-prog-wrap">
      <div class="prog-label">P1 Progress</div>
      <div class="prog-bg"><div id="p1-fill"></div></div>
    </div>
    <div class="prog-wrap" id="p2-prog-wrap">
      <div class="prog-label" style="text-align:right">P2 Progress</div>
      <div class="prog-bg"><div id="p2-fill"></div></div>
    </div>

    <!-- Countdown -->
    <div id="countdown"></div>

    <!-- Winner -->
    <div id="winner-banner">
      <div id="winner-title">🏆 WINNER</div>
      <div id="winner-name">Player 1</div>
      <div id="winner-time">Time: 0.000s</div>
      <div id="winner-margin">Won by 0.000s</div>
      <button id="race-again-btn">🔁 Race Again</button>
    </div>

    <div id="launch-hint" style="display:none">Press SPACE or tap to launch</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  PHOTOREALISTIC DRAG RACE — Three.js r128
// ============================================================
(function(){
'use strict';

// ---- RENDERER ----
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;

// ---- SCENE ----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8BBCCC, 0.0055);
scene.background = new THREE.Color(0x4A7FA5);

// ---- CAMERA ----
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 4.5, -16);
camera.lookAt(0, 1.2, 0);

// ---- RESIZE ----
window.addEventListener('resize', ()=>{
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// ============================================================
//  PROCEDURAL TEXTURES
// ============================================================
function makeAsphaltTexture(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  // base color
  ctx.fillStyle='#2a2a2a'; ctx.fillRect(0,0,w,h);
  // multi-octave noise for grain
  for(let oct=0;oct<5;oct++){
    const freq=Math.pow(2,oct+1), amp=40/Math.pow(2,oct);
    for(let x=0;x<w;x+=freq){
      for(let y=0;y<h;y+=freq){
        const v=Math.random()*amp-amp/2;
        const c2=Math.floor(42+v);
        ctx.fillStyle=`rgb(${c2},${c2},${c2})`;
        ctx.fillRect(x,y,freq,freq);
      }
    }
  }
  // subtle aggregate stones
  for(let i=0;i<400;i++){
    const x=Math.random()*w, y=Math.random()*h, r=1+Math.random()*3;
    const g=Math.floor(55+Math.random()*30);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=`rgb(${g},${g},${g})`; ctx.fill();
  }
  // center lane dividers -- white dashed
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=6;
  ctx.setLineDash([80,60]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.setLineDash([]);
  // edge lines yellow
  ctx.strokeStyle='rgba(255,220,50,0.65)'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(18,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w-18,0); ctx.lineTo(w-18,h); ctx.stroke();
  // tire marks
  for(let i=0;i<8;i++){
    const xm=w*0.25+Math.random()*w*0.5;
    const ym=Math.random()*h;
    const len=100+Math.random()*200;
    ctx.strokeStyle='rgba(10,10,10,0.55)'; ctx.lineWidth=12+Math.random()*8;
    ctx.beginPath(); ctx.moveTo(xm,ym); ctx.lineTo(xm+(-5+Math.random()*10),ym+len); ctx.stroke();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(2,40);
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeGrassTexture(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#2d5a1b'; ctx.fillRect(0,0,w,h);
  for(let i=0;i<6000;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const r=1+Math.random()*3;
    const gr=Math.floor(40+Math.random()*50);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=`rgb(${20+Math.random()*30},${gr+20},${10+Math.random()*15})`; ctx.fill();
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(8,60);
  return tex;
}

function makeNormalMap(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgb(128,128,255)'; ctx.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=4){
    for(let y=0;y<h;y+=4){
      const nx=Math.floor(128+(Math.random()-0.5)*40);
      const ny=Math.floor(128+(Math.random()-0.5)*40);
      ctx.fillStyle=`rgb(${nx},${ny},255)`; ctx.fillRect(x,y,4,4);
    }
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(4,80);
  return tex;
}

function makeTrunkTexture(){
  const c=document.createElement('canvas'); c.width=64; c.height=256;
  const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,64,0);
  g.addColorStop(0,'#3d2a1a'); g.addColorStop(0.3,'#5a3c22'); g.addColorStop(0.7,'#4a3018'); g.addColorStop(1,'#3d2a1a');
  ctx.fillStyle=g; ctx.fillRect(0,0,64,256);
  // bark lines
  for(let y=0;y<256;y+=8+Math.floor(Math.random()*6)){
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(64,y+(Math.random()*4-2)); ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

// ============================================================
//  LIGHTING
// ============================================================
// Sky hemisphere
const hemi = new THREE.HemisphereLight(0x87CEEB, 0x5C4A1E, 0.55);
scene.add(hemi);

// Warm golden-hour sun
const sun = new THREE.DirectionalLight(0xFFF4E0, 2.2);
sun.position.set(60, 80, -120);
sun.castShadow = true;
sun.shadow.mapSize.width  = 4096;
sun.shadow.mapSize.height = 4096;
sun.shadow.camera.near = 1;
sun.shadow.camera.far  = 400;
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top   = 60;
sun.shadow.camera.bottom= -60;
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// Ambient fill
const ambFill = new THREE.DirectionalLight(0xB0C8E0, 0.4);
ambFill.position.set(-40, 30, 60);
scene.add(ambFill);

// Ground bounce
const groundBounce = new THREE.DirectionalLight(0xE0C880, 0.18);
groundBounce.position.set(0, -10, 0);
scene.add(groundBounce);

// ============================================================
//  SKY GRADIENT (custom sphere)
// ============================================================
(function buildSky(){
  const skyGeo = new THREE.SphereGeometry(800, 32, 16);
  const skyCanvas = document.createElement('canvas'); skyCanvas.width=2; skyCanvas.height=512;
  const sCtx = skyCanvas.getContext('2d');
  const sg = sCtx.createLinearGradient(0,0,0,512);
  sg.addColorStop(0, '#1a4a7a');
  sg.addColorStop(0.3, '#3a78b5');
  sg.addColorStop(0.55, '#6ba3c8');
  sg.addColorStop(0.72, '#c07030');
  sg.addColorStop(0.85, '#e09050');
  sg.addColorStop(1, '#f0b878');
  sCtx.fillStyle=sg; sCtx.fillRect(0,0,2,512);
  const skyTex = new THREE.CanvasTexture(skyCanvas);
  skyTex.mapping = THREE.EquirectangularReflectionMapping;
  const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide });
  const skyMesh = new THREE.Mesh(skyGeo, skyMat);
  scene.add(skyMesh);
  // Use as env map too
  scene.environment = skyTex;
})();

// ============================================================
//  TRACK
// ============================================================
const TRACK_LENGTH = 860;
const TRACK_WIDTH  = 22;
const asphaltTex   = makeAsphaltTexture(1024, 1024);
const normalTex    = makeNormalMap(512, 512);
const grassTex     = makeGrassTexture(512, 512);

// Road
const roadGeo  = new THREE.PlaneGeometry(TRACK_WIDTH, TRACK_LENGTH, 4, 60);
const roadMat  = new THREE.MeshStandardMaterial({
  map: asphaltTex, normalMap: normalTex, normalScale: new THREE.Vector2(0.4, 0.4),
  roughness: 0.88, metalness: 0.04, envMapIntensity: 0.3
});
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI/2;
road.position.set(0, 0, TRACK_LENGTH/2 - 10);
road.receiveShadow = true;
scene.add(road);

// Grass left
const gGeo  = new THREE.PlaneGeometry(200, TRACK_LENGTH+100);
const gMat  = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95, metalness: 0 });
const grassL = new THREE.Mesh(gGeo, gMat); grassL.rotation.x=-Math.PI/2;
grassL.position.set(-111, -0.01, TRACK_LENGTH/2-10); grassL.receiveShadow=true; scene.add(grassL);
const grassR = new THREE.Mesh(gGeo, gMat); grassR.rotation.x=-Math.PI/2;
grassR.position.set(111, -0.01, TRACK_LENGTH/2-10); grassR.receiveShadow=true; scene.add(grassR);

// ---- Crash barriers ----
function makeBarrier(x, z, len){
  const g = new THREE.BoxGeometry(0.55, 0.9, len);
  const m = new THREE.MeshStandardMaterial({ color:0xCC2200, roughness:0.55, metalness:0.1,
    envMapIntensity:0.5 });
  const b = new THREE.Mesh(g, m); b.position.set(x, 0.45, z);
  b.castShadow = b.receiveShadow = true;
  scene.add(b);
  // white stripe
  const sg = new THREE.BoxGeometry(0.56, 0.28, len); sg.translate(0, 0.1, 0);
  const sm = new THREE.MeshStandardMaterial({ color:0xFFFFFF, roughness:0.5, metalness:0.05 });
  const sb = new THREE.Mesh(sg, sm); sb.position.set(x, 0.55, z);
  scene.add(sb);
}
makeBarrier(-TRACK_WIDTH/2-0.3, TRACK_LENGTH/2-10, TRACK_LENGTH+20);
makeBarrier( TRACK_WIDTH/2+0.3, TRACK_LENGTH/2-10, TRACK_LENGTH+20);

// ---- Mountains ----
(function buildMountains(){
  const pts = [];
  for(let i=0;i<=20;i++){
    const t=i/20;
    pts.push(new THREE.Vector3((t-0.5)*1200, 40+80*Math.sin(t*Math.PI*3+1)*Math.sin(t*Math.PI*5), 650+Math.random()*100));
  }
  // simple layered planes as mountain silhouettes
  for(let layer=0;layer<3;layer++){
    const geo = new THREE.PlaneGeometry(1400, 140+layer*40, 30, 1);
    const pos = geo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i);
      const noise=Math.sin(x*0.008+layer)*30+Math.sin(x*0.023+layer*2)*20+Math.sin(x*0.041)*12;
      if(pos.getY(i)>0) pos.setY(i, pos.getY(i)+noise);
    }
    geo.computeVertexNormals();
    const r=50-layer*8, g2=65-layer*5, b=55-layer*3;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(r/255, g2/255, b/255),
      roughness:0.95, metalness:0, fog:true,
      transparent: true, opacity: 0.85-layer*0.1
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(0, 50+layer*15, 700-layer*80);
    scene.add(m);
  }
})();

function makePalmTree(x, z){
  const grp = new THREE.Group();
  // trunk
  const tGeo = new THREE.CylinderGeometry(0.22, 0.38, 10, 10);
  for(let i=0;i<tGeo.attributes.position.count;i++){

    p.setX(i, px + Math.sin(py*0.6)*0.3);
    p.setZ(i, p.getZ(i) + Math.cos(py*0.5)*0.2);
  }
  tGeo.computeVertexNormals();
  const tMat = new THREE.MeshStandardMaterial({ map:trunkTex, roughness:0.9, metalness:0 });
  const trunk = new THREE.Mesh(tGeo, tMat); trunk.position.y=5; trunk.castShadow=true;
  grp.add(trunk);
  // fronds
  for(let f=0;f<9;f++){
    const angle=f/9*Math.PI*2;
    const fCanvas=document.createElement('canvas'); fCanvas.width=64; fCanvas.height=256;
    const fCtx=fCanvas.getContext('2d');
    const fg=fCtx.createLinearGradient(0,0,64,256);
    fg.addColorStop(0,'rgba(35,110,30,0.95)');
    fg.addColorStop(0.5,'rgba(50,140,40,0.88)');
    fg.addColorStop(1,'rgba(20,90,15,0)');
    fCtx.fillStyle=fg; fCtx.fillRect(0,0,64,256);
    // vein
    fCtx.strokeStyle='rgba(15,70,10,0.6)'; fCtx.lineWidth=2;
    fCtx.beginPath(); fCtx.moveTo(32,0); fCtx.lineTo(32,256); fCtx.stroke();
    const fTex=new THREE.CanvasTexture(fCanvas);
    const fGeo=new THREE.PlaneGeometry(2.2,5);
    const fMat=new THREE.MeshStandardMaterial({ map:fTex,side:THREE.DoubleSide,transparent:true,
      roughness:0.85,metalness:0,alphaTest:0.05 });
    const frond=new THREE.Mesh(fGeo,fMat);
    frond.position.set(Math.cos(angle)*1.2, 10+Math.random()*0.4, Math.sin(angle)*1.2);
    frond.rotation.y=angle;
    frond.rotation.z=Math.PI/4+Math.random()*0.3;
    frond.castShadow=true;
    grp.add(frond);
  }
  grp.position.set(x, 0, z);
  scene.add(grp);
}

function buildCar(color, isP1){
  const grp = new THREE.Group();

  // Paint material — high gloss
  const paintMat = new THREE.MeshPhysicalMaterial({
    color: color,
    metalness: 0.45, roughness: 0.12,
    clearcoat: 1.0, clearcoatRoughness: 0.06,
    reflectivity: 1.0, envMapIntensity: 1.4
  });
  // Chrome trim
  const chromeMat = new THREE.MeshStandardMaterial({ color:0xE8E8E8, metalness:0.95, roughness:0.08, envMapIntensity:1.5 });
  // Dark glass
  const glassMat = new THREE.MeshPhysicalMaterial({
    color:0x112244, metalness:0.05, roughness:0.0,
    transmission:0.65, opacity:0.7, transparent:true,
    ior:1.5, thickness:0.3, envMapIntensity:1.2
  });
  // Rubber tires
  const tireMat = new THREE.MeshStandardMaterial({ color:0x111111, metalness:0.02, roughness:0.92 });
  // Rim metal
  const rimMat = new THREE.MeshStandardMaterial({ color:0xC0C0C0, metalness:0.9, roughness:0.15, envMapIntensity:1.0 });
  // Brake disc
  const discMat = new THREE.MeshStandardMaterial({ color:0x888888, metalness:0.85, roughness:0.4 });
  // Undercarriage
  const underMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.9, metalness:0.1 });

  // ---- BODY ----
  // Main body hull (low profile)
  const bodyGeo = new THREE.BoxGeometry(2.0, 0.48, 4.2);
  // Reshape body via vertex manipulation for sloped look
  const bPos = bodyGeo.attributes.position;
  for(let i=0;i<bPos.count;i++){
    let px=bPos.getX(i), py=bPos.getY(i), pz=bPos.getZ(i);
    // Taper nose
    if(pz>1.2){ px*=1.0-(pz-1.2)*0.18; py-=(pz-1.2)*0.05; }
    // Taper tail
    if(pz<-1.2){ px*=1.0-(Math.abs(pz)-1.2)*0.12; }
    // Side curves (wider in middle)
    if(Math.abs(pz)<1.0) px*=1.08;
    bPos.setXYZ(i,px,py,pz);
  }
  bodyGeo.computeVertexNormals();
  const body = new THREE.Mesh(bodyGeo, paintMat);
  body.position.y = 0.54; body.castShadow=true; grp.add(body);

  // Lower sill (side skirts)
  const sillGeo = new THREE.BoxGeometry(2.12, 0.18, 3.8);
  const sill = new THREE.Mesh(sillGeo, paintMat);
  sill.position.y=0.22; sill.castShadow=true; grp.add(sill);

  // Cabin / roof
  const cabGeo = new THREE.BoxGeometry(1.5, 0.52, 2.1);
  const cabPos = cabGeo.attributes.position;
  for(let i=0;i<cabPos.count;i++){
    let px=cabPos.getX(i), py=cabPos.getY(i), pz=cabPos.getZ(i);
    if(py>0){ // roof taper
      px*=0.88;
      if(pz>0.6) py-=(pz-0.6)*0.55; // windshield slope
      if(pz<-0.6) py-=(Math.abs(pz)-0.6)*0.42; // rear slope
    }
    cabPos.setXYZ(i,px,py,pz);
  }
  cabGeo.computeVertexNormals();
  const cab = new THREE.Mesh(cabGeo, paintMat);
  cab.position.set(0, 1.06, -0.1); cab.castShadow=true; grp.add(cab);

  // Windshield
  const wsGeo = new THREE.PlaneGeometry(1.35, 0.7);
  const ws = new THREE.Mesh(wsGeo, glassMat);
  ws.position.set(0, 1.12, 0.88); ws.rotation.x=-0.52; ws.castShadow=false; grp.add(ws);

  // Rear window
  const rwGeo = new THREE.PlaneGeometry(1.2, 0.6);
  const rw = new THREE.Mesh(rwGeo, glassMat);
  rw.position.set(0, 1.08, -1.14); rw.rotation.x=0.55; grp.add(rw);

  // Side windows L/R
  for(let s of[-1,1]){
    const swGeo=new THREE.PlaneGeometry(0.85, 0.38);
    const sw=new THREE.Mesh(swGeo,glassMat);
    sw.position.set(s*0.76,1.1,0.0); sw.rotation.y=s*Math.PI/2; grp.add(sw);
  }

  // Hood — raised center duct
  const hoodGeo=new THREE.BoxGeometry(1.6,0.08,1.2);
  const hood=new THREE.Mesh(hoodGeo, paintMat);
  hood.position.set(0,0.79,1.3); grp.add(hood);
  // Hood air scoop
  const scoopGeo=new THREE.BoxGeometry(0.5,0.12,0.3);
  const scoop=new THREE.Mesh(scoopGeo, chromeMat);
  scoop.position.set(0,0.84,1.1); grp.add(scoop);

  // Front bumper
  const fbGeo=new THREE.BoxGeometry(2.05,0.32,0.22);
  const fb=new THREE.Mesh(fbGeo, paintMat);
  fb.position.set(0,0.26,2.15); grp.add(fb);
  // Front splitter
  const splGeo=new THREE.BoxGeometry(2.0,0.04,0.4);
  const spl=new THREE.Mesh(splGeo, underMat);
  spl.position.set(0,0.06,2.2); grp.add(spl);

  // Rear bumper
  const rbGeo=new THREE.BoxGeometry(1.9,0.3,0.22);
  const rb=new THREE.Mesh(rbGeo, paintMat);
  rb.position.set(0,0.26,-2.15); grp.add(rb);

  // Rear diffuser
  const diffGeo=new THREE.BoxGeometry(1.8,0.18,0.45);
  const diff=new THREE.Mesh(diffGeo, underMat);
  diff.position.set(0,0.1,-2.25); diff.rotation.x=0.2; grp.add(diff);

  // Rear spoiler
  const spGeo=new THREE.BoxGeometry(1.7,0.06,0.35);
  const sp=new THREE.Mesh(spGeo, paintMat);
  sp.position.set(0,1.12,-1.95); grp.add(sp);
  const spLeg1=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.25,0.1), chromeMat);
  spLeg1.position.set(0.7,0.98,-1.95); grp.add(spLeg1);
  const spLeg2=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.25,0.1), chromeMat);
  spLeg2.position.set(-0.7,0.98,-1.95); grp.add(spLeg2);

  // Chrome grille strips (front)
  for(let g=0;g<3;g++){
    const gGeo=new THREE.BoxGeometry(1.4,0.06,0.08);
    const gm=new THREE.Mesh(gGeo,chromeMat);
    gm.position.set(0,0.15+g*0.1,2.19); grp.add(gm);
  }

  // Headlights (emissive white + point light)
  const hlMat=new THREE.MeshPhysicalMaterial({ color:0xFFFFEE, emissive:0xFFFFBB, emissiveIntensity:2.5,
    metalness:0.1, roughness:0.05, transmission:0.3 });
  for(let s of[-1,1]){
    const hlGeo=new THREE.BoxGeometry(0.42,0.18,0.12);
    const hl=new THREE.Mesh(hlGeo,hlMat);
    hl.position.set(s*0.72,0.5,2.17); grp.add(hl);
    const hlLight=new THREE.PointLight(0xFFFFCC, 0.8, 12);
    hlLight.position.set(s*0.72,0.5,2.5); grp.add(hlLight);
  }
  // Taillights (emissive red)
  const tlMat=new THREE.MeshPhysicalMaterial({ color:0xFF1100, emissive:0xFF2200, emissiveIntensity:2.2,
    metalness:0.05, roughness:0.05, transmission:0.4 });
  for(let s of[-1,1]){
    const tlGeo=new THREE.BoxGeometry(0.48,0.14,0.1);
    const tl=new THREE.Mesh(tlGeo,tlMat);
    tl.position.set(s*0.68,0.55,-2.17); grp.add(tl);
  }

  // Exhaust pipes
  for(let s of[-0.35, 0.35]){
    const exGeo=new THREE.CylinderGeometry(0.055,0.07,0.3,12);
    exGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI/2));
    const ex=new THREE.Mesh(exGeo,chromeMat);
    ex.position.set(s,0.12,-2.25); grp.add(ex);
  }

  // ---- WHEELS ----
  function makeWheel(xPos, zPos){
    const wGrp=new THREE.Group();
    // Tire
    const tireGeo=new THREE.TorusGeometry(0.38,0.16,16,32);
    const tire=new THREE.Mesh(tireGeo,tireMat);
    tire.castShadow=true;
    wGrp.add(tire);
    // Rim
    const rimGeo=new THREE.CylinderGeometry(0.28,0.28,0.16,32);
    const rim=new THREE.Mesh(rimGeo,rimMat);
    rim.rotation.x=Math.PI/2;
    wGrp.add(rim);
    // Brake disc
    const discGeo=new THREE.CylinderGeometry(0.22,0.22,0.06,24);
    const disc=new THREE.Mesh(discGeo,discMat);
    disc.rotation.x=Math.PI/2;
    disc.position.x=xPos>0?-0.06:0.06;
    wGrp.add(disc);
    // Spokes
    for(let sp=0;sp<5;sp++){
      const ang=sp/5*Math.PI*2;
      const sGeo=new THREE.BoxGeometry(0.06,0.2,0.06);
      const spoke=new THREE.Mesh(sGeo,rimMat);
      spoke.position.set(Math.cos(ang)*0.16,Math.sin(ang)*0.16,0);
      spoke.rotation.z=ang;
      wGrp.add(spoke);
    }
    wGrp.rotation.z=Math.PI/2;
    wGrp.position.set(xPos, 0.38, zPos);
    grp.add(wGrp);
    return wGrp;
  }
  const wFL=makeWheel(-1.06,  1.35);
  const wFR=makeWheel( 1.06,  1.35);
  const wRL=makeWheel(-1.06, -1.35);
  const wRR=makeWheel( 1.06, -1.35);

  // Undercarriage floor
  const floorGeo=new THREE.BoxGeometry(1.9,0.06,3.8);
  const floor=new THREE.Mesh(floorGeo,underMat);
  floor.position.y=0.06;
  grp.add(floor);

  grp._wheels=[wFL,wFR,wRL,wRR];
  return grp;
}

const TRACK_FINISH_Z = TRACK_LENGTH - 22;
const CAR_START_Z = 5;
const gears=[0,0.08,0.16,0.26,0.38,0.52,0.66];
const gearThresholds=[0,15,40,72,108,150,200];

const state = {
  phase:'idle',   // idle, countdown, racing, finished
  countdown:0,
  timer:0,
  raceStart:0,
  winner:null,
  p1:{ pos:CAR_START_Z, speed:0, accel:0, gear:1, finished:false, finTime:0 },
  p2:{ pos:CAR_START_Z, speed:0, accel:0, gear:1, finished:false, finTime:0 },
};

// Difficulty variation
let p1AccelMult=1.0, p2AccelMult=1.0;

function resetGame(){
  state.phase='idle';
  state.countdown=3;
  state.timer=0;
  state.winner=null;
  state.p1={pos:CAR_START_Z,speed:0,accel:0,gear:1,finished:false,finTime:0};
  state.p2={pos:CAR_START_Z,speed:0,accel:0,gear:1,finished:false,finTime:0};
  car1.position.set(-3.5,0,CAR_START_Z);
  car2.position.set( 3.5,0,CAR_START_Z);
  document.getElementById('winner-banner').style.display='none';
  document.getElementById('countdown').style.display='none';
  document.getElementById('launch-hint').style.display='block';
  p1AccelMult=0.92+Math.random()*0.16;
  p2AccelMult=0.92+Math.random()*0.16;
  cameraShake=0;
  for(let i=0;i<MAX_PARTICLES;i++){
    pPositions[i*3]=9999; pLife[i]=0;
  }
}

function startCountdown(){
  if(state.phase!=='idle') return;
  document.getElementById('launch-hint').style.display='none';
  state.phase='countdown';
  state.countdown=3;
  runCountdown();
}

function runCountdown(){
  const el=document.getElementById('countdown');
  el.style.display='block';
  el.classList.remove('go');
  const counts=[3,2,1,'GO!'];
  let idx=0;
  function step(){
    if(idx<3){ el.textContent=counts[idx]; el.style.color='#fff'; }
    else { el.textContent='GO!'; el.classList.add('go'); }
    // re-trigger animation
    el.style.animation='none';
    el.offsetHeight;
    el.style.animation='countPulse 0.6s ease-out';
    idx++;
    if(idx<4) setTimeout(step, 900);
    else {
      setTimeout(()=>{
        el.style.display='none';
        startRace();
      },700);
    }
  }
  step();
}

function startRace(){
  state.phase='racing';
  state.raceStart=performance.now();
  cameraShake=0.18;
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key===' '){
    e.preventDefault();
    if(state.phase==='idle') startCountdown();
    else if(state.phase==='finished') resetGame();
  }
});
document.getElementById('canvas-container').addEventListener('click',()=>{
  if(state.phase==='idle') startCountdown();
  else if(state.phase==='finished') resetGame();
});
document.getElementById('race-again-btn').addEventListener('click',e=>{
  e.stopPropagation(); resetGame();
});

//  CAMERA
// ============================================================
let cameraShake=0;
const camOffset=new THREE.Vector3(0, 4.5, -17);
const camLookOffset=new THREE.Vector3(0, 1.5, 8);

function updateCamera(dt){
  // Follow average of both cars
  const midZ=(state.p1.pos+state.p2.pos)*0.5;
  const midX=0;
  const targetPos=new THREE.Vector3(
    midX+camOffset.x, camOffset.y,
    midZ+camOffset.z
  );
  const shake=cameraShake*(Math.sin(Date.now()*0.08)*0.12);
  targetPos.x+=shake;
  targetPos.y+=Math.abs(shake)*0.5;
  camera.position.lerp(targetPos, 0.08);
  const lookTarget=new THREE.Vector3(midX, camLookOffset.y, midZ+camLookOffset.z);
  camera.lookAt(lookTarget);
  if(cameraShake>0) cameraShake=Math.max(0,cameraShake-dt*0.8);
}

// ============================================================
//  PHYSICS
// ============================================================
function getGear(speed){
  for(let g=gearThresholds.length-1;g>=0;g--){
    if(speed>=gearThresholds[g]) return g+1;
  }
  return 1;
}

const MAX_SPEED=320; // km/h

function updatePhysics(dt){
  if(state.phase!=='racing') return;
  const elapsed=(performance.now()-state.raceStart)/1000;
  state.timer=elapsed;

  function updateCar(cs, multiplier){
    if(cs.finished) return;
    // Acceleration model: gear-based with slight random variation
    const gear=getGear(cs.speed);
    cs.gear=gear;
    const gearAccel=gears[Math.min(gear,gears.length-1)];
    const airRes=cs.speed/MAX_SPEED;
    const variation=1+(Math.sin(elapsed*3.7+multiplier*10)*0.025);
    cs.accel=(gearAccel*(1-airRes*0.75)*multiplier*variation);
    cs.speed=Math.min(cs.speed+cs.accel*dt*280, MAX_SPEED);
    // m/s to units: 1 unit ≈ 1 meter, km/h→m/s /3.6
    cs.pos+=cs.speed/3.6*dt;
  }

  updateCar(state.p1, p1AccelMult);
  updateCar(state.p2, p2AccelMult);

  // Apply positions
  car1.position.z=state.p1.pos;
  car2.position.z=state.p2.pos;

  // Wheel spin
  const spinRate=0.04;
  if(car1._wheels) car1._wheels.forEach(w=>{ w.rotation.x-=state.p1.speed*spinRate*0.016; });
  if(car2._wheels) car2._wheels.forEach(w=>{ w.rotation.x-=state.p2.speed*spinRate*0.016; });

  // Finish check
  const now=performance.now();
  if(!state.p1.finished && state.p1.pos>=TRACK_FINISH_Z){ state.p1.finished=true; state.p1.finTime=(now-state.raceStart)/1000; }
  if(!state.p2.finished && state.p2.pos>=TRACK_FINISH_Z){ state.p2.finished=true; state.p2.finTime=(now-state.raceStart)/1000; }
  if(state.p1.finished && state.p2.finished && state.phase==='racing'){
    state.phase='finished';
    const w=state.p1.finTime<=state.p2.finTime?'Player 1':'Player 2';
    const wt=Math.min(state.p1.finTime,state.p2.finTime);
    const margin=Math.abs(state.p1.finTime-state.p2.finTime);
    showWinner(w,wt,margin);
  } else if(state.p1.finished && !state.p2.finished){
    // force P2 finish soon
    if(state.p1.pos>TRACK_FINISH_Z+20 && state.phase==='racing'){
      state.p2.finished=true; state.p2.finTime=(now-state.raceStart)/1000+0.08+Math.random()*0.3;
      state.phase='finished';
      showWinner('Player 1',state.p1.finTime,state.p2.finTime-state.p1.finTime);
    }
  }
}

function showWinner(name, time, margin){
  document.getElementById('winner-name').textContent=name;
  document.getElementById('winner-time').textContent=`Time: ${time.toFixed(3)}s`;
  document.getElementById('winner-margin').textContent=margin<0.001?'Photo Finish!':`Won by ${margin.toFixed(3)}s`;
  document.getElementById('winner-banner').style.display='block';
}

// ============================================================
//  PARTICLES UPDATE
// ============================================================
function spawnCarParticles(){
  if(state.phase!=='racing') return;
  const cars=[{c:car1,s:state.p1},{c:car2,s:state.p2}];
  for(const {c,s} of cars){
    if(s.finished) continue;
    const cx=c.position.x, cy=c.position.y, cz=c.position.z;
    // tire smoke on launch (first 3 seconds)
    const elapsed=(performance.now()-state.raceStart)/1000;
    if(elapsed<2.5 && s.speed<80){
      for(let i=0;i<4;i++){
        spawnParticle(
          cx+(Math.random()-0.5)*1.8, cy+0.15, cz-1.4+(Math.random()-0.5)*0.5,
          (Math.random()-0.5)*0.4, 0.3+Math.random()*0.4, -(0.5+Math.random()*2),
          0
        );
      }
    }
    // exhaust
    for(let e=0;e<2;e++){
      spawnParticle(
        cx+(e===0?-0.35:0.35), cy+0.12, cz-2.3,
        (Math.random()-0.5)*0.2, 0.08+Math.random()*0.15, -(0.3+Math.random()*1.2),
        2
      );
    }
    // dust
    if(s.speed>30){
      spawnParticle(
        cx+(Math.random()-0.5)*2, cy+0.08, cz-1.8+(Math.random()-0.5)*0.8,
        (Math.random()-0.5)*0.3, 0.05+Math.random()*0.2, -(0.2+Math.random()),
        1
      );
    }
    // sparks at high speed
    if(s.speed>180 && Math.random()<0.15){
      spawnParticle(cx+(Math.random()-0.5)*1.5, cy+0.05, cz-1.5,
        (Math.random()-0.5)*3, 0.5+Math.random()*1.5, -(Math.random()*2), 3);
    }
  }
}

function updateParticles(dt){
  for(let i=0;i<MAX_PARTICLES;i++){
    if(pLife[i]<=0) continue;
    pLife[i]-=dt*(pType[i]===0?0.6:pType[i]===3?3.0:1.2);
    if(pLife[i]<=0){ pPositions[i*3]=9999; pSizes[i]=0; continue; }
    pPositions[i*3]  +=pVel[i].x*dt*4;
    pPositions[i*3+1]+=pVel[i].y*dt*4;
    pPositions[i*3+2]+=pVel[i].z*dt*4;
    pVel[i].y-=dt*0.8; // gravity
    // fade size
    pSizes[i]*=0.995;
  }
  particleGeo.attributes.position.needsUpdate=true;
  particleGeo.attributes.size.needsUpdate=true;
}

// ============================================================
//  HUD UPDATE
// ============================================================
function updateHUD(){
  const p1=state.p1, p2=state.p2;
  document.getElementById('p1-speed').textContent=Math.round(p1.speed);
  document.getElementById('p2-speed').textContent=Math.round(p2.speed);
  const p1rpm=Math.min(p1.speed/MAX_SPEED*100,100);
  const p2rpm=Math.min(p2.speed/MAX_SPEED*100,100);
  document.getElementById('p1-rpm').style.width=p1rpm+'%';
  document.getElementById('p2-rpm').style.width=p2rpm+'%';
  // Red zone color
  document.getElementById('p1-rpm').style.backgroundPosition=p1rpm>85?'100% 0':'50% 0';
  document.getElementById('p1-gear').textContent=state.phase==='racing'?p1.gear:'N';
  document.getElementById('p2-gear').textContent=state.phase==='racing'?p2.gear:'N';
  if(state.phase==='racing') document.getElementById('timer-val').textContent=state.timer.toFixed(3);
  // Progress bars
  const prog=TRACK_FINISH_Z-CAR_START_Z;
  document.getElementById('p1-fill').style.width=Math.min((p1.pos-CAR_START_Z)/prog*100,100)+'%';
  document.getElementById('p2-fill').style.width=Math.min((p2.pos-CAR_START_Z)/prog*100,100)+'%';
  // Speed effects
  const avgSpeed=(p1.speed+p2.speed)/2;
  const speedFactor=avgSpeed/MAX_SPEED;
  document.getElementById('speed-overlay').style.opacity=(speedFactor*0.45).toFixed(2);
  // Lens flare (toward sun position, appears at certain camera angles)
  const lf=document.getElementById('lens-flare');
  const sunAngle=Math.abs(Math.sin(Date.now()*0.0004));
  if(sunAngle>0.6 && state.phase==='racing'){
    lf.style.display='block';
    lf.style.left=(40+sunAngle*20)+'%';
    lf.style.top='18%';
    lf.style.opacity=(sunAngle-0.6)*1.2;
  } else { lf.style.display='none'; }
}

// ============================================================
//  HEAT HAZE (canvas overlay)
// ============================================================
const heatCanvas=document.getElementById('heat-canvas');
heatCanvas.width=window.innerWidth; heatCanvas.height=window.innerHeight;
const hCtx=heatCanvas.getContext('2d');
let heatTime=0;

function drawHeatHaze(dt){
  heatTime+=dt;
  hCtx.clearRect(0,0,heatCanvas.width,heatCanvas.height);
  if(state.phase!=='racing') return;
  const cx=heatCanvas.width/2, cy=heatCanvas.height*0.55;
  const radius=40+Math.sin(heatTime*8)*6;
  for(let i=0;i<2;i++){
    const x=cx+(i===0?-60:60), y=cy;
    const grad=hCtx.createRadialGradient(x,y,0,x,y,radius);
    grad.addColorStop(0,'rgba(255,180,80,0.07)');
    grad.addColorStop(1,'rgba(255,180,80,0)');
    hCtx.fillStyle=grad; hCtx.fillRect(x-radius,y-radius,radius*2,radius*2);
  }
}

// ============================================================
//  SOUND SYSTEM — Web Audio API, realistic layered engine
// ============================================================
let audioCtx=null, engineOsc1=null, engineOsc2=null, engineOsc3=null,
    engineGain=null, masterGain=null, windNode=null, windGain=null,
    audioReady=false;

function initAudio(){
  if(audioReady) return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.35;
    masterGain.connect(audioCtx.destination);

    // Compressor for dynamic range
    const comp=audioCtx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=8;
    comp.ratio.value=4; comp.attack.value=0.003;
    comp.release.value=0.18;
    masterGain.connect(comp); comp.connect(audioCtx.destination);

    // Engine layer 1 — fundamental rumble
    engineOsc1=audioCtx.createOscillator();
    engineOsc1.type='sawtooth'; engineOsc1.frequency.value=55;
    const eFilter1=audioCtx.createBiquadFilter();
    eFilter1.type='lowpass'; eFilter1.frequency.value=500;
    engineOsc1.connect(eFilter1);

    // Engine layer 2 — mid harmonic
    engineOsc2=audioCtx.createOscillator();
    engineOsc2.type='square'; engineOsc2.frequency.value=110;
    const eFilter2=audioCtx.createBiquadFilter();
    eFilter2.type='bandpass'; eFilter2.frequency.value=400; eFilter2.Q.value=1.5;
    engineOsc2.connect(eFilter2);

    // Engine layer 3 — high whine
    engineOsc3=audioCtx.createOscillator();
    engineOsc3.type='sawtooth'; engineOsc3.frequency.value=220;
    const eFilter3=audioCtx.createBiquadFilter();
    eFilter3.type='highpass'; eFilter3.frequency.value=300;
    engineOsc3.connect(eFilter3);

    engineGain=audioCtx.createGain(); engineGain.gain.value=0;
    eFilter1.connect(engineGain);
    eFilter2.connect(engineGain);
    eFilter3.connect(engineGain);
    engineGain.connect(masterGain);

    engineOsc1.start(); engineOsc2.start(); engineOsc3.start();

    // Wind noise
    const bufSize=audioCtx.sampleRate*2;
    const windBuf=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
    const windData=windBuf.getChannelData(0);
    for(let i=0;i<bufSize;i++) windData[i]=(Math.random()*2-1);
    windNode=audioCtx.createBufferSource();
    windNode.buffer=windBuf; windNode.loop=true;
    const windFilter=audioCtx.createBiquadFilter();
    windFilter.type='bandpass'; windFilter.frequency.value=800; windFilter.Q.value=0.5;
    windGain=audioCtx.createGain(); windGain.gain.value=0;
    windNode.connect(windFilter); windFilter.connect(windGain); windGain.connect(masterGain);
    windNode.start();

    audioReady=true;
  } catch(e){ console.warn('Audio init failed:', e); }
}

function updateSound(dt){
  if(!audioReady || !audioCtx) return;
  const avgSpeed=(state.p1.speed+state.p2.speed)*0.5;
  const speedRatio=avgSpeed/MAX_SPEED;
  const isRacing=state.phase==='racing';

  if(isRacing){
    // Engine frequency scales with speed (RPM simulation)
    const baseRpm=55+speedRatio*320;
    const gearDip=0.88+0.12*((state.p1.gear%1)||1); // slight dip on shift
    const now2=audioCtx.currentTime;
    engineOsc1.frequency.setTargetAtTime(baseRpm*gearDip,now2,0.08);
    engineOsc2.frequency.setTargetAtTime(baseRpm*2*gearDip,now2,0.08);
    engineOsc3.frequency.setTargetAtTime(baseRpm*4,now2,0.04);
    // Volume — quiet at start, builds
    const elapsed=(performance.now()-state.raceStart)/1000;
    const launchBoost=elapsed<1.5?0.9:0;
    engineGain.gain.setTargetAtTime(Math.min(0.55+speedRatio*0.45+launchBoost,1.0),now2,0.06);
    // Wind
    windGain.gain.setTargetAtTime(speedRatio*0.35,now2,0.12);
  } else {
    if(engineGain) engineGain.gain.setTargetAtTime(0.0,audioCtx.currentTime,0.3);
    if(windGain) windGain.gain.setTargetAtTime(0.0,audioCtx.currentTime,0.3);
  }
}

// Tire screech on launch
function playTireScreech(){
  if(!audioReady) return;
  const osc=audioCtx.createOscillator();
  osc.type='sawtooth'; osc.frequency.value=800;
  const g=audioCtx.createGain(); g.gain.value=0.25;
  const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200;
  osc.connect(f); f.connect(g); g.connect(masterGain);
  osc.start();
  osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime+1.2);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+1.2);
  osc.stop(audioCtx.currentTime+1.2);
}

// ============================================================
//  CHROMATIC ABERRATION (CSS trick at high speed)
// ============================================================
function updateChromaticAberration(){
  const avgSpeed=(state.p1.speed+state.p2.speed)*0.5;
  const factor=Math.max(0,(avgSpeed-200)/120)*2;
  if(factor>0.05){
    renderer.domElement.style.filter=`saturate(1.${Math.floor(factor*20)}) contrast(1.04)`;
  } else {
    renderer.domElement.style.filter='';
  }
}

  updatePhysics(dt2);

  updateChromaticAberration();
  renderer.render(scene,camera);
}

requestAnimationFrame(animateFull);
