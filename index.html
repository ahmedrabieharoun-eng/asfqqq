<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag Race 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
  #canvas-container { width: 100vw; height: 100vh; position: relative; }
  canvas { display: block; }

  /* HUD Overlay */
  #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  .hud-panel {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,200,0,0.4);
    border-radius: 10px;
    padding: 10px 18px;
    backdrop-filter: blur(4px);
  }

  #p1-hud {
    position: absolute;
    top: 16px; left: 16px;
    min-width: 160px;
  }
  #p2-hud {
    position: absolute;
    top: 16px; right: 16px;
    min-width: 160px;
    text-align: right;
  }
  #timer-hud {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    min-width: 140px;
    text-align: center;
  }

  .car-name {
    font-size: 13px;
    font-weight: 700;
    color: #FFD700;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .car-speed {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
  }
  .speed-unit {
    font-size: 11px;
    color: #aaa;
    font-weight: 400;
    margin-left: 2px;
  }
  .timer-label {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .timer-value {
    font-size: 24px;
    font-weight: 900;
    color: #fff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }

  /* Countdown */
  #countdown {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 140px;
    font-weight: 900;
    color: #fff;
    text-shadow:
      0 0 30px rgba(255,50,50,0.9),
      0 0 60px rgba(255,50,50,0.6),
      4px 4px 0 #000;
    letter-spacing: 4px;
    pointer-events: none;
    transition: transform 0.1s, opacity 0.2s;
    display: none;
    text-align: center;
    white-space: nowrap;
  }
  #countdown.go {
    color: #00FF88;
    text-shadow:
      0 0 30px rgba(0,255,100,0.9),
      0 0 60px rgba(0,255,100,0.6),
      4px 4px 0 #000;
    font-size: 160px;
  }

  /* Winner banner */
  #winner-banner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.82);
    border: 3px solid #FFD700;
    border-radius: 20px;
    padding: 36px 60px;
    text-align: center;
    display: none;
    pointer-events: all;
    z-index: 20;
    box-shadow: 0 0 60px rgba(255,215,0,0.4);
  }
  #winner-title {
    font-size: 16px;
    color: #aaa;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #winner-name {
    font-size: 52px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
    margin-bottom: 8px;
  }
  #winner-time {
    font-size: 16px;
    color: #ccc;
    margin-bottom: 6px;
  }
  #winner-margin {
    font-size: 14px;
    color: #888;
    margin-bottom: 28px;
  }
  #race-again-btn {
    background: linear-gradient(135deg, #FFD700, #FF8C00);
    color: #000;
    border: none;
    border-radius: 50px;
    padding: 14px 44px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: transform 0.1s, box-shadow 0.1s;
    pointer-events: all;
  }
  #race-again-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(255,140,0,0.5); }
  #race-again-btn:active { transform: scale(0.97); }

  /* Speed lines overlay */
  #speed-lines {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
    background:
      repeating-linear-gradient(90deg,
        transparent 0px,
        transparent 60px,
        rgba(255,255,255,0.018) 60px,
        rgba(255,255,255,0.018) 62px
      ),
      radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.18) 100%);
    z-index: 5;
  }

  /* Progress bar for each car */
  .progress-bar-container {
    position: absolute;
    bottom: 20px;
    width: 40%;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #p1-progress { left: 5%; }
  #p2-progress { right: 5%; }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.05s linear;
  }
  #p1-fill { background: linear-gradient(90deg, #FFD700, #FF8C00); }
  #p2-fill { background: linear-gradient(90deg, #00BFFF, #7B2FFF); width: 0%; }
  .progress-label {
    position: absolute;
    bottom: 32px;
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #p1-label { left: 5%; }
  #p2-label { right: 5%; }

  /* Gear indicator */
  .gear-display {
    font-size: 11px;
    color: #FF8C00;
    letter-spacing: 1px;
    margin-top: 3px;
  }

  /* RPM bar */
  .rpm-bar-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-top: 5px;
    overflow: hidden;
  }
  .rpm-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #00FF88, #FFD700, #FF4400);
    border-radius: 2px;
    transition: width 0.05s;
  }

  /* Start instruction */
  #start-hint {
    position: absolute;
    bottom: 80px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<!-- HUD -->
<div id="hud">
  <div id="p1-hud" class="hud-panel">
    <div class="car-name">🏎 Player 1</div>
    <div class="car-speed"><span id="p1-speed">0</span><span class="speed-unit">km/h</span></div>
    <div class="gear-display" id="p1-gear">GEAR 1</div>
    <div class="rpm-bar-wrap"><div class="rpm-bar-fill" id="p1-rpm" style="width:0%"></div></div>
  </div>

  <div id="timer-hud" class="hud-panel">
    <div class="timer-label">⏱ Race Time</div>
    <div class="timer-value" id="race-timer">0.000</div>
  </div>

  <div id="p2-hud" class="hud-panel">
    <div class="car-name">Player 2 🏎</div>
    <div class="car-speed"><span id="p2-speed">0</span><span class="speed-unit">km/h</span></div>
    <div class="gear-display" id="p2-gear">GEAR 1</div>
    <div class="rpm-bar-wrap"><div class="rpm-bar-fill" id="p2-rpm" style="width:0%"></div></div>
  </div>
  <div id="start-hint">🏁 Get Ready To Race!</div>

  <div id="countdown"></div>
  <div id="speed-lines"></div>

  <div class="progress-label" id="p1-label">Player 1</div>
  <div class="progress-bar-container" id="p1-progress"><div class="progress-fill" id="p1-fill" style="width:0%"></div></div>

  <div class="progress-label" id="p2-label" style="text-align:right;">Player 2</div>
  <div class="progress-bar-container" id="p2-progress"><div class="progress-fill" id="p2-fill" style="width:0%"></div></div>

  <div id="winner-banner">
    <div id="winner-title">🏆 WINNER</div>
    <div id="winner-name">Player 1</div>
    <div id="winner-time" id="winner-time-display"></div>
    <div id="winner-margin"></div>
    <button id="race-again-btn" onclick="resetRace()">🔁 Race Again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// DRAG RACE 3D - Full Game Engine
// =====================================================================

const RACE_DISTANCE = 800; // meters
const FINISH_LINE = RACE_DISTANCE;
const ROAD_WIDTH = 14;
const ROAD_LENGTH = RACE_DISTANCE + 200;

// Game state
let gameState = 'idle'; // idle | countdown | racing | finished
let raceTimer = 0;
let countdownValue = 3;
let countdownTimer = 0;
let lastTime = 0;
let animFrameId;
let audioCtx = null;

// Car states — tuned so they stay neck-and-neck but have a clear winner at the line
// P1 has a tiny acceleration edge early; P2 has slightly higher top speed.
// They should arrive within ~0.1-0.3 seconds of each other.
const cars = [
  {
    name: 'Player 1',
    position: 0,
    velocity: 0,
    maxSpeed: 88.2,   // ~317 km/h
    accel: 14.5,
    drag: 0.0175,
    laneOffset: -2.5,
    color: 0xFFD700,
    finished: false,
    finishTime: 0,
    mesh: null,
    engineNode: null,
    gearThresholds: [0, 14, 28, 46, 64, 78, 86]
  },
  {
    name: 'Player 2',
    position: 0,
    velocity: 0,
    maxSpeed: 88.6,   // ~319 km/h — wins by top speed late in race
    accel: 14.0,
    drag: 0.017,
    laneOffset: 2.5,
    color: 0xFFCC00,
    finished: false,
    finishTime: 0,
    mesh: null,
    engineNode: null,
    gearThresholds: [0, 13, 27, 44, 62, 76, 85]
  }
];

// =====================================================================
// THREE.JS SETUP
// =====================================================================
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xC8E8FF, 0.0018);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(0, 6, -20);
camera.lookAt(0, 1, 100);

// =====================================================================
// LIGHTING
// =====================================================================
const ambientLight = new THREE.AmbientLight(0xFFF8E7, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xFFF0C0, 2.2);
sunLight.position.set(60, 120, -80);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 600;
sunLight.shadow.camera.left = -100;
sunLight.shadow.camera.right = 100;
sunLight.shadow.camera.top = 100;
sunLight.shadow.camera.bottom = -100;
sunLight.shadow.bias = -0.001;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x88BBFF, 0.4);
fillLight.position.set(-40, 30, 40);
scene.add(fillLight);

// =====================================================================
// SKY
// =====================================================================
const skyGeo = new THREE.SphereGeometry(1500, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor: { value: new THREE.Color(0x4488CC) },
    horizonColor: { value: new THREE.Color(0xB0D8F0) },
    groundColor: { value: new THREE.Color(0x556644) },
    offset: { value: 300 },
    exponent: { value: 0.6 }
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 horizonColor;
    uniform vec3 groundColor;
    uniform float offset;
    uniform float exponent;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + offset).y;
      vec3 col;
      if(h > 0.0) {
        col = mix(horizonColor, topColor, pow(max(h, 0.0), exponent));
      } else {
        col = mix(horizonColor, groundColor, pow(max(-h, 0.0), 0.5));
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.BackSide
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// =====================================================================
// ROAD
// =====================================================================
function createRoad() {
  const roadGroup = new THREE.Group();

  // Asphalt base
  const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH, 1, 100);
  const roadMat = new THREE.MeshLambertMaterial({ color: 0x2A2A2A });

  // Procedural road texture via canvas
  const texCanvas = document.createElement('canvas');
  texCanvas.width = 256; texCanvas.height = 1024;
  const ctx = texCanvas.getContext('2d');
  // Base asphalt
  ctx.fillStyle = '#2d2d2d';
  ctx.fillRect(0, 0, 256, 1024);
  // Noise for texture
  for (let i = 0; i < 8000; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 1024;
    const g = Math.floor(Math.random() * 30 + 30);
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    ctx.fillRect(x, y, 2, 2);
  }
  // Road edge lines (white)
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(12, 1024); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(244, 0); ctx.lineTo(244, 1024); ctx.stroke();

  const roadTex = new THREE.CanvasTexture(texCanvas);
  roadTex.wrapS = THREE.RepeatWrapping;
  roadTex.wrapT = THREE.RepeatWrapping;
  roadTex.repeat.set(1, ROAD_LENGTH / 20);
  roadMat.map = roadTex;

  const roadMesh = new THREE.Mesh(roadGeo, roadMat);
  roadMesh.rotation.x = -Math.PI / 2;
  roadMesh.position.set(0, 0, ROAD_LENGTH / 2 - 20);
  roadMesh.receiveShadow = true;
  roadGroup.add(roadMesh);

  // Center dashed line
  const dashMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  for (let z = 0; z < ROAD_LENGTH; z += 12) {
    const dashGeo = new THREE.PlaneGeometry(0.25, 7);
    const dash = new THREE.Mesh(dashGeo, dashMat);
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(0, 0.01, z);
    roadGroup.add(dash);
  }

  // Distance markers every 100m
  const markerMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  for (let z = 100; z < ROAD_LENGTH; z += 100) {
    const lineGeo = new THREE.PlaneGeometry(ROAD_WIDTH, 0.5);
    const line = new THREE.Mesh(lineGeo, markerMat);
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.015, z);
    roadGroup.add(line);
  }

  // Grass on sides
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x4A8C3F });
  const grassL = new THREE.Mesh(new THREE.PlaneGeometry(60, ROAD_LENGTH), grassMat);
  grassL.rotation.x = -Math.PI / 2;
  grassL.position.set(-ROAD_WIDTH / 2 - 30, -0.02, ROAD_LENGTH / 2 - 20);
  roadGroup.add(grassL);
  const grassR = grassL.clone();
  grassR.position.x = ROAD_WIDTH / 2 + 30;
  roadGroup.add(grassR);

  scene.add(roadGroup);
}
createRoad();

// =====================================================================
// FINISH LINE
// =====================================================================
function createFinishLine() {
  const group = new THREE.Group();

  // Checkered banner
  const checkerCanvas = document.createElement('canvas');
  checkerCanvas.width = 256; checkerCanvas.height = 64;
  const ctx = checkerCanvas.getContext('2d');
  const sq = 16;
  for (let x = 0; x < 256; x += sq) {
    for (let y = 0; y < 64; y += sq) {
      ctx.fillStyle = ((x / sq + y / sq) % 2 === 0) ? '#fff' : '#000';
      ctx.fillRect(x, y, sq, sq);
    }
  }
  // FINISH text
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 26px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('FINISH', 128, 44);

  const checkerTex = new THREE.CanvasTexture(checkerCanvas);
  const bannerMat = new THREE.MeshBasicMaterial({ map: checkerTex, side: THREE.DoubleSide });
  const bannerGeo = new THREE.PlaneGeometry(ROAD_WIDTH + 4, 4);
  const banner = new THREE.Mesh(bannerGeo, bannerMat);
  banner.position.set(0, 6, FINISH_LINE);
  group.add(banner);

  // Gate poles
  const poleMat = new THREE.MeshLambertMaterial({ color: 0xCCCCCC });
  [-ROAD_WIDTH / 2 - 1, ROAD_WIDTH / 2 + 1].forEach(x => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 10, 8), poleMat);
    pole.position.set(x, 5, FINISH_LINE);
    group.add(pole);
  });

  // Checkered road marking
  const roadCheckerCanvas = document.createElement('canvas');
  roadCheckerCanvas.width = 256; roadCheckerCanvas.height = 256;
  const rctx = roadCheckerCanvas.getContext('2d');
  const sq2 = 32;
  for (let x = 0; x < 256; x += sq2) {
    for (let y = 0; y < 256; y += sq2) {
      rctx.fillStyle = ((x / sq2 + y / sq2) % 2 === 0) ? '#fff' : '#222';
      rctx.fillRect(x, y, sq2, sq2);
    }
  }
  const rcTex = new THREE.CanvasTexture(roadCheckerCanvas);
  const roadMark = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_WIDTH, 5),
    new THREE.MeshBasicMaterial({ map: rcTex, transparent: true, opacity: 0.8 })
  );
  roadMark.rotation.x = -Math.PI / 2;
  roadMark.position.set(0, 0.02, FINISH_LINE);
  group.add(roadMark);

  scene.add(group);
}
createFinishLine();

// =====================================================================
// MOUNTAINS (background)
// =====================================================================
function createMountains() {
  const mountainMat = new THREE.MeshLambertMaterial({ color: 0x6B8C5A });
  const positions = [-200, -120, -60, 60, 120, 200];
  positions.forEach((x, i) => {
    const h = 60 + Math.sin(i * 1.7) * 25;
    const geo = new THREE.ConeGeometry(55 + Math.random() * 30, h, 6 + Math.floor(Math.random() * 4));
    const mesh = new THREE.Mesh(geo, mountainMat);
    mesh.position.set(x, h / 2 - 2, FINISH_LINE + 150 + i * 20);
    mesh.rotation.y = Math.random() * Math.PI;
    scene.add(mesh);
  });
  // Snow caps
  const snowMat = new THREE.MeshLambertMaterial({ color: 0xEEEEEE });
  [{ x: -200, z: FINISH_LINE + 150 }, { x: 60, z: FINISH_LINE + 250 }].forEach(p => {
    const cap = new THREE.Mesh(new THREE.ConeGeometry(15, 20, 6), snowMat);
    cap.position.set(p.x, 65, p.z);
    scene.add(cap);
  });
}
createMountains();

// Roadside barriers / crash barriers
function createBarriers() {
  const barrierMat = new THREE.MeshLambertMaterial({ color: 0xCCCCCC });
  const redMat = new THREE.MeshLambertMaterial({ color: 0xDD2222 });

  for (let z = 5; z < FINISH_LINE; z += 4) {
    const isRed = Math.floor(z / 4) % 2 === 0;
    // Left side
    const bL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 3.8), isRed ? redMat : barrierMat);
    bL.position.set(-ROAD_WIDTH / 2 - 0.25, 0.3, z);
    bL.castShadow = true;
    scene.add(bL);
    // Right side
    const bR = bL.clone();
    bR.position.x = ROAD_WIDTH / 2 + 0.25;
    scene.add(bR);
  }
}
createBarriers();

// =====================================================================
// PALM TREES
// =====================================================================
function createPalmTree(x, z) {
  const group = new THREE.Group();

  // Trunk
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B6914 });
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.4, 8 + Math.random() * 3, 8),
    trunkMat
  );
  trunk.position.y = 4.5;
  trunk.rotation.z = (Math.random() - 0.5) * 0.15;
  trunk.castShadow = true;
  group.add(trunk);

  // Fronds
  const frondMat = new THREE.MeshLambertMaterial({ color: 0x2D7A2D, side: THREE.DoubleSide });
  const frondCount = 7;
  for (let i = 0; i < frondCount; i++) {
    const angle = (i / frondCount) * Math.PI * 2;
    const frondGeo = new THREE.PlaneGeometry(0.5, 4);
    const frond = new THREE.Mesh(frondGeo, frondMat);
    frond.position.y = 9;
    frond.rotation.y = angle;
    frond.rotation.z = Math.PI / 2 - 0.5;
    frond.position.x = Math.cos(angle) * 1.2;
    frond.position.z = Math.sin(angle) * 1.2;
    frond.castShadow = true;
    group.add(frond);
  }

  // Coconuts
  const coconutMat = new THREE.MeshLambertMaterial({ color: 0x5C3A1E });
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), coconutMat);
    const a = (i / 3) * Math.PI * 2;
    c.position.set(Math.cos(a) * 0.5, 8.5, Math.sin(a) * 0.5);
    group.add(c);
  }

  group.position.set(x, 0, z);
  scene.add(group);
  return group;
}

// Starting grid markings
function createStartGrid() {
  const mat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  // Starting line
  const lineGeo = new THREE.PlaneGeometry(ROAD_WIDTH, 0.5);
  const line = new THREE.Mesh(lineGeo, mat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.02, 2);
  scene.add(line);

  // Grid squares (F1 style)
  const gridMat = new THREE.MeshBasicMaterial({ color: 0xCCCCCC, transparent: true, opacity: 0.5 });
  [-2.5, 2.5].forEach(x => {
    const g = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.5), gridMat);
    g.rotation.x = -Math.PI / 2;
    g.position.set(x, 0.02, -1.5);
    scene.add(g);
  });

  // Traffic lights above start
  const lightPole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 10, 8),
    new THREE.MeshLambertMaterial({ color: 0x888888 })
  );
  lightPole.position.set(0, 5, 0);
  scene.add(lightPole);

  // Light housing
  const housingGeo = new THREE.BoxGeometry(3, 0.6, 0.4);
  const housingMat = new THREE.MeshLambertMaterial({ color: 0x333333 });

}

// =====================================================================
// CAR MODEL
// =====================================================================
function buildCarMesh(color) {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color });
  const darkMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x88CCFF, transparent: true, opacity: 0.6 });
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x1A1A1A });
  const rimMat = new THREE.MeshLambertMaterial({ color: 0xCCCCCC });
  const chromeMat = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });

  // Main body
  const bodyGeo = new THREE.BoxGeometry(2.0, 0.55, 4.4);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  group.add(body);

  // Lower skirt / side sill
  const skirtGeo = new THREE.BoxGeometry(2.1, 0.18, 4.2);
  const skirt = new THREE.Mesh(skirtGeo, darkMat);
  skirt.position.y = 0.29;
  group.add(skirt);

  // Cabin top
  const cabinGeo = new THREE.BoxGeometry(1.55, 0.42, 2.0);
  const cabin = new THREE.Mesh(cabinGeo, bodyMat);
  cabin.position.set(0, 1.07, 0.1);
  cabin.castShadow = true;
  group.add(cabin);

  // Windshield front
  const wsFrontGeo = new THREE.BoxGeometry(1.5, 0.4, 0.08);
  const wsFront = new THREE.Mesh(wsFrontGeo, glassMat);
  wsFront.position.set(0, 1.05, -0.9);
  wsFront.rotation.x = -0.3;
  group.add(wsFront);

  // Rear window
  const wsRearGeo = new THREE.BoxGeometry(1.5, 0.35, 0.08);
  const wsRear = new THREE.Mesh(wsRearGeo, glassMat);
  wsRear.position.set(0, 1.02, 1.0);
  wsRear.rotation.x = 0.3;
  group.add(wsRear);

  // Side windows
  [-0.78, 0.78].forEach(x => {
    const swGeo = new THREE.BoxGeometry(0.06, 0.3, 1.4);
    const sw = new THREE.Mesh(swGeo, glassMat);
    sw.position.set(x, 1.08, 0.1);
    group.add(sw);
  });

  // Hood
  const hoodGeo = new THREE.BoxGeometry(2.0, 0.1, 1.4);
  const hood = new THREE.Mesh(hoodGeo, bodyMat);
  hood.position.set(0, 0.83, -1.6);
  hood.rotation.x = 0.1;
  group.add(hood);

  // Front bumper
  const fbGeo = new THREE.BoxGeometry(2.0, 0.3, 0.25);
  const fb = new THREE.Mesh(fbGeo, darkMat);
  fb.position.set(0, 0.4, -2.25);
  group.add(fb);

  // Rear bumper
  const rbGeo = new THREE.BoxGeometry(2.0, 0.3, 0.25);
  const rb = new THREE.Mesh(rbGeo, darkMat);
  rb.position.set(0, 0.4, 2.25);
  group.add(rb);

  // Spoiler
  const spoilerMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const spoilerGeo = new THREE.BoxGeometry(2.1, 0.08, 0.65);
  const spoiler = new THREE.Mesh(spoilerGeo, spoilerMat);
  spoiler.position.set(0, 1.25, 2.1);
  spoiler.rotation.x = 0.12;
  group.add(spoiler);

  // Spoiler mounts
  [-0.7, 0.7].forEach(x => {
    const mount = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 0.08), spoilerMat);
    mount.position.set(x, 1.1, 2.1);
    group.add(mount);
  });

  // Headlights
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xFFFFEE });
  [-0.65, 0.65].forEach(x => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.08), hlMat);
    hl.position.set(x, 0.7, -2.22);
    group.add(hl);
  });

  // Taillights
  const tlMat = new THREE.MeshBasicMaterial({ color: 0xFF2200 });
  [-0.65, 0.65].forEach(x => {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.12, 0.08), tlMat);
    tl.position.set(x, 0.68, 2.22);
    group.add(tl);
  });

  // Exhaust pipes
  [-0.45, 0.45].forEach(x => {
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.3, 8), darkMat);
    pipe.rotation.x = Math.PI / 2;
    pipe.position.set(x, 0.28, 2.32);
    group.add(pipe);
  });

  // Front air intake
  const intakeGeo = new THREE.BoxGeometry(1.2, 0.2, 0.1);
  const intake = new THREE.Mesh(intakeGeo, darkMat);
  intake.position.set(0, 0.38, -2.26);
  group.add(intake);

  // Wheels
  const wheelPositions = [
    { x: -1.1, y: 0.3, z: -1.45 },
    { x:  1.1, y: 0.3, z: -1.45 },
    { x: -1.1, y: 0.3, z:  1.45 },
    { x:  1.1, y: 0.3, z:  1.45 }
  ];
  wheelPositions.forEach(wp => {
    const wGroup = new THREE.Group();
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.28, 16), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wGroup.add(wheel);
    // Rim
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.3, 10), rimMat);
    rim.rotation.z = Math.PI / 2;
    wGroup.add(rim);
    // Spokes
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.32, 0.04), rimMat);
      spoke.rotation.z = angle;
      spoke.position.x = 0;
      wGroup.add(spoke);
    }
    wGroup.position.set(wp.x, wp.y, wp.z);
    wGroup.castShadow = true;
    group.add(wGroup);
  });

  // Undercarriage
  const underGeo = new THREE.BoxGeometry(1.8, 0.1, 3.8);
  const under = new THREE.Mesh(underGeo, darkMat);
  under.position.set(0, 0.2, 0);
  group.add(under);

  group.castShadow = true;
  return group;
}

// Create car meshes
cars.forEach((car, i) => {
  const mesh = buildCarMesh(car.color);
  mesh.position.set(car.laneOffset, 0, 0);
  mesh.rotation.y = Math.PI; // face forward
  scene.add(mesh);
  car.mesh = mesh;
});

// =====================================================================
// AUDIO ENGINE
// =====================================================================
function initAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}
}

function startEngineSound(car, index) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const distortion = audioCtx.createWaveShaper();

    // Distortion curve for engine buzz
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = (i * 2) / 256 - 1;
      curve[i] = (Math.PI + 400) * x / (Math.PI + 400 * Math.abs(x));
    }
    distortion.curve = curve;

    osc.type = 'sawtooth';
    osc.frequency.value = 80 + index * 15;
    gain.gain.value = 0.04;

    osc.connect(distortion);
    distortion.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    car.engineNode = { osc, gain };
  } catch(e) {}
}

function updateEngineSound(car) {
  if (!car.engineNode) return;
  try {
    const speedRatio = car.velocity / car.maxSpeed;
    const freq = 80 + speedRatio * 320;
    car.engineNode.osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
    car.engineNode.gain.gain.setTargetAtTime(0.04 + speedRatio * 0.04, audioCtx.currentTime, 0.05);
  } catch(e) {}
}

function stopEngineSound(car) {
  if (!car.engineNode) return;
  try {
    car.engineNode.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
    setTimeout(() => { try { car.engineNode.osc.stop(); } catch(e) {} }, 600);
    car.engineNode = null;
  } catch(e) {}
}

// =====================================================================
// UI HELPERS
// =====================================================================
function msToKmh(ms) { return Math.round(ms * 3.6); }

function getGear(velocity, thresholds) {
  for (let g = thresholds.length - 1; g >= 0; g--) {
    if (velocity >= thresholds[g]) return g + 1;
  }
  return 1;
}

function formatTime(t) {
  return t.toFixed(3);
}

function updateHUD() {
  document.getElementById('p1-speed').textContent = msToKmh(cars[0].velocity);
  document.getElementById('p2-speed').textContent = msToKmh(cars[1].velocity);
  document.getElementById('p1-gear').textContent = 'GEAR ' + getGear(cars[0].velocity, cars[0].gearThresholds);
  document.getElementById('p2-gear').textContent = 'GEAR ' + getGear(cars[1].velocity, cars[1].gearThresholds);
  document.getElementById('race-timer').textContent = gameState === 'racing' || gameState === 'finished' ? formatTime(raceTimer) : '0.000';

  // RPM bars (speed as % of max)
  const rpm1 = Math.min(cars[0].velocity / cars[0].maxSpeed * 100, 100);
  const rpm2 = Math.min(cars[1].velocity / cars[1].maxSpeed * 100, 100);
  document.getElementById('p1-rpm').style.width = rpm1 + '%';
  document.getElementById('p2-rpm').style.width = rpm2 + '%';

  // Progress bars
  const prog1 = Math.min(cars[0].position / FINISH_LINE * 100, 100);
  const prog2 = Math.min(cars[1].position / FINISH_LINE * 100, 100);
  document.getElementById('p1-fill').style.width = prog1 + '%';
  document.getElementById('p2-fill').style.width = prog2 + '%';

  // Hide hint when racing
  const hint = document.getElementById('start-hint');
  if (hint) hint.style.display = gameState === 'idle' || gameState === 'countdown' ? 'block' : 'none';
}

function showCountdown(text, isGo) {
  const el = document.getElementById('countdown');
  el.textContent = text;
  el.className = isGo ? 'go' : '';
  el.style.display = 'block';
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, -50%) scale(1.2)';
  setTimeout(() => {
    el.style.transform = 'translate(-50%, -50%) scale(1.0)';
  }, 50);
}

function hideCountdown() {
  const el = document.getElementById('countdown');
  el.style.opacity = '0';
  setTimeout(() => { el.style.display = 'none'; }, 200);
}

function showWinner(car, margin) {
  document.getElementById('winner-name').textContent = car.name;
  document.getElementById('winner-time').textContent = '⏱ Finish Time: ' + formatTime(car.finishTime) + 's';
  document.getElementById('winner-margin').textContent = '🏁 Won by: ' + (margin * 1000).toFixed(1) + ' ms';
  document.getElementById('winner-banner').style.display = 'block';
}

function hideWinner() {
  document.getElementById('winner-banner').style.display = 'none';
}

// Speed lines overlay intensity
function updateSpeedLines(maxVelocity) {
  const ratio = Math.max(0, (maxVelocity - 40) / 50);
  document.getElementById('speed-lines').style.opacity = ratio * 0.6;
}

// =====================================================================
// RACE LOGIC
// =====================================================================
function resetRace() {
  gameState = 'idle';
  raceTimer = 0;
  countdownValue = 3;
  countdownTimer = 0;

  cars.forEach((car) => {
    car.position = 0;
    car.velocity = 0;
    car.finished = false;
    car.finishTime = 0;
    stopEngineSound(car);
    car.mesh.position.set(car.laneOffset, 0, 0);
    car.mesh.position.z = 0;
  });

  // Reset start lights
  if (window.startLights) window.startLights.forEach((_, i) => setStartLight(i, false));

  // Clear smoke particles
  smokeParticles.forEach(p => scene.remove(p.mesh));
  smokeParticles.length = 0;
  smokeTimer = 0;

  hideWinner();
  updateHUD();
  document.getElementById('speed-lines').style.opacity = 0;

  // Reset camera smoothly
  camera.position.set(0, 6, -20);
  camera.lookAt(0, 1, 60);

  setTimeout(() => { startCountdown(); }, 600);
}

// Animate start lights
function setStartLight(index, on) {
  if (!window.startLights || !window.startLights[index]) return;
  window.startLights[index].material.color.setHex(on ? 0xFF0000 : 0x440000);
  window.startLights[index].material.emissive = on
    ? new THREE.Color(0xFF0000)
    : new THREE.Color(0x000000);
}

function startCountdown() {
  gameState = 'countdown';
  countdownValue = 3;
  countdownTimer = 0;

  // Reset start lights
  if (window.startLights) window.startLights.forEach((_, i) => setStartLight(i, false));

  initAudio();
  playBeep(880, 0.12, 0.1);

  // Illuminate lights one by one per second: 3→4, 2→3,4,5, 1→all
  // We use 3-2-1 countdown: light 1 at count=3, lights 1-2 at count=2, lights 1-3 at count=1
  setStartLight(0, true);
  showCountdown('3', false);
}

function playBeep(freq, vol, dur) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.connect(g); g.connect(audioCtx.destination);
    osc.frequency.value = freq; g.gain.value = vol;
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function triggerGo() {
  gameState = 'racing';
  showCountdown('GO!', true);
  setTimeout(hideCountdown, 900);

  // Turn off start lights (race GO)
  if (window.startLights) window.startLights.forEach((_, i) => {
    setTimeout(() => setStartLight(i, false), i * 40);
  });

  // Start engine sounds
  cars.forEach((car, i) => startEngineSound(car, i));

  playBeep(1320, 0.2, 0.18);
  setTimeout(() => playBeep(1760, 0.15, 0.12), 80);
}

function updateCountdown(dt) {
  if (gameState !== 'countdown') return;
  countdownTimer += dt;

  if (countdownTimer >= 1.0) {
    countdownTimer -= 1.0;
    countdownValue--;

    if (countdownValue <= 0) {
      triggerGo();
    } else {
      playBeep(880, 0.14, 0.1);
      showCountdown(String(countdownValue), false);
      // Light up more start lights
      if (countdownValue === 2) {
        setStartLight(1, true);
        setStartLight(2, true);
      } else if (countdownValue === 1) {
        setStartLight(3, true);
        setStartLight(4, true);
      }
    }
  }
}

function updateCars(dt) {
  if (gameState !== 'racing') return;

  let allFinished = true;

  cars.forEach((car, i) => {
    if (car.finished) return;
    allFinished = false;

    // Physics: acceleration with drag
    const effectiveDrag = car.drag * car.velocity * car.velocity * 0.1;
    const acceleration = car.accel * (1 - car.velocity / car.maxSpeed);
    car.velocity += (acceleration - effectiveDrag) * dt;
    car.velocity = Math.max(0, Math.min(car.velocity, car.maxSpeed));

    car.position += car.velocity * dt;
    car.mesh.position.z = car.position;

    // Engine sound update
    updateEngineSound(car);

    // Check finish
    if (car.position >= FINISH_LINE) {
      car.finished = true;
      car.finishTime = raceTimer;
    }
  });

  raceTimer += dt;

  // Check if both finished — give brief window then force second car finish
  const bothDone = cars.every(c => c.finished);
  const oneDone = cars.some(c => c.finished);

  if (oneDone && !bothDone) {
    const firstFinisher = cars.find(c => c.finished);
    const unfinished = cars.find(c => !c.finished);
    // Auto-finish second car within 0.4s for drama
    if (raceTimer - firstFinisher.finishTime > 0.35) {
      unfinished.finished = true;
      unfinished.finishTime = raceTimer;
    }
  }

  if (cars.every(c => c.finished) && gameState === 'racing') {
    gameState = 'finished';
    const winner = cars[0].finishTime <= cars[1].finishTime ? cars[0] : cars[1];
    const margin = Math.abs(cars[0].finishTime - cars[1].finishTime);
    // Let cars coast to stop
    setTimeout(() => showWinner(winner, margin), 1400);
    cars.forEach(car => stopEngineSound(car));
  }

  // Coast after finish
  if (gameState === 'finished') {
    cars.forEach(car => {
      car.velocity = Math.max(0, car.velocity - 12 * dt);
      car.position += car.velocity * dt;
      car.mesh.position.z = car.position;
    });
    raceTimer += dt;
  }
}

// =====================================================================
// CAMERA
// =====================================================================
function updateCamera() {
  const avgZ = (cars[0].mesh.position.z + cars[1].mesh.position.z) / 2;
  const maxSpeed = Math.max(cars[0].velocity, cars[1].velocity);

  // Dynamic FOV based on speed
  camera.fov = 65 + (maxSpeed / 88) * 15;
  camera.updateProjectionMatrix();

  // Chase camera: behind cars, slightly elevated
  const targetCamZ = avgZ - 18;
  const targetCamY = 5.5 + (maxSpeed / 88) * 1.5;

  camera.position.z += (targetCamZ - camera.position.z) * 0.08;
  camera.position.y += (targetCamY - camera.position.y) * 0.05;
  camera.position.x += (0 - camera.position.x) * 0.08;

  camera.lookAt(0, 1.5, avgZ + 50);
}

// =====================================================================
// SUN SHADOW MOVEMENT (light follows camera)
// =====================================================================
function updateLighting() {
  const avgZ = (cars[0].position + cars[1].position) / 2;
  sunLight.position.set(60, 120, avgZ - 80);
  sunLight.target.position.set(0, 0, avgZ + 40);
  sunLight.target.updateMatrixWorld();
}

// =====================================================================
// WHEEL ANIMATION
// =====================================================================
function animateWheels(dt) {
  cars.forEach(car => {
    if (!car.mesh) return;
    const rotSpeed = car.velocity / 0.35; // wheel circumference ~2.2m
    car.mesh.children.forEach(child => {
      if (child.isGroup) {
        child.rotation.x -= rotSpeed * dt * 0.8;
      }
    });
  });
}

// =====================================================================
// PARTICLE / SMOKE EFFECT at wheels during launch
// =====================================================================
const smokeParticles = [];

function createSmokePuff(x, z) {
  if (!audioCtx) return; // only after interaction
  const geo = new THREE.SphereGeometry(0.25 + Math.random() * 0.25, 6, 6);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xAAAAAA, transparent: true, opacity: 0.5
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0.3, z);
  scene.add(mesh);
  smokeParticles.push({ mesh, life: 0.8, vx: (Math.random() - 0.5) * 2, vy: 1.5, vz: -3 });
}

function updateSmoke(dt) {
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.life -= dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.scale.setScalar(1 + (0.8 - p.life) * 2);
    p.mesh.material.opacity = p.life * 0.6;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      smokeParticles.splice(i, 1);
    }
  }
}

let smokeTimer = 0;

// =====================================================================
// MAIN LOOP
// =====================================================================
function animate(timestamp) {
  animFrameId = requestAnimationFrame(animate);

  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  updateCountdown(dt);
  updateCars(dt);
  updateCamera();
  updateLighting();
  animateWheels(dt);
  updateHUD();
  updateSmoke(dt);
  updateSpeedLines(Math.max(cars[0].velocity, cars[1].velocity));

  // Emit launch smoke for the first 1.5s of race
  if (gameState === 'racing') {
    smokeTimer += dt;
    if (smokeTimer < 1.5 && smokeTimer % 0.08 < dt) {
      cars.forEach(car => {
        createSmokePuff(car.laneOffset + (Math.random() - 0.5), car.position - 2.5);
      });
    }
  }

  renderer.render(scene, camera);
}

// =====================================================================
// RESIZE
// =====================================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =====================================================================
// EXPOSE reset for button
// =====================================================================
window.resetRace = resetRace;

// =====================================================================
// START
// =====================================================================
animate(0);
setTimeout(startCountdown, 1000);
