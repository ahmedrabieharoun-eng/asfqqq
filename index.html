
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Panda Bamboo — Deposit</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script src="https://unpkg.com/tonweb/dist/tonweb.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bamboo:#7cb342;--bamboo2:#9ccc40;--bamboo-glow:rgba(124,179,66,.5);
  --coin:#FFD700;--coin-glow:rgba(255,215,0,.4);
  --card:rgba(6,20,6,.82);--glass:rgba(8,28,8,.68);
  --border:rgba(124,179,66,.2);--border2:rgba(124,179,66,.38);
  --text:#e8f5e9;--muted:rgba(232,245,233,.52);
  --red:#ef5350;--blue:#42a5f5;--cyan:#26c6da;
  --g1:#061206;--g2:#0a1f0a;--g3:#0d2810;
  --primary-pink:#FF5CA8;--pink-glow:rgba(255,92,168,.4);
  --neon-green:#00F27A;--green-glow:rgba(0,242,122,.4);
  --crystal-blue:#00D4FF;--blue-glow:rgba(0,212,255,.4);
  --text-secondary:rgba(255,255,255,.85);
  --glass-border:rgba(255,255,255,.08);
}
body{
  font-family:'Fredoka',cursive;font-weight:800;
  background:url('https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/3e1a9f27-dd8e-459f-9c24-e0e51d9c255e.png') center center / cover no-repeat fixed;
  color:var(--text);min-height:100vh;padding:14px 12px 30px;overflow-x:hidden;font-size:14px;
}
button,input,select,textarea,span,div,p,h1,h2,h3,a{font-family:'Fredoka',cursive!important;}

/* Shimmer animation */
@keyframes shim{0%{left:-100%}100%{left:200%}}
@keyframes live-dot{0%,100%{opacity:1}50%{opacity:.3}}

/* ── OFFER BANNER ── */
@keyframes dep-offer-pulse{0%,100%{box-shadow:0 0 18px rgba(255,215,0,.25),0 4px 16px rgba(0,0,0,.4)}50%{box-shadow:0 0 32px rgba(255,215,0,.5),0 4px 22px rgba(0,0,0,.55)}}
@keyframes dep-offer-fire{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.18) rotate(4deg)}}
@keyframes dep-offer-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.dep-offer-banner{
  background:linear-gradient(135deg,rgba(20,12,0,.95),rgba(40,22,0,.92));
  border:1.5px solid rgba(255,193,7,.45);
  border-radius:16px;margin-bottom:14px;
  overflow:hidden;position:relative;
  animation:dep-offer-pulse 2.4s ease-in-out infinite;
}
.dep-offer-banner::before{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.07),transparent);
  animation:shim 2.8s infinite;pointer-events:none;
}
.dep-offer-top{
  background:linear-gradient(90deg,rgba(255,152,0,.18),rgba(255,193,7,.1),rgba(255,152,0,.18));
  border-bottom:1px solid rgba(255,193,7,.2);
  padding:7px 12px;display:flex;align-items:center;gap:7px;
}
.dep-offer-fire{font-size:18px;animation:dep-offer-fire 1.4s ease-in-out infinite;display:inline-block}
.dep-offer-live{display:flex;align-items:center;gap:5px;flex:1}
.dep-offer-dot{width:7px;height:7px;border-radius:50%;background:#ff4444;box-shadow:0 0 6px #ff4444;animation:live-dot 1s ease-in-out infinite}
.dep-offer-live-txt{font-size:11px;font-weight:800;color:#FFD740;letter-spacing:.5px;text-transform:uppercase}
.dep-offer-badge{
  background:linear-gradient(135deg,#ff8f00,#FFD700);border-radius:20px;
  padding:3px 11px;font-size:12px;font-weight:800;color:#1a0a00;
  animation:dep-offer-badge 2s ease-in-out infinite;flex-shrink:0;
}
.dep-offer-body{padding:10px 14px 12px;display:flex;align-items:center;gap:12px}
.dep-offer-icon{font-size:36px;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(255,215,0,.5))}
.dep-offer-text{flex:1}
.dep-offer-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:3px;line-height:1.2}
.dep-offer-title span{color:#FFD700}
.dep-offer-sub{font-size:11px;color:rgba(255,215,0,.65);font-weight:600;line-height:1.5}
.dep-offer-pct{
  flex-shrink:0;text-align:center;
  background:linear-gradient(135deg,rgba(255,152,0,.2),rgba(255,215,0,.12));
  border:1.5px solid rgba(255,193,7,.4);border-radius:12px;padding:8px 12px;
}
.dep-offer-pct-num{font-size:26px;font-weight:800;color:#FFD700;line-height:1;text-shadow:0 0 12px rgba(255,215,0,.6)}
.dep-offer-pct-lbl{font-size:9px;color:rgba(255,215,0,.65);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}

/* ── BALANCE CARD ── */
.bal-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:14px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px}
.bal-icon{font-size:30px}
.bal-info{flex:1}
.bal-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px}
.bal-val{font-size:22px;font-weight:800;color:#fff}

/* ── FORM CARD ── */
.wd-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;backdrop-filter:blur(6px)}
.wal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding:10px 12px;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:12px;}
.wl-inf .wll{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:3px}
.wl-inf .wla{font-size:12px;font-weight:700;color:var(--cyan);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-conn{background:linear-gradient(135deg,var(--crystal-blue),#0097b2);border:none;border-radius:10px;padding:7px 14px;color:#fff;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
.dep-warn{display:flex;align-items:flex-start;gap:8px;padding:8px 11px;background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.2);border-radius:10px;margin-bottom:10px;font-size:11px;color:#FFD740;font-weight:600;}
.dep-warn i{margin-top:2px;flex-shrink:0}
.flabel{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block}
.finput{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-weight:600;margin-bottom:7px;}
.finput:focus{outline:none;border-color:var(--bamboo)}
.preset-row{display:flex;gap:5px;margin-bottom:9px}
.prbtn{flex:1;padding:7px;text-align:center;background:rgba(124,179,66,.1);border:1px solid rgba(124,179,66,.2);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--bamboo);}
.prbtn:active{background:rgba(124,179,66,.28)}

/* ── PREVIEW BOX ── */
.dep-preview-box{background:rgba(124,179,66,.07);border:1px solid rgba(124,179,66,.16);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.dep-preview-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.dep-preview-divider{height:1px;background:rgba(255,255,255,.07);margin:5px 0}
.dep-preview-label{font-size:11px;color:var(--muted);font-weight:600}
.dep-preview-label-total{font-size:13px;font-weight:800;color:#fff}
.dep-preview-val{font-size:16px;font-weight:800;color:var(--bamboo);display:flex;align-items:center;gap:5px}
.dep-preview-bonus-val{font-size:14px;font-weight:800;color:#FFD700;display:flex;align-items:center;gap:4px}
.dep-preview-total-val{font-size:18px;font-weight:800;color:#FFD700;display:flex;align-items:center;gap:5px;text-shadow:0 0 10px rgba(255,215,0,.4)}
.dep-preview-bonus-tag{background:rgba(255,152,0,.18);border:1px solid rgba(255,193,7,.35);border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;color:#FFD740;margin-left:4px}

/* ── BUTTON ── */
.btn-prim{width:100%;padding:13px;background:linear-gradient(135deg,var(--bamboo),#4e7a20);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 0 14px var(--bamboo-glow);}
.btn-prim:disabled{opacity:.42;cursor:default;box-shadow:none}

/* ── TX STATUS ── */
.tx-status{display:none;margin-top:10px;padding:11px;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:12px;text-align:center;}
.tx-status.visible{display:block}
.txsi{font-size:22px;margin-bottom:4px}
.txsm{font-size:13px;font-weight:800;margin-bottom:3px}
.txsd{font-size:11px;color:var(--muted);font-weight:500}

/* ── NOTIF TOAST ── */
.notif-toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:rgba(10,30,10,.96);border:1px solid var(--border);border-radius:14px;padding:10px 18px;font-size:13px;font-weight:700;color:var(--text);z-index:9999;transition:transform .3s ease;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;}
.notif-toast.show{transform:translateX(-50%) translateY(0)}
.notif-toast.s{border-color:var(--bamboo);color:var(--bamboo)}
.notif-toast.e{border-color:var(--red);color:var(--red)}

/* ── PAGE TITLE ── */
.page-title{font-size:20px;font-weight:800;color:var(--bamboo);margin-bottom:14px;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

<div class="page-title">💰 Deposit TON</div>

<!-- Balance Card -->
<div class="bal-card">
  <div class="bal-icon">🎋</div>
  <div class="bal-info">
    <div class="bal-lbl">Your Bamboo Balance</div>
    <div class="bal-val" id="bambooBalance">—</div>
  </div>
</div>



<!-- Deposit Form -->
<div class="wd-form">
  <!-- Wallet Row -->
  <div class="wal-row">
    <div class="wl-inf">
      <div class="wll">Wallet</div>
      <div class="wla" id="walletAddressDisplay">Not connected</div>
    </div>
    <button class="btn-conn" id="connectWalletBtn" onclick="connectWallet()"><i class="fas fa-plug"></i> Connect</button>
  </div>

  <!-- Warning -->
  <div class="dep-warn">
    <i class="fas fa-exclamation-triangle"></i>
    <div>
      <strong>IMPORTANT:</strong> Your User ID
      <span id="depositUserIdDisplay" style="background:rgba(255,255,255,.14);padding:2px 7px;border-radius:10px;font-weight:800"></span>
      must be the ONLY comment in the transaction.
    </div>
  </div>

  <!-- Amount Input -->
  <label class="flabel">Amount (TON)</label>
  <input type="number" id="depositAmountInput" class="finput" placeholder="1" step="0.1" min="1" oninput="updDepPreview()">

  <!-- Preset Buttons -->
  <div class="preset-row">
    <span class="prbtn" onclick="setDepAmt(1)">1</span>
    <span class="prbtn" onclick="setDepAmt(2)">2</span>
    <span class="prbtn" onclick="setDepAmt(5)">5</span>
    <span class="prbtn" onclick="setDepAmt(10)">10</span>
  </div>

  <!-- Preview Box -->
  <div class="dep-preview-box">
    <div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:7px">
      📊 Rate: <strong style="color:var(--bamboo)">1 TON = 1 Bamboo</strong>
    </div>
    <div class="dep-preview-row">
      <span class="dep-preview-label">You will receive:</span>
      <span id="depBambooPreview" class="dep-preview-val">
        <img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/d7e19f8c-7876-4dc6-8542-d4f615704e46.png" style="width:18px;height:18px;object-fit:contain"> 0 Bamboo
      </span>
    </div>
    <div class="dep-preview-row" id="depBonusRow" style="display:none">
      <span class="dep-preview-label">🎁 Bonus:</span>
      <span id="depBonusPreview" class="dep-preview-bonus-val">
        <img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/d7e19f8c-7876-4dc6-8542-d4f615704e46.png" style="width:16px;height:16px;object-fit:contain"> 0 Bamboo
      </span>
    </div>
    <div class="dep-preview-divider" id="depTotalDivider" style="display:none"></div>
    <div class="dep-preview-row" id="depTotalRow" style="display:none">
      <span class="dep-preview-label-total">🏆 Total:</span>
      <span id="depTotalPreview" class="dep-preview-total-val">
        <img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/d7e19f8c-7876-4dc6-8542-d4f615704e46.png" style="width:20px;height:20px;object-fit:contain"> 0 Bamboo
      </span>
    </div>
  </div>

  <!-- Submit Button -->
  <button class="btn-prim" id="submitDepositBtn" disabled onclick="initiateDeposit()">
    <i class="fas fa-arrow-down"></i> Deposit TON
  </button>

  <!-- TX Status -->
  <div class="tx-status" id="depositStatus">
    <div class="txsi">⏳</div>
    <div class="txsm">Processing deposit...</div>
    <div class="txsd" id="depositStatusDetail"></div>
  </div>
</div>

<!-- Toast -->
<div class="notif-toast" id="notifToast"></div>

<script>
// ════════════════════════════════════════
//   CONFIG — عدّل هذه القيم حسب مشروعك
// ════════════════════════════════════════
const CFG = {
  API_URL: 'https://your-worker.your-subdomain.workers.dev', // ← عدّل هنا
  DEPOSIT_WALLET: 'UQA1c65zeiKZg4lpf4mwZeaSsNRyZhQ181M13brLTm2i_s5k',
};
const TON_TO_BAMBOO = 1;
const BONUS_PCT = 0;

// ════════════════════════════════════════
//   STATE
// ════════════════════════════════════════
const S = {
  userId: null,
  initData: null,
  wallet: null,
  tonUI: null,
  user: null,
  depCheckInt: null,
};

// ════════════════════════════════════════
//   UTILS
// ════════════════════════════════════════
function fmt(n){ return Number(n).toLocaleString(); }

function showNotif(msg, type=''){
  const el = document.getElementById('notifToast');
  el.textContent = msg;
  el.className = 'notif-toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 3000);
}

// ════════════════════════════════════════
//   API CALL
// ════════════════════════════════════════
async function api(action, data={}){
  const res = await fetch(CFG.API_URL + '/api', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Telegram ' + S.initData,
      'X-Action': action,
    },
    body: JSON.stringify({ action, data }),
  });
  const json = await res.json();
  if(!json.success) throw new Error(json.error || 'API error');
  return json.data;
}

// ════════════════════════════════════════
//   PREVIEW
// ════════════════════════════════════════
function setDepAmt(v){
  document.getElementById('depositAmountInput').value = Math.max(1, v);
  updDepPreview();
}

function updDepPreview(){
  const ton = parseFloat(document.getElementById('depositAmountInput').value) || 0;
  const bam = Math.floor(ton * TON_TO_BAMBOO);
  const bonus = Math.floor(bam * BONUS_PCT);
  const total = bam + bonus;
  const bamImg = '<img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/d7e19f8c-7876-4dc6-8542-d4f615704e46.png" style="width:20px;height:20px;object-fit:contain">';
  const bamImgSm = '<img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/d7e19f8c-7876-4dc6-8542-d4f615704e46.png" style="width:16px;height:16px;object-fit:contain">';

  const el = document.getElementById('depBambooPreview');
  if(el) el.innerHTML = `${bamImg} ${fmt(bam)} Bamboo`;

  const bonusRow = document.getElementById('depBonusRow');
  const bonusEl  = document.getElementById('depBonusPreview');
  const divider  = document.getElementById('depTotalDivider');
  const totalRow = document.getElementById('depTotalRow');
  const totalEl  = document.getElementById('depTotalPreview');

  if(ton > 0){
    if(bonusRow) bonusRow.style.display = 'flex';
    if(divider)  divider.style.display  = 'block';
    if(totalRow) totalRow.style.display = 'flex';
    if(bonusEl)  bonusEl.innerHTML  = `${bamImgSm} +${fmt(bonus)} Bamboo`;
    if(totalEl)  totalEl.innerHTML  = `${bamImg} ${fmt(total)} Bamboo`;
  } else {
    if(bonusRow) bonusRow.style.display = 'none';
    if(divider)  divider.style.display  = 'none';
    if(totalRow) totalRow.style.display = 'none';
  }
}

// ════════════════════════════════════════
//   TON CONNECT
// ════════════════════════════════════════
async function initTON(){
  try{
    if(window.TON_CONNECT_UI){
      S.tonUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: `${CFG.API_URL}/tonconnect-manifest.json`,
        uiPreferences: { theme: 'DARK' },
      });
      S.tonUI.onStatusChange(w => w ? onWConn(w) : onWDisc());
      setTimeout(()=>{ if(S.tonUI.connected) S.tonUI.getWallets(); }, 500);
    }
  }catch(e){ console.error('TON init error:', e); }
}

function onWConn(w){
  S.wallet = { address: w.account.address, chain: w.account.chain, appName: w.device.appName };
  const sh = `${S.wallet.address.substring(0,6)}...${S.wallet.address.slice(-4)}`;
  document.getElementById('walletAddressDisplay').textContent = `${sh} · ${S.wallet.appName}`;
  document.getElementById('connectWalletBtn').innerHTML = '<i class="fas fa-unlink"></i> Disconnect';
  document.getElementById('connectWalletBtn').onclick = disconnectWallet;
  document.getElementById('submitDepositBtn').disabled = false;
}

function onWDisc(){
  S.wallet = null;
  document.getElementById('walletAddressDisplay').textContent = 'Not connected';
  document.getElementById('connectWalletBtn').innerHTML = '<i class="fas fa-plug"></i> Connect';
  document.getElementById('connectWalletBtn').onclick = connectWallet;
  document.getElementById('submitDepositBtn').disabled = true;
}

async function connectWallet(){ if(S.tonUI) await S.tonUI.openModal(); }
async function disconnectWallet(){ if(S.tonUI) await S.tonUI.disconnect(); }

// ════════════════════════════════════════
//   INITIATE DEPOSIT
// ════════════════════════════════════════
async function initiateDeposit(){
  if(!S.wallet){ showNotif('❌ Connect your wallet first', 'e'); return; }
  const amt = parseFloat(document.getElementById('depositAmountInput').value);
  if(!amt || amt < 1){ showNotif('❌ Minimum deposit is 1 TON', 'e'); return; }
  if(amt > 1000){ showNotif('❌ Amount too large', 'e'); return; }

  const btn = document.getElementById('submitDepositBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

  try{
    const comment = String(S.userId);
    const nano = String(Math.floor(amt * 1e9));

    if(!window.TonWeb) throw new Error('TonWeb not loaded');
    const TW = window.TonWeb; new TW();
    const cell = new TW.boc.Cell();
    cell.bits.writeUint(0, 32);
    cell.bits.writeString(comment);
    const boc = await cell.toBoc(false);
    const payload = TW.utils.bytesToBase64(boc);

    const tx = {
      validUntil: Math.floor(Date.now() / 1000) + 600,
      messages: [{ address: CFG.DEPOSIT_WALLET, amount: nano, payload }],
    };

    const result = await S.tonUI.sendTransaction(tx);

    // Show pending status
    const sd = document.getElementById('depositStatus');
    sd.classList.add('visible');
    sd.querySelector('.txsi').innerHTML = '⏳';
    sd.querySelector('.txsm').innerHTML = 'Transaction sent!';
    document.getElementById('depositStatusDetail').textContent = 'Your balance will be added within 3 minutes.';
    showNotif('✅ Transaction sent! Balance credited within 3 minutes', 's');

    // Register in backend (fire & forget)
    try{ await api('deposit', { amount: amt, txHash: result.boc, comment }); }catch(_){}

    // Poll for confirmation
    startDepVerify(null, result.boc);

  }catch(e){
    const sd = document.getElementById('depositStatus');
    sd.classList.add('visible');
    sd.querySelector('.txsi').innerHTML = '❌';
    sd.querySelector('.txsm').innerHTML = e.message?.includes('rejected') ? 'Transaction rejected' : 'Transaction failed';
    document.getElementById('depositStatusDetail').textContent = e.message || 'Please try again';
    showNotif('❌ ' + (e.message || 'Transaction failed'), 'e');
  }finally{
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-arrow-down"></i> Deposit TON';
  }
}

// ════════════════════════════════════════
//   POLLING FOR CONFIRMATION
// ════════════════════════════════════════
function startDepVerify(depId, txHash){
  if(S.depCheckInt) clearInterval(S.depCheckInt);
  const prevBamboo = S.user?.bamboo || 0;
  let attempts = 0;

  S.depCheckInt = setInterval(async()=>{
    attempts++;
    try{
      const r = await api('getState', {});
      if(r && r.user && r.user.bamboo > prevBamboo){
        clearInterval(S.depCheckInt);
        const diff = r.user.bamboo - prevBamboo;
        const sd = document.getElementById('depositStatus');
        if(sd){
          sd.querySelector('.txsi').innerHTML = '✅';
          sd.querySelector('.txsm').innerHTML = 'Deposit confirmed!';
          document.getElementById('depositStatusDetail').textContent = `+${fmt(diff)} Bamboo added`;
        }
        showNotif(`💰 Deposit confirmed! +${fmt(diff)} Bamboo`, 's');
        // Update displayed balance
        S.user = r.user;
        document.getElementById('bambooBalance').textContent = fmt(r.user.bamboo) + ' 🎋';
        setTimeout(()=>sd&&sd.classList.remove('visible'), 3500);
      }
    }catch(e){}
    if(attempts >= 36) clearInterval(S.depCheckInt); // stop after ~6 min
  }, 10000);
}

// ════════════════════════════════════════
//   LOAD USER STATE
// ════════════════════════════════════════
async function loadState(){
  try{
    const r = await api('getState', {});
    S.user = r.user;
    document.getElementById('bambooBalance').textContent = fmt(r.user.bamboo) + ' 🎋';
  }catch(e){
    console.error('loadState error:', e);
  }
}

// ════════════════════════════════════════
//   INIT
// ════════════════════════════════════════
(async function init(){
  const tg = window.Telegram?.WebApp;
  if(tg){
    tg.ready();
    tg.expand();
    S.initData = tg.initData;
    S.userId   = tg.initDataUnsafe?.user?.id;
  }

  // Show user ID in warning
  if(S.userId){
    document.getElementById('depositUserIdDisplay').textContent = S.userId;
  }

  // Init TON Connect
  await initTON();

  // Load balance
  if(S.initData) await loadState();
})();
</script>
