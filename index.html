<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAG RACE — MOTORCYCLES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; }
  #canvas-container { position:relative; width:100vw; height:100vh; }
  canvas { display:block; width:100%!important; height:100%!important; }

  /* ── LOADING SCREEN ── */
  #loading-screen {
    position:fixed; inset:0; z-index:999;
    background:radial-gradient(ellipse at center, #0a0a14 0%, #000 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity 0.9s ease, visibility 0.9s ease;
  }
  #loading-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
  #loading-logo {
    font-size:52px; font-weight:900; letter-spacing:8px; text-transform:uppercase;
    color:#fff; text-shadow:0 0 40px rgba(255,180,0,0.8),0 0 80px rgba(255,100,0,0.4);
    margin-bottom:10px; animation:logoPulse 2s ease-in-out infinite;
  }
  #loading-logo span { color:#FFB800; }
  @keyframes logoPulse {
    0%,100%{text-shadow:0 0 40px rgba(255,180,0,0.8),0 0 80px rgba(255,100,0,0.4);}
    50%{text-shadow:0 0 60px rgba(255,180,0,1),0 0 120px rgba(255,100,0,0.7);}
  }
  #loading-subtitle {
    font-size:11px; color:rgba(255,255,255,0.35); letter-spacing:5px;
    text-transform:uppercase; margin-bottom:60px;
  }
  #loading-bar-wrap {
    width:320px; height:5px; background:rgba(255,255,255,0.08);
    border-radius:10px; overflow:hidden; margin-bottom:18px;
    box-shadow:0 0 20px rgba(255,180,0,0.15);
  }
  #loading-bar {
    height:100%; width:0%; border-radius:10px;
    background:linear-gradient(90deg,#FF5500,#FFB800,#FFE000);
    transition:width 0.25s ease;
    box-shadow:0 0 10px rgba(255,180,0,0.6);
  }
  #loading-status {
    font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:3px;
    text-transform:uppercase; min-height:16px; text-align:center;
  }
  #loading-dots {
    margin-top:50px; display:flex; gap:10px; align-items:center;
  }
  .load-dot {
    width:8px; height:8px; border-radius:50%;
    animation:dotBounce 1.2s ease-in-out infinite;
  }
  .load-dot:nth-child(1){ background:#FFB800; animation-delay:0s; }
  .load-dot:nth-child(2){ background:#FF8800; animation-delay:0.2s; }
  .load-dot:nth-child(3){ background:#FF5500; animation-delay:0.4s; }
  @keyframes dotBounce {
    0%,100%{transform:translateY(0);opacity:0.3;}
    50%{transform:translateY(-10px);opacity:1;}
  }

  #vignette {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  #speed-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:6; opacity:0; transition:opacity 0.25s;
    background:radial-gradient(ellipse at center, transparent 20%, rgba(180,200,255,0.05) 100%);
  }
  #lens-flare {
    position:absolute; pointer-events:none; z-index:8;
    width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,248,200,0.55) 0%, rgba(255,210,80,0.18) 40%, transparent 70%);
    display:none; transform:translate(-50%,-50%); filter:blur(8px);
  }

  /* HUD */
  #hud { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:15; }
  #p1-hud {
    position:absolute; top:16px; left:16px;
    background:linear-gradient(135deg,rgba(0,0,0,0.75) 0%,rgba(20,12,0,0.7) 100%);
    border:1px solid rgba(255,180,0,0.5); border-radius:10px;
    padding:8px 12px; min-width:140px;
    backdrop-filter:blur(12px);
    box-shadow:0 4px 28px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,200,0,0.14);
  }
  #p2-hud {
    position:absolute; top:16px; right:16px;
    background:linear-gradient(135deg,rgba(0,0,0,0.75) 0%,rgba(0,12,32,0.7) 100%);
    border:1px solid rgba(0,160,255,0.5); border-radius:10px;
    padding:8px 12px; min-width:140px; text-align:right;
    backdrop-filter:blur(12px);
    box-shadow:0 4px 28px rgba(0,0,0,0.55),inset 0 1px 0 rgba(0,180,255,0.14);
  }
  .car-name { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  #p1-hud .car-name { color:#FFB800; }
  #p2-hud .car-name { color:#00CFFF; }
  .speed-gauge-wrap { display:inline-flex; align-items:center; margin-bottom:6px; }
  .speed-num { font-size:28px; font-weight:900; color:#fff; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 22px rgba(255,255,255,0.3); }
  .speed-unit { font-size:9px; color:rgba(255,255,255,0.45); margin-left:4px; align-self:flex-end; margin-bottom:2px; }
  .rpm-label { font-size:7px; color:rgba(255,255,255,0.35); letter-spacing:2px; text-transform:uppercase; margin-bottom:2px; }
  .rpm-bar-bg { width:100%; height:4px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
  .rpm-fill { height:100%; border-radius:3px; transition:width 0.06s linear; background:linear-gradient(90deg,#00FF88,#FFB800,#FF2200); background-size:200% 100%; }
  .gear-row { display:flex; align-items:baseline; margin-top:4px; gap:8px; }
  .gear-label { font-size:7px; color:rgba(255,255,255,0.35); letter-spacing:2px; text-transform:uppercase; }
  .gear-num { font-size:18px; font-weight:900; color:#FF8C00; line-height:1; }
  #p2-hud .gear-row { flex-direction:row-reverse; }
  #p2-hud .gear-num { color:#00CFFF; }
  #timer-hud {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.68); border:1px solid rgba(255,255,255,0.14);
    border-radius:8px; padding:6px 16px; text-align:center;
    backdrop-filter:blur(12px); box-shadow:0 4px 22px rgba(0,0,0,0.5);
  }
  .timer-label { font-size:7px; color:rgba(255,255,255,0.35); letter-spacing:3px; text-transform:uppercase; margin-bottom:2px; }
  .timer-value { font-size:20px; font-weight:900; color:#fff; font-variant-numeric:tabular-nums; letter-spacing:1px; }
  .prog-wrap { position:absolute; bottom:28px; width:38%; }
  #p1-prog-wrap { left:5%; }
  #p2-prog-wrap { right:5%; }
  .prog-label { font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  #p2-prog-wrap .prog-label { text-align:right; }
  .prog-bg { width:100%; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
  #p1-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,#FFB800,#FF4400); width:0%; transition:width 0.05s; }
  #p2-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,#0088FF,#AA00FF); width:0%; transition:width 0.05s; }
  #countdown {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(1);
    font-size:160px; font-weight:900; color:#fff;
    text-shadow:0 0 40px rgba(255,60,60,0.95),0 0 80px rgba(255,60,60,0.5),5px 5px 0 #000;
    letter-spacing:4px; pointer-events:none; display:none; text-align:center; white-space:nowrap;
    animation:countPulse 0.6s ease-out;
  }
  #countdown.go { color:#00FF88; text-shadow:0 0 40px rgba(0,255,120,0.95),0 0 80px rgba(0,255,120,0.5),5px 5px 0 #003300; font-size:180px; }
  @keyframes countPulse {
    0%{transform:translate(-50%,-50%) scale(1.6);opacity:0;}
    40%{opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  }
  #winner-banner {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9); border:2px solid #FFB800; border-radius:20px;
    padding:40px 70px; text-align:center; display:none; pointer-events:all; z-index:25;
    backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:0 0 80px rgba(255,180,0,0.4),0 20px 60px rgba(0,0,0,0.7);
  }
  #winner-title { font-size:12px; color:rgba(255,255,255,0.45); letter-spacing:5px; text-transform:uppercase; margin-bottom:10px; }
  #winner-name { font-size:56px; font-weight:900; color:#FFB800; text-shadow:0 0 30px rgba(255,180,0,0.7); margin-bottom:10px; }
  #winner-time { font-size:18px; color:rgba(255,255,255,0.7); margin-bottom:5px; }
  #winner-margin { font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:32px; }
  #race-again-btn {
    background:linear-gradient(135deg,#FFB800,#FF5500); color:#000; border:none; border-radius:50px;
    padding:15px 50px; font-size:16px; font-weight:800; cursor:pointer;
    text-transform:uppercase; letter-spacing:3px; transition:transform 0.12s,box-shadow 0.12s;
    pointer-events:all; box-shadow:0 4px 20px rgba(255,100,0,0.4);
  }
  #race-again-btn:hover { transform:scale(1.06); box-shadow:0 8px 36px rgba(255,140,0,0.6); }
  #launch-hint {
    position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
    font-size:12px; color:rgba(255,255,255,0.55); letter-spacing:3px;
    text-transform:uppercase; pointer-events:none; animation:blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.5;} 50%{opacity:1;} }

  /* Camera mode button */
  #camBtn{
    position:fixed; bottom:56px; right:12px; z-index:200;
    background:rgba(0,0,0,0.72); border:1.5px solid rgba(255,255,255,0.25);
    color:#fff; font-size:12px; font-weight:700; letter-spacing:0.5px;
    padding:8px 14px; border-radius:20px; cursor:pointer;
    backdrop-filter:blur(6px); transition:background 0.2s, transform 0.1s;
    font-family:'Segoe UI',sans-serif; user-select:none;
  }
  #camBtn:active{ transform:scale(0.93); background:rgba(255,255,255,0.15); }
</style>
</head>
<body>
<!-- LOADING SCREEN -->
<div id="loading-screen" style="display:none!important">
  <div id="loading-logo">DRAG<span>RACE</span></div>
  <div id="loading-subtitle">🏆 Tropical Edition</div>
  <div id="loading-bar-wrap">
    <div id="loading-bar"></div>
  </div>
  <div id="loading-status">Initializing...</div>
  <div id="loading-dots">
    <div class="load-dot"></div>
    <div class="load-dot"></div>
    <div class="load-dot"></div>
  </div>
</div>

<div id="canvas-container">
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="speed-overlay"></div>
  <div id="lens-flare"></div>
  <div id="hud">
    <div id="p1-hud">
      <div class="car-name">🏍 Player 1</div>
      <div class="speed-gauge-wrap">
        <span class="speed-num" id="p1-speed">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="rpm-label">RPM</div>
      <div class="rpm-bar-bg"><div class="rpm-fill" id="p1-rpm" style="width:0%"></div></div>
      <div class="gear-row">
        <span class="gear-label">GEAR</span>
        <span class="gear-num" id="p1-gear">N</span>
      </div>
    </div>
    <div id="timer-hud">
      <div class="timer-label">⏱ Race Time</div>
      <div class="timer-value" id="timer-val">0.000</div>
    </div>
    <div id="p2-hud">
      <div class="car-name">Player 2 🏍</div>
      <div class="speed-gauge-wrap" style="flex-direction:row-reverse;width:100%;">
        <span class="speed-num" id="p2-speed">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="rpm-label" style="text-align:right">RPM</div>
      <div class="rpm-bar-bg"><div class="rpm-fill" id="p2-rpm" style="width:0%;background:linear-gradient(90deg,#00CFFF,#0044FF,#AA00FF);"></div></div>
      <div class="gear-row" style="flex-direction:row-reverse;">
        <span class="gear-label">GEAR</span>
        <span class="gear-num" id="p2-gear">N</span>
      </div>
    </div>
    <div class="prog-wrap" id="p1-prog-wrap">
      <div class="prog-label">P1 Progress</div>
      <div class="prog-bg"><div id="p1-fill"></div></div>
    </div>
    <div class="prog-wrap" id="p2-prog-wrap">
      <div class="prog-label" style="text-align:right">P2 Progress</div>
      <div class="prog-bg"><div id="p2-fill"></div></div>
    </div>
    <div id="countdown"></div>
    <div id="winner-banner">
      <div id="winner-title">🏆 WINNER</div>
      <div id="winner-name">Player 1</div>
      <div id="winner-time">Time: 0.000s</div>
      <div id="winner-margin">Won by 0.000s</div>
      <button id="race-again-btn">🔁 Race Again</button>
    </div>
    <div id="launch-hint" style="display:none">Press SPACE or tap to launch</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
(function(){
'use strict';

// ─── IMAGE URLs ──────────────────────────────────────────────
const URL_SKY      = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/0283923f-92e7-4fa1-9174-3b65fb3787eb.jpg';
const URL_MOUNTAIN = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/dbae7089-ceee-43a4-95ff-6821267cfe5b.jpg';
const URL_GRASS    = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/2b70430a-30b5-46e2-9fc7-ce262e388893.jpg';
const URL_PALM     = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/3928c54e-b10d-4d5e-8672-fc0062585db0.png';
const URL_BUSH     = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/b260a10e-10db-43ca-854c-48b74fb24ef8.png';
const URL_BUSH2    = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/25cfa60d-c358-4d87-b386-d9379515fc09.png';
const URL_FOREST   = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/5a90fb8e-890f-422f-811d-e00c619311eb.png';
const URL_SIDE_BG  = 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/8d9d07e8-6107-4cfd-ba07-1202d0e2481b.png';

// ─── RENDERER ────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance', logarithmicDepthBuffer:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.LinearToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = false;

// ─── SCENE ───────────────────────────────────────────────────
const scene = new THREE.Scene();
// FIX #5: Slightly clearer sky color 0x7BBCE0 → 0x6FB2D9
scene.background = new THREE.Color(0x6FB2D9);

// ─── CAMERA ──────────────────────────────────────────────────
// FIX #4: FOV 52 → 48 (more cinematic), position closer & lower
const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 4.0, -13);
camera.lookAt(0, 1.5, 0);
window.addEventListener('resize', ()=>{
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// ═══════════════════════════════════════════════════════════════
//  LOADING MANAGER
// ═══════════════════════════════════════════════════════════════
let _loadTotal = 0, _loadDone = 0;
const _loadItems = {};

function setLoadStatus(msg){ document.getElementById('loading-status').textContent = msg; }
function setLoadBar(pct){ document.getElementById('loading-bar').style.width = Math.min(pct,100)+'%'; }

function trackLoad(key){
  if(_loadItems[key]) return;
  _loadItems[key] = false;
  _loadTotal++;
  setLoadBar((_loadDone/_loadTotal)*90);
}
function loadProgress(key){
  if(_loadItems[key]) return;
  _loadItems[key] = true;
  _loadDone++;
  const pct = (_loadDone / _loadTotal) * 90;
  setLoadBar(pct);
  const labels = { sky:'Sky loaded', grass:'Terrain loaded', palm:'Trees loaded',
    bush:'Vegetation loaded', forest:'Forest loaded', mountain:'Mountains loaded',
    model:'Bikes loaded' };
  setLoadStatus(labels[key] || 'Loading assets...');
}
function checkAllLoaded(){
  setLoadBar(100);
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('launch-hint').style.display = 'block';
}

// Patch TL.load to auto-track
const TL = new THREE.TextureLoader();
const _tlLoad = TL.load.bind(TL);
TL.load = function(url, onLoad, onProgress, onError){
  trackLoad(url);
  return _tlLoad(url, (tex)=>{ loadProgress(url); if(onLoad) onLoad(tex); }, onProgress, onError);
};

// ═══════════════════════════════════════════════════════════════
//  PROCEDURAL TEXTURE HELPERS
// ═══════════════════════════════════════════════════════════════
function fbmNoise(ctx, w, h, scale, octaves, baseAlpha){
  for(let o=0;o<octaves;o++){
    const f=scale*Math.pow(2,o), a=baseAlpha/Math.pow(2,o);
    for(let x=0;x<w;x+=Math.max(1,Math.floor(w/f))){
      for(let y=0;y<h;y+=Math.max(1,Math.floor(h/f))){
        const v=Math.floor(Math.random()*80-40);
        const sz=Math.max(1,Math.floor(w/f));
        ctx.fillStyle=`rgba(${128+v},${128+v},${128+v},${a})`;
        ctx.fillRect(x,y,sz,sz);
      }
    }
  }
}

function makeAsphaltTexture(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#141414'; ctx.fillRect(0,0,w,h);
  fbmNoise(ctx,w,h,5,4,0.38);
  for(let i=0;i<12;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const rx=30+Math.random()*80, ry=20+Math.random()*60;
    const g2=ctx.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
    const warmR=Math.floor(35+Math.random()*20), warmG=Math.floor(30+Math.random()*15);
    g2.addColorStop(0,`rgba(${warmR},${warmG},18,0.12)`);
    g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2; ctx.ellipse(x,y,rx,ry,Math.random()*Math.PI,0,Math.PI*2);
    ctx.fill();
  }
  for(let i=0;i<10;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const rx=25+Math.random()*70, ry=18+Math.random()*50;
    const g2=ctx.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
    g2.addColorStop(0,'rgba(30,38,48,0.14)');
    g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,Math.random()*Math.PI,0,Math.PI*2); ctx.fill();
  }
  for(let i=0;i<14;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const r=8+Math.random()*25;
    const g2=ctx.createRadialGradient(x,y,0,x,y,r);
    g2.addColorStop(0,'rgba(5,5,8,0.30)');
    g2.addColorStop(0.5,'rgba(10,8,15,0.15)');
    g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  for(let i=0;i<8;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const r=12+Math.random()*30;
    const g2=ctx.createRadialGradient(x,y,0,x,y,r);
    g2.addColorStop(0,'rgba(60,65,70,0.08)');
    g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  for(let i=0;i<1300;i++){
    const x=Math.random()*w, y=Math.random()*h, r=0.5+Math.random()*2.5;
    const v=Math.floor(48+Math.random()*50);
    ctx.beginPath(); ctx.ellipse(x,y,r,r*0.65,Math.random()*Math.PI,0,Math.PI*2);
    ctx.fillStyle=`rgb(${v},${v},${v})`; ctx.fill();
  }
  for(let i=0;i<8;i++){
    const xm=w*0.28+Math.random()*(w*0.44);
    const ym=Math.random()*h;
    const len=40+Math.random()*120;
    ctx.strokeStyle=`rgba(6,6,6,${0.18+Math.random()*0.18})`; ctx.lineWidth=3+Math.random()*7;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(xm+(Math.random()-0.5)*3,ym);
    ctx.lineTo(xm+(Math.random()-0.5)*5,ym+len); ctx.stroke();
  }
  for(let i=0;i<24;i++){
    const xm=40+Math.random()*(w-80);
    const ym=Math.random()*h;
    const len=30+Math.random()*100;
    const ang=(Math.random()-0.5)*0.6;
    ctx.strokeStyle=`rgba(6,6,6,${0.18+Math.random()*0.20})`; ctx.lineWidth=0.8+Math.random()*1.8;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(xm,ym);
    let cx2=xm, cy2=ym;
    const steps=3+Math.floor(Math.random()*4);
    for(let s=0;s<steps;s++){
      cx2+=(Math.random()-0.5)*14+Math.sin(ang)*12;
      cy2+=len/steps*(0.7+Math.random()*0.6);
      ctx.lineTo(cx2,cy2);
    }
    ctx.stroke();
    if(Math.random()<0.5){
      const bx=xm+(Math.random()-0.5)*20, by=ym+len*0.3;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.lineTo(bx+(Math.random()-0.5)*22,by+20+Math.random()*30);
      ctx.strokeStyle=`rgba(6,6,6,${0.10+Math.random()*0.12})`; ctx.lineWidth=0.6+Math.random()*1.0;
      ctx.stroke();
    }
  }
  for(let i=0;i<18;i++){
    const x=20+Math.random()*(w-40), y=Math.random()*h;
    const r=1.5+Math.random()*5;
    const g2=ctx.createRadialGradient(x,y,0,x,y,r);
    g2.addColorStop(0,'rgba(4,4,4,0.55)');
    g2.addColorStop(0.6,'rgba(10,10,10,0.25)');
    g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  ctx.strokeStyle='rgba(255,255,255,0.70)'; ctx.lineWidth=9+Math.random()*2;
  ctx.setLineDash([88,72]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.setLineDash([]);
  [18, w-18].forEach(x=>{
    ctx.strokeStyle='rgba(255,255,255,0.70)';
    ctx.lineWidth=6+Math.random()*2;
    ctx.beginPath(); ctx.moveTo(x+(Math.random()-0.5)*1.5,0); ctx.lineTo(x+(Math.random()-0.5)*1.5,h); ctx.stroke();

function setupBikeModel(model){
  const wheels = [];
  const allMeshes = [];

  model.traverse(function(child){
    if(child.isMesh){
      child.castShadow = true;
      child.receiveShadow = false;
      child.frustumCulled = false;
      // Keep original model materials exactly as-is
      child.geometry.computeBoundingSphere();
      child.geometry.computeBoundingBox();
      allMeshes.push(child);
    }
  });

  // Detect wheels by name first
  const wheelPattern = /wheel|tire|tyre|rim|roue|rueda/i;
  allMeshes.forEach(function(mesh){
    if(wheelPattern.test(mesh.name)) wheels.push(mesh);
  });

  // Fallback: detect wheels by geometry aspect ratio (round = wheel-like)
  const geometricWheels = [];
  if(wheels.length === 0){
    allMeshes.forEach(function(mesh){
      const bb = new THREE.Box3().setFromObject(mesh);
      const sz = new THREE.Vector3(); bb.getSize(sz);
      const minDim = Math.min(sz.x, sz.y, sz.z);
      const maxDim = Math.max(sz.x, sz.y, sz.z);
      if(minDim < maxDim * 0.35 && maxDim > 0.2 && maxDim < 2.5){
        geometricWheels.push(mesh);
      }
    });
  }

  const detectedWheels = wheels.length > 0 ? wheels : geometricWheels;
  return { namedWheels: wheels, geometricWheels: geometricWheels, allDetected: detectedWheels };
}

/**
 * fitBikeToGround — scale model so its Z-depth ≈ TARGET_LENGTH (7 units),
 * center X/Z at 0, and snap bottom Y to 0.
 *
 * FIX #2: TARGET_LENGTH increased from 5 → 7 (bigger bikes).
 * FIX #1: Auto-orient logic replaced with a fixed inner-model flip of Math.PI
 *         so the bike faces forward (handlebars toward finish line) after the
 *         outer group's Math.PI rotation cancels out.
 *         (Old auto-detect: if(size.x > size.z) rotate Math.PI/2 — replaced below)
 */
function fitBikeToGround(innerModel){
  // Step 1: force world matrix update for all descendants
  innerModel.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(innerModel);
  let size = new THREE.Vector3();
  box.getSize(size);

  // Bike direction: outer car group has rotation.y = Math.PI
  // Inner model rotation.y = 0 → net = Math.PI → bike faces +Z (finish line)
  innerModel.rotation.y = 0;
  innerModel.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(innerModel);
  box.getSize(size);

  // If still sideways after the flip (some GLBs are truly 90° off axis),
  // apply an additional quarter-turn:
  // if(size.x > size.z * 1.5){ innerModel.rotation.y += Math.PI/2; }

  // Step 2: Scale so Z-depth (forward) = TARGET_LENGTH
  // FIX #3: Increased from 5.0 → 7.0 for bigger bikes
  const TARGET_LENGTH = 7.0;
  const currentDepth = Math.max(size.z, size.x, 0.001); // use longest axis for robust scaling
  const scaleFactor = TARGET_LENGTH / currentDepth;
  innerModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

  // Step 3: Recompute bbox after scale
  innerModel.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(innerModel);
  box.getSize(size);
  const center = new THREE.Vector3();
  box.getCenter(center);

  // Step 4: Center X and Z at 0; bottom Y at 0
  innerModel.position.x = -center.x;
  innerModel.position.z = -center.z;
  innerModel.position.y = -box.min.y;
}

function applyBikeGltf(gltf){
  const bikeModel = gltf.scene;

  // Clone for P1
  const bike1Model = bikeModel.clone(true);
  fitBikeToGround(bike1Model);
  const r1 = setupBikeModel(bike1Model);
  car1._wheels = r1.namedWheels;
  car1._allWheelMeshes = r1.allDetected;
  car1.remove(debugCube1);
  car1.add(bike1Model);
  // No procedural rider — model includes rider

  // Clone for P2
  const bike2Model = bikeModel.clone(true);
  fitBikeToGround(bike2Model);
  const r2 = setupBikeModel(bike2Model);
  car2._wheels = r2.namedWheels;
  car2._allWheelMeshes = r2.allDetected;
  car2.remove(debugCube2);
  car2.add(bike2Model);
  // No procedural rider — model includes rider

  modelsLoaded = true;
  loadProgress('model');
  dracoLoader.dispose();
  checkAllLoaded();
}

      applyBikeGltf(gltf);

    function(xhr){
      if(xhr.total > 0){
        const pct = Math.round(xhr.loaded / xhr.total * 100);
        setLoadStatus('Loading bikes... ' + pct + '%');
      }
    },
    function(err){
      setLoadStatus('Retrying from fallback...');
      gltfLoader.load(
        BIKE_URL_FALLBACK,
        function(gltf){
          applyBikeGltf(gltf);
        },
        function(xhr2){
          if(xhr2.total > 0){
            const pct2 = Math.round(xhr2.loaded / xhr2.total * 100);
            setLoadStatus('Fallback loading... ' + pct2 + '%');
          }

        function(err2){
          setLoadStatus('Model unavailable — using placeholder');
          car1.remove(debugCube1);
          car2.remove(debugCube2);
          spawnFallbackBoxes();
          modelsLoaded = true;
          loadProgress('model');
          checkAllLoaded();
        }
      );
    }
  );
}

//  PROCEDURAL RIDER — r128 compatible (no CapsuleGeometry)
// ═══════════════════════════════════════════════════════════════
function makeCapsule(rt, rb, h, col, rough=0.7, metal=0.0){
  // Capsule = cylinder + 2 hemispheres
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:metal});
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,10), mat);
  g.add(cyl);
  const top = new THREE.Mesh(new THREE.SphereGeometry(rt,10,8,0,Math.PI*2,0,Math.PI/2), mat);
  top.position.y = h/2; g.add(top);
  const bot = new THREE.Mesh(new THREE.SphereGeometry(rb,10,8,0,Math.PI*2,Math.PI/2,Math.PI/2), mat);
  bot.position.y = -h/2; g.add(bot);
  g.traverse(c=>{ if(c.isMesh) c.frustumCulled=false; });
  return g;
}

function addProceduralRider(carGroup, helmetColor){
  const suitCol  = 0x1a1a2e;
  const bootCol  = 0x0d0d0d;
  const gloveCol = 0x111111;
  const skinCol  = 0x8B5E3C;

  function smat(col, rough=0.75, metal=0.0){
    return new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:metal});
  }

  const rg = new THREE.Group();

  // ── TORSO ──
  const torso = makeCapsule(0.20, 0.22, 0.44, suitCol, 0.8);
  torso.rotation.x = -0.65;
  torso.position.set(0, 1.20, 0.10);
  rg.add(torso);

  // Chest stripe (team color)
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.09,0.02), smat(helmetColor,0.4));
  stripe.position.set(0, 1.22, -0.13);
  rg.add(stripe);

  // ── NECK ──
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.09,0.11,10), smat(skinCol,0.8));
  neck.position.set(0, 1.50, 0.00);
  rg.add(neck);

  // ── HELMET ──
  const helmetMat = new THREE.MeshStandardMaterial({color:helmetColor, roughness:0.25, metalness:0.15});
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.20, 20, 16), helmetMat);
  helmet.scale.set(1.0, 1.08, 1.12);
  helmet.position.set(0, 1.66, -0.04);
  rg.add(helmet);

  // Visor
  const visorMat = new THREE.MeshStandardMaterial({
    color:0x0a0a1a, roughness:0.02, metalness:0.9,
    transparent:true, opacity:0.80, side:THREE.FrontSide
  });
  const visor = new THREE.Mesh(new THREE.SphereGeometry(0.148,16,12,0.25,2.6,0.55,0.95), visorMat);
  visor.position.set(0, 1.62, 0.09);
  visor.scale.set(1, 0.82, 0.88);
  visor.frustumCulled = false;
  rg.add(visor);

  // Helmet chin
  const chin = new THREE.Mesh(new THREE.SphereGeometry(0.13,14,10,0,Math.PI*2,0.85,0.7), helmetMat);
  chin.position.set(0, 1.56, 0.10);
  chin.scale.set(1,0.75,1.1);
  chin.frustumCulled=false;
  rg.add(chin);

  // ── UPPER ARMS ──
  [[-1],[1]].forEach(([side])=>{
    const ua = makeCapsule(0.065,0.075, 0.26, suitCol, 0.8);
    ua.rotation.z = side * 1.05;
    ua.rotation.x = -0.45;
    ua.position.set(side*0.27, 1.26, 0.08);
    rg.add(ua);

    // Forearm
    const fa = makeCapsule(0.052,0.062, 0.22, suitCol, 0.8);
    fa.rotation.z = side * 0.45;
    fa.rotation.x = -0.95;
    fa.position.set(side*0.32, 1.04, 0.28);
    rg.add(fa);

    // Glove
    const glove = new THREE.Mesh(new THREE.SphereGeometry(0.062,10,8), smat(gloveCol,0.6));
    glove.position.set(side*0.34, 0.90, 0.42);
    glove.frustumCulled=false;
    rg.add(glove);
  });

  // ── LEGS (crouched racing) ──
  [[-1],[1]].forEach(([side])=>{
    const thigh = makeCapsule(0.095,0.105, 0.30, suitCol, 0.8);
    thigh.rotation.x = 1.25;
    thigh.position.set(side*0.14, 0.95, 0.30);
    rg.add(thigh);

    const shin = makeCapsule(0.070,0.082, 0.26, suitCol, 0.8);
    shin.rotation.x = -0.80;
    shin.position.set(side*0.14, 0.66, 0.50);
    rg.add(shin);

    // Boot
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.115,0.095,0.21), smat(bootCol,0.9));
    boot.position.set(side*0.14, 0.52, 0.60);
    boot.frustumCulled=false;
    rg.add(boot);
  });

  rg.traverse(c=>{ if(c.isMesh){ c.frustumCulled=false; c._isRiderPart=true; } });
  carGroup.add(rg);
  carGroup._rider = rg;
}

//  GAME STATE
// ═══════════════════════════════════════════════════════════════
const START_Z=5;
const gears=[0,0.082,0.165,0.265,0.385,0.525,0.665];
const gearThr=[0,14,38,70,106,148,198];
const MAX_SPD=325;

const state={phase:'idle',timer:0,raceStart:0,
  p1:{pos:START_Z,speed:0,gear:1,finished:false,finTime:0},
  p2:{pos:START_Z,speed:0,gear:1,finished:false,finTime:0}};
let p1M=1,p2M=1,cShake=0;

function getGear(spd){ for(let g=gearThr.length-1;g>=0;g--) if(spd>=gearThr[g]) return g+1; return 1; }

function resetGame(){
  state.phase='idle'; state.timer=0; state.raceStart=0;
  state.p1={pos:START_Z,speed:0,gear:1,finished:false,finTime:0};
  state.p2={pos:START_Z,speed:0,gear:1,finished:false,finTime:0};
  car1.position.set(-4.5,0,START_Z); car2.position.set(4.5,0,START_Z);
  document.getElementById('winner-banner').style.display='none';
  document.getElementById('countdown').style.display='none';
  document.getElementById('launch-hint').style.display='block';
  p1M=0.92+Math.random()*0.16; p2M=0.92+Math.random()*0.16;
  cShake=0;
  for(let i=0;i<MAX_P;i++){ pPos2[i*3]=9999; pLf[i]=0; }
  document.getElementById('timer-val').textContent = '0.000';
}

function startCountdown(){
  if(state.phase!=='idle') return;
  document.getElementById('launch-hint').style.display='none';
  state.phase='countdown';
  const el=document.getElementById('countdown');
  el.style.display='block'; el.classList.remove('go');
  for(let li=0;li<5;li++){
    const lm=scene.userData['light_'+li];
    if(lm){ lm.material.emissiveIntensity=0.2; }
  }
  let idx=0;
  const counts=['3','2','1','GO!'];
  function step(){
    if(idx<3){
      el.textContent=counts[idx];
      const lm=scene.userData['light_'+idx];
      if(lm){ lm.material.color.setHex(0xFF0000); lm.material.emissive.setHex(0xFF0000); lm.material.emissiveIntensity=3.0; }
    } else {
      el.textContent='GO!'; el.classList.add('go');
      for(let li=0;li<5;li++){
        const lm2=scene.userData['light_'+li];
        if(lm2){ lm2.material.color.setHex(0x00FF00); lm2.material.emissive.setHex(0x00FF00); lm2.material.emissiveIntensity=4.0; }
      }
    }
    el.style.animation='none'; el.offsetHeight; el.style.animation='countPulse 0.6s ease-out';
    idx++;
    if(idx<4) setTimeout(step,900);
    else{ setTimeout(()=>{ el.style.display='none'; state.phase='racing'; state.raceStart=performance.now(); cShake=0.22; },700); }
  }
  step();
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key===' '){ e.preventDefault(); if(state.phase==='idle') startCountdown(); else if(state.phase==='finished') resetGame(); }
});
document.getElementById('canvas-container').addEventListener('click',()=>{ if(state.phase==='idle') startCountdown(); else if(state.phase==='finished') resetGame(); });
document.getElementById('race-again-btn').addEventListener('click',e=>{ e.stopPropagation(); resetGame(); });

// ═══════════════════════════════════════════════════════════════
//  CAMERA — multiple modes + cinematic intro
// ═══════════════════════════════════════════════════════════════
let camMode = 0; // 0=chase, 1=top, 2=side, 3=low-front
const CAM_MODES = ['🎥 Chase', '🔼 Top', '↔️ Side', '🏁 Front'];
let cinematicTimer = 4.0; // seconds of cinematic intro
let cinematicDone  = false;

function updateCamera(dt){
  const midZ = (state.p1.pos + state.p2.pos) * 0.5;
  const sh  = cShake * Math.sin(Date.now()*0.13) * 0.09;
  const shY = cShake * Math.abs(Math.sin(Date.now()*0.08)) * 0.04;

  // ── CINEMATIC INTRO (before race starts) ──
  if(!cinematicDone){
    cinematicTimer -= dt;
    // Drone shot: high above, slowly tilting down to chase position
    const t = Math.max(0, Math.min(1, 1 - cinematicTimer/4.0));
    const eased = t < 0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; // ease in-out
    const startY = 28, endY = 2.2;
    const startZ = midZ - 2, endZ = midZ - 9;
    camera.position.x = sh * eased;
    camera.position.y = startY + (endY - startY) * eased + shY;
    camera.position.z = startZ + (endZ - startZ) * eased;
    camera.lookAt(new THREE.Vector3(0, 1.0, midZ + 6));
    if(cinematicTimer <= 0) cinematicDone = true;
    skyGroup.position.set(camera.position.x, 0, camera.position.z);
    sun.position.set(-80, 100, midZ+50);
    sun.target.position.set(0,0,midZ);
    sun.target.updateMatrixWorld();
    return;
  }

  let tX, tY, tZ, lX=0, lY=1.1, lZ;

  if(camMode === 0){
    // Chase cam — behind & low
    tX = sh; tY = 2.2 + shY; tZ = midZ - 9.0;
    lZ = midZ + 16;
  } else if(camMode === 1){
    // Top-down cam — directly above
    tX = 0; tY = 22; tZ = midZ;
    lX = 0; lY = 0; lZ = midZ + 0.01;
  } else if(camMode === 2){
    // Side cam — perpendicular view
    tX = 18; tY = 3.5; tZ = midZ;
    lX = 0; lY = 2; lZ = midZ;
  } else {
    // Low front cam — facing the bikes
    tX = sh * 0.5; tY = 1.4 + shY * 0.5; tZ = midZ + 14;
    lZ = midZ - 5;
  }

  const lerpSpd = camMode === 1 ? 0.06 : 0.13;
  camera.position.x += (tX - camera.position.x) * lerpSpd;
  camera.position.y += (tY - camera.position.y) * (lerpSpd * 0.8);
  camera.position.z += (tZ - camera.position.z) * lerpSpd;
  camera.lookAt(new THREE.Vector3(lX, lY, lZ));

  if(cShake > 0) cShake = Math.max(0, cShake - dt * 0.8);
  skyGroup.position.set(camera.position.x, 0, camera.position.z);
  sun.position.set(-80, 100, midZ+50);
  sun.target.position.set(0,0,midZ);
  sun.target.updateMatrixWorld();
}

// ═══════════════════════════════════════════════════════════════
//  PHYSICS
// ═══════════════════════════════════════════════════════════════
function updatePhysics(dt){
  if(state.phase!=='racing') return;
  const elapsed=(performance.now()-state.raceStart)/1000;
  state.timer=elapsed;
  function updateCar(cs,mult){
    if(cs.finished) return;
    cs.gear=getGear(cs.speed);
    const ga=gears[Math.min(cs.gear,gears.length-1)];
    const ar=cs.speed/MAX_SPD;
    const vr=1+(Math.sin(elapsed*3.9+mult*12)*0.022);
    cs.speed=Math.min(cs.speed+(ga*(1-ar*0.78)*mult*vr)*dt*285, MAX_SPD);
    cs.pos+=cs.speed/3.6*dt;
  }
  updateCar(state.p1,p1M); updateCar(state.p2,p2M);
  car1.position.z=state.p1.pos; car2.position.z=state.p2.pos;
  const ws=[car1,car2]; const spds=[state.p1.speed,state.p2.speed];
  ws.forEach((c,ci)=>{
    const spd = spds[ci];
    const rotAmt = spd * 0.052 * dt;
    // Named wheels first
    if(c._wheels && c._wheels.length > 0){
      c._wheels.forEach(w=>{ w.rotation.x += rotAmt; });
    }
    // Geometric wheels fallback
    if(c._allWheelMeshes && c._allWheelMeshes.length > 0){
      c._allWheelMeshes.forEach(w=>{ w.rotation.x += rotAmt; });
    }
    // Nuclear fallback: if NOTHING detected, spin ALL meshes that look round
    if((!c._wheels || c._wheels.length===0) && (!c._allWheelMeshes || c._allWheelMeshes.length===0)){
      c.traverse(function(child){
        if(!child.isMesh || child._isRiderPart) return;
        const bb = child.geometry && child.geometry.boundingBox;
        if(!bb) return;
        const sx = bb.max.x - bb.min.x;
        const sy = bb.max.y - bb.min.y;
        const sz = bb.max.z - bb.min.z;
        const thin = Math.min(sx,sy,sz) < Math.max(sx,sy,sz)*0.4;
        if(thin) child.rotation.x += rotAmt;
      });
    }
  });
  car1.position.y=Math.max(0,-state.p1.speed/MAX_SPD*0.04);
  car2.position.y=Math.max(0,-state.p2.speed/MAX_SPD*0.04);

  // Animate rider lean — more aggressive lean at high speed
  [car1, car2].forEach((car, ci)=>{
    if(car._rider){
      const spd = spds[ci];
      const leanX = -0.18 * (spd / MAX_SPD); // lean forward with speed
      car._rider.rotation.x = leanX;
    }
  });
  const now=performance.now();
  if(!state.p1.finished&&state.p1.pos>=FINISH_Z){ state.p1.finished=true; state.p1.finTime=(now-state.raceStart)/1000; }
  if(!state.p2.finished&&state.p2.pos>=FINISH_Z){ state.p2.finished=true; state.p2.finTime=(now-state.raceStart)/1000; }
  if(state.p1.finished&&state.p2.finished&&state.phase==='racing'){
    state.phase='finished';
    const w=state.p1.finTime<=state.p2.finTime?'Player 1':'Player 2';
    showWinner(w,Math.min(state.p1.finTime,state.p2.finTime),Math.abs(state.p1.finTime-state.p2.finTime));
  } else if((state.p1.finished||state.p2.finished)&&state.phase==='racing'){
    const leader=state.p1.finished?state.p1:state.p2;
    const other=state.p1.finished?state.p2:state.p1;
    if(leader.pos>FINISH_Z+25&&!other.finished){
      other.finished=true; other.finTime=(now-state.raceStart)/1000+0.06+Math.random()*0.28;
      state.phase='finished';
      const wn=state.p1.finTime<=state.p2.finTime?'Player 1':'Player 2';
      showWinner(wn,Math.min(state.p1.finTime,state.p2.finTime),Math.abs(state.p1.finTime-state.p2.finTime));
    }
  }
}

function showWinner(n,t,m){
  document.getElementById('winner-name').textContent=n;
  document.getElementById('winner-time').textContent=`Time: ${t.toFixed(3)}s`;
  document.getElementById('winner-margin').textContent=m<0.001?'Photo Finish!':`Won by ${m.toFixed(3)}s`;
  document.getElementById('winner-banner').style.display='block';
}

// ═══════════════════════════════════════════════════════════════
function spawnCarParticles(){
  if(state.phase!=='racing') return;
  const elapsed=(performance.now()-state.raceStart)/1000;
  [[car1,state.p1],[car2,state.p2]].forEach(([c,s])=>{
    if(s.finished) return;
    const cx=c.position.x, cy=c.position.y, cz=c.position.z;
    if(elapsed<2.8&&s.speed<90){
      for(let i=0;i<5;i++) spawnP(cx+(Math.random()-0.5)*1.9,cy+0.14,cz-1.5+(Math.random()-0.5)*0.6,(Math.random()-0.5)*0.4,0.32+Math.random()*0.45,-(0.5+Math.random()*2.2),0);
    }
    for(let e=0;e<2;e++) spawnP(cx+(e===0?-0.42:0.42),cy+0.12,cz-2.3,(Math.random()-0.5)*0.2,0.07+Math.random()*0.12,-(0.3+Math.random()*1.1),2);
    if(s.speed>35) spawnP(cx+(Math.random()-0.5)*2,cy+0.07,cz-1.9+(Math.random()-0.5)*0.8,(Math.random()-0.5)*0.3,0.04+Math.random()*0.18,-(0.2+Math.random()*0.9),1);
    if(s.speed>185&&Math.random()<0.18) spawnP(cx+(Math.random()-0.5)*1.6,cy+0.05,cz-1.6,(Math.random()-0.5)*3,0.5+Math.random()*1.6,-(Math.random()*2),3);
  });
}

function updateParticles(dt){
  for(let i=0;i<MAX_P;i++){
    if(pLf[i]<=0) continue;
    const rate=pTy[i]===0?0.55:(pTy[i]===3?3.2:1.15);
    pLf[i]-=dt*rate;
    if(pLf[i]<=0){ pPos2[i*3]=9999; pSz[i]=0; continue; }
    pPos2[i*3]+=pVx[i]*dt*4; pPos2[i*3+1]+=pVy[i]*dt*4; pPos2[i*3+2]+=pVz2[i]*dt*4;
    pVy[i]-=dt*0.75;
    pSz[i]*=0.996;
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.size.needsUpdate=true;
}

// ═══════════════════════════════════════════════════════════════

function updateHUD(){
  document.getElementById('p1-speed').textContent=Math.round(state.p1.speed);
  document.getElementById('p2-speed').textContent=Math.round(state.p2.speed);
  const r1=Math.min(state.p1.speed/MAX_SPD*100,100), r2=Math.min(state.p2.speed/MAX_SPD*100,100);
  document.getElementById('p1-rpm').style.width=r1+'%';
  document.getElementById('p2-rpm').style.width=r2+'%';
  document.getElementById('p1-rpm').style.backgroundPosition=r1>82?'100% 0':'50% 0';
  document.getElementById('p1-gear').textContent=state.phase==='racing'?state.p1.gear:'N';
  document.getElementById('p2-gear').textContent=state.phase==='racing'?state.p2.gear:'N';
  if(state.phase==='racing') document.getElementById('timer-val').textContent=state.timer.toFixed(3);
  const prog=FINISH_Z-START_Z;
  document.getElementById('p1-fill').style.width=Math.min((state.p1.pos-START_Z)/prog*100,100)+'%';
  document.getElementById('p2-fill').style.width=Math.min((state.p2.pos-START_Z)/prog*100,100)+'%';
  const avgS=(state.p1.speed+state.p2.speed)/2;
  // FIX #5: Reduce speed-overlay strength from *0.5 → *0.25
  document.getElementById('speed-overlay').style.opacity=(avgS/MAX_SPD*0.25).toFixed(2);
  const lf=document.getElementById('lens-flare');
  const fa=Math.abs(Math.sin(Date.now()*0.00045));
  if(fa>0.62&&state.phase==='racing'){ lf.style.display='block'; lf.style.left=(38+fa*18)+'%'; lf.style.top='16%'; lf.style.opacity=((fa-0.62)*1.4).toFixed(2); }
  else lf.style.display='none';
}

// ═══════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════
let lastT=0, hudFrame=0;
function animate(time){
  requestAnimationFrame(animate);
  const dt=Math.min((time-lastT)/1000,0.05); lastT=time;
  updatePhysics(dt);
  spawnCarParticles();
  updateParticles(dt);
  updateCamera(dt);
  if(hudFrame++ % 2 === 0) updateHUD();
  renderer.render(scene,camera);
}
resetGame();
requestAnimationFrame(animate);
setLoadStatus('Loading track & environment...');
setTimeout(checkAllLoaded, 500);

})();

// Inject camera button into DOM
(function(){
  const btn = document.createElement('button');
  btn.id = 'camBtn';
  btn.textContent = '🎥 Chase';
  btn.onclick = cycleCam;
  document.body.appendChild(btn);
})();
</script>
