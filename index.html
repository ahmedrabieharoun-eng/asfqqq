<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAG RACE — ULTRA PHOTOREALISTIC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Segoe UI',Arial,sans-serif; }
  #canvas-container { position:relative; width:100vw; height:100vh; }
  canvas { display:block; width:100%!important; height:100%!important; }

  #vignette {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.65) 100%);
  }
  #speed-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:6; opacity:0; transition:opacity 0.25s;
    background:radial-gradient(ellipse at center, transparent 20%, rgba(180,200,255,0.05) 100%);
  }
  #lens-flare {
    position:absolute; pointer-events:none; z-index:8;
    width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,248,200,0.55) 0%, rgba(255,210,80,0.18) 40%, transparent 70%);
    display:none; transform:translate(-50%,-50%); filter:blur(8px);
  }

  /* HUD */
  #hud { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:15; }
  #p1-hud {
    position:absolute; top:16px; left:16px;
    background:linear-gradient(135deg,rgba(0,0,0,0.75) 0%,rgba(20,12,0,0.7) 100%);
    border:1px solid rgba(255,180,0,0.5); border-radius:14px;
    padding:14px 20px; min-width:195px;
    backdrop-filter:blur(12px);
    box-shadow:0 4px 28px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,200,0,0.14);
  }
  #p2-hud {
    position:absolute; top:16px; right:16px;
    background:linear-gradient(135deg,rgba(0,0,0,0.75) 0%,rgba(0,12,32,0.7) 100%);
    border:1px solid rgba(0,160,255,0.5); border-radius:14px;
    padding:14px 20px; min-width:195px; text-align:right;
    backdrop-filter:blur(12px);
    box-shadow:0 4px 28px rgba(0,0,0,0.55),inset 0 1px 0 rgba(0,180,255,0.14);
  }
  .car-name { font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; }
  #p1-hud .car-name { color:#FFB800; }
  #p2-hud .car-name { color:#00CFFF; }
  .speed-gauge-wrap { display:inline-flex; align-items:center; margin-bottom:6px; }
  .speed-num { font-size:40px; font-weight:900; color:#fff; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 0 22px rgba(255,255,255,0.3); }
  .speed-unit { font-size:11px; color:rgba(255,255,255,0.45); margin-left:4px; align-self:flex-end; margin-bottom:4px; }
  .rpm-label { font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:2px; text-transform:uppercase; margin-bottom:3px; }
  .rpm-bar-bg { width:100%; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
  .rpm-fill { height:100%; border-radius:3px; transition:width 0.06s linear; background:linear-gradient(90deg,#00FF88,#FFB800,#FF2200); background-size:200% 100%; }
  .gear-row { display:flex; align-items:baseline; margin-top:7px; gap:8px; }
  .gear-label { font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:2px; text-transform:uppercase; }
  .gear-num { font-size:24px; font-weight:900; color:#FF8C00; line-height:1; }
  #p2-hud .gear-row { flex-direction:row-reverse; }
  #p2-hud .gear-num { color:#00CFFF; }
  #timer-hud {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.68); border:1px solid rgba(255,255,255,0.14);
    border-radius:12px; padding:10px 28px; text-align:center;
    backdrop-filter:blur(12px); box-shadow:0 4px 22px rgba(0,0,0,0.5);
  }
  .timer-label { font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:3px; text-transform:uppercase; margin-bottom:3px; }
  .timer-value { font-size:28px; font-weight:900; color:#fff; font-variant-numeric:tabular-nums; letter-spacing:2px; }
  .prog-wrap { position:absolute; bottom:28px; width:38%; }
  #p1-prog-wrap { left:5%; }
  #p2-prog-wrap { right:5%; }
  .prog-label { font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
  #p2-prog-wrap .prog-label { text-align:right; }
  .prog-bg { width:100%; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
  #p1-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,#FFB800,#FF4400); width:0%; transition:width 0.05s; }
  #p2-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,#0088FF,#AA00FF); width:0%; transition:width 0.05s; }
  #countdown {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(1);
    font-size:160px; font-weight:900; color:#fff;
    text-shadow:0 0 40px rgba(255,60,60,0.95),0 0 80px rgba(255,60,60,0.5),5px 5px 0 #000;
    letter-spacing:4px; pointer-events:none; display:none; text-align:center; white-space:nowrap;
    animation:countPulse 0.6s ease-out;
  }
  #countdown.go { color:#00FF88; text-shadow:0 0 40px rgba(0,255,120,0.95),0 0 80px rgba(0,255,120,0.5),5px 5px 0 #003300; font-size:180px; }
  @keyframes countPulse {
    0%{transform:translate(-50%,-50%) scale(1.6);opacity:0;}
    40%{opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  }
  #winner-banner {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9); border:2px solid #FFB800; border-radius:20px;
    padding:40px 70px; text-align:center; display:none; pointer-events:all; z-index:25;
    backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:0 0 80px rgba(255,180,0,0.4),0 20px 60px rgba(0,0,0,0.7);
  }
  #winner-title { font-size:12px; color:rgba(255,255,255,0.45); letter-spacing:5px; text-transform:uppercase; margin-bottom:10px; }
  #winner-name { font-size:56px; font-weight:900; color:#FFB800; text-shadow:0 0 30px rgba(255,180,0,0.7); margin-bottom:10px; }
  #winner-time { font-size:18px; color:rgba(255,255,255,0.7); margin-bottom:5px; }
  #winner-margin { font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:32px; }
  #race-again-btn {
    background:linear-gradient(135deg,#FFB800,#FF5500); color:#000; border:none; border-radius:50px;
    padding:15px 50px; font-size:16px; font-weight:800; cursor:pointer;
    text-transform:uppercase; letter-spacing:3px; transition:transform 0.12s,box-shadow 0.12s;
    pointer-events:all; box-shadow:0 4px 20px rgba(255,100,0,0.4);
  }
  #race-again-btn:hover { transform:scale(1.06); box-shadow:0 8px 36px rgba(255,140,0,0.6); }
  #launch-hint {
    position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
    font-size:12px; color:rgba(255,255,255,0.55); letter-spacing:3px;
    text-transform:uppercase; pointer-events:none; animation:blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
</style>
</head>
<body>
<div id="canvas-container">
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="speed-overlay"></div>
  <div id="lens-flare"></div>
  <div id="hud">
    <div id="p1-hud">
      <div class="car-name">🏎 Player 1</div>
      <div class="speed-gauge-wrap">
        <span class="speed-num" id="p1-speed">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="rpm-label">RPM</div>
      <div class="rpm-bar-bg"><div class="rpm-fill" id="p1-rpm" style="width:0%"></div></div>
      <div class="gear-row">
        <span class="gear-label">GEAR</span>
        <span class="gear-num" id="p1-gear">N</span>
      </div>
    </div>
    <div id="timer-hud">
      <div class="timer-label">⏱ Race Time</div>
      <div class="timer-value" id="timer-val">0.000</div>
    </div>
    <div id="p2-hud">
      <div class="car-name">Player 2 🏎</div>
      <div class="speed-gauge-wrap" style="flex-direction:row-reverse;width:100%;">
        <span class="speed-num" id="p2-speed">0</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="rpm-label" style="text-align:right">RPM</div>
      <div class="rpm-bar-bg"><div class="rpm-fill" id="p2-rpm" style="width:0%;background:linear-gradient(90deg,#00CFFF,#0044FF,#AA00FF);"></div></div>
      <div class="gear-row" style="flex-direction:row-reverse;">
        <span class="gear-label">GEAR</span>
        <span class="gear-num" id="p2-gear">N</span>
      </div>
    </div>
    <div class="prog-wrap" id="p1-prog-wrap">
      <div class="prog-label">P1 Progress</div>
      <div class="prog-bg"><div id="p1-fill"></div></div>
    </div>
    <div class="prog-wrap" id="p2-prog-wrap">
      <div class="prog-label" style="text-align:right">P2 Progress</div>
      <div class="prog-bg"><div id="p2-fill"></div></div>
    </div>
    <div id="countdown"></div>
    <div id="winner-banner">
      <div id="winner-title">🏆 WINNER</div>
      <div id="winner-name">Player 1</div>
      <div id="winner-time">Time: 0.000s</div>
      <div id="winner-margin">Won by 0.000s</div>
      <button id="race-again-btn">🔁 Race Again</button>
    </div>
    <div id="launch-hint" style="display:none">Press SPACE or tap to launch</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script>
(function(){
'use strict';

// ─── RENDERER ────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance', logarithmicDepthBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;

// ─── SCENE ───────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8ED8F0, 0.003);

// ─── CAMERA ──────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 2500);
camera.position.set(0, 5.5, -18);
camera.lookAt(0, 1.5, 0);
window.addEventListener('resize', ()=>{
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// ═══════════════════════════════════════════════════════════════
//  PROCEDURAL TEXTURE HELPERS
// ═══════════════════════════════════════════════════════════════
function fbmNoise(ctx, w, h, scale, octaves, baseAlpha){
  for(let o=0;o<octaves;o++){
    const f=scale*Math.pow(2,o), a=baseAlpha/Math.pow(2,o);
    for(let x=0;x<w;x+=Math.max(1,Math.floor(w/f))){
      for(let y=0;y<h;y+=Math.max(1,Math.floor(h/f))){
        const v=Math.floor(Math.random()*80-40);
        const sz=Math.max(1,Math.floor(w/f));
        ctx.fillStyle=`rgba(${128+v},${128+v},${128+v},${a})`;
        ctx.fillRect(x,y,sz,sz);
      }
    }
  }
}

function makeAsphaltTexture(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#1e1e1e'; ctx.fillRect(0,0,w,h);
  fbmNoise(ctx,w,h,5,4,0.35);
  for(let i=0;i<8;i++){
    const x=Math.random()*w, y=Math.random()*h;
    const r=20+Math.random()*40;
    const g2=ctx.createRadialGradient(x,y,0,x,y,r);
    g2.addColorStop(0,'rgba(50,55,65,0.10)'); g2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g2; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  for(let i=0;i<600;i++){
    const x=Math.random()*w, y=Math.random()*h, r=0.8+Math.random()*2.2;
    const v=Math.floor(55+Math.random()*35);
    ctx.beginPath(); ctx.ellipse(x,y,r,r*0.7,Math.random()*Math.PI,0,Math.PI*2);
    ctx.fillStyle=`rgb(${v},${v},${v})`; ctx.fill();
  }
  for(let i=0;i<4;i++){
    const xm=60+Math.random()*(w-120);
    const ym=Math.random()*h;
    const len=80+Math.random()*150;
    ctx.strokeStyle='rgba(8,8,8,0.25)'; ctx.lineWidth=8+Math.random()*6;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(xm,ym); ctx.lineTo(xm+(Math.random()-0.5)*4,ym+len); ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=10;
  ctx.setLineDash([90,70]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,0.88)'; ctx.lineWidth=7;
  [18,w-18].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); });

  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(2,45);
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeAsphaltNormal(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='rgb(128,128,255)'; ctx.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=3){
    for(let y=0;y<h;y+=3){
      const nx=Math.floor(128+(Math.random()-0.5)*40);
      const ny=Math.floor(128+(Math.random()-0.5)*40);
      ctx.fillStyle=`rgb(${nx},${ny},255)`; ctx.fillRect(x,y,3,3);
    }
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(6,90);
  return tex;
}

function makeGrassTexture(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#2eaa18'; ctx.fillRect(0,0,w,h);
  fbmNoise(ctx,w,h,4,4,0.25);
  for(let i=0;i<9000;i++){
    const x=Math.random()*w, y=Math.random()*h, r=0.8+Math.random()*2.5;
    const g2=Math.floor(130+Math.random()*60), rb=Math.floor(20+Math.random()*30);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=`rgb(${rb},${g2},${rb-8})`; ctx.fill();
  }
  for(let i=0;i<3;i++){
    const x=Math.random()*w, y=Math.random()*h, r=10+Math.random()*20;
    const dg=ctx.createRadialGradient(x,y,0,x,y,r);
    dg.addColorStop(0,'rgba(60,100,20,0.3)'); dg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=dg; ctx.fillRect(x-r,y-r,r*2,r*2);
  }
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(10,70);
  return tex;
}

// ═══════════════════════════════════════════════════════════════
//  LIGHTING — lower sun angle for dramatic long shadows
// ═══════════════════════════════════════════════════════════════
const hemi = new THREE.HemisphereLight(0x87CEEB, 0x4CAF50, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFFFF5, 3.2);
sun.position.set(80, 60, -120); // lower sun = longer shadows
sun.castShadow = true;
sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 600;
sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.025;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0xC8E8FF, 0.55);
fillLight.position.set(-60, 60, 80);
scene.add(fillLight);

const groundBounce = new THREE.DirectionalLight(0x88DD44, 0.25);
groundBounce.position.set(0,-20,0);
scene.add(groundBounce);

// ═══════════════════════════════════════════════════════════════
//  SKY DOME
// ═══════════════════════════════════════════════════════════════
(function buildSky(){
  const skyGeo = new THREE.SphereGeometry(1200, 48, 24);
  const skyC = document.createElement('canvas'); skyC.width=4; skyC.height=1024;
  const sCtx = skyC.getContext('2d');
  const sg = sCtx.createLinearGradient(0,0,0,1024);
  sg.addColorStop(0,   '#1565C0');
  sg.addColorStop(0.15,'#1976D2');
  sg.addColorStop(0.35,'#2196F3');
  sg.addColorStop(0.55,'#42A5F5');
  sg.addColorStop(0.72,'#64B5F6');
  sg.addColorStop(0.85,'#90CAF9');
  sg.addColorStop(0.94,'#B3E5FC');
  sg.addColorStop(1,   '#C8EEF8');
  sCtx.fillStyle=sg; sCtx.fillRect(0,0,4,1024);
  const dayGlow = sCtx.createRadialGradient(2,Math.floor(1024*0.12),0,2,Math.floor(1024*0.12),200);
  dayGlow.addColorStop(0,'rgba(255,255,255,0.35)');
  dayGlow.addColorStop(0.3,'rgba(200,230,255,0.12)');
  dayGlow.addColorStop(1,'rgba(0,0,0,0)');
  sCtx.fillStyle=dayGlow; sCtx.fillRect(0,0,4,400);

  const skyTex = new THREE.CanvasTexture(skyC);

  const cloudC = document.createElement('canvas'); cloudC.width=2048; cloudC.height=512;
  const cCtx = cloudC.getContext('2d');
  for(let i=0;i<45;i++){
    const cx=Math.random()*2048, cy=40+Math.random()*220, rx=50+Math.random()*140, ry=18+Math.random()*38;
    const cg=cCtx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
    cg.addColorStop(0,'rgba(255,255,255,0.82)');
    cg.addColorStop(0.3,'rgba(245,248,255,0.55)');
    cg.addColorStop(0.6,'rgba(230,240,255,0.22)');
    cg.addColorStop(1,'rgba(0,0,0,0)');
    cCtx.fillStyle=cg; cCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); cCtx.fill();
    for(let b=0;b<4;b++){
      const bx=cx+(Math.random()-0.5)*rx*0.8, by=cy-ry*0.3-Math.random()*ry*0.5;
      const br=ry*0.5+Math.random()*ry*0.4;
      const bg=cCtx.createRadialGradient(bx,by,0,bx,by,br);
      bg.addColorStop(0,'rgba(255,255,255,0.65)');
      bg.addColorStop(1,'rgba(0,0,0,0)');
      cCtx.fillStyle=bg; cCtx.ellipse(bx,by,br*1.2,br,0,0,Math.PI*2); cCtx.fill();
    }
  }
  const cloudTex = new THREE.CanvasTexture(cloudC);
  cloudTex.wrapS=THREE.RepeatWrapping; cloudTex.repeat.set(2,1);
  const skyMat = new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide });
  scene.add(new THREE.Mesh(skyGeo, skyMat));
  const cPlaneGeo = new THREE.PlaneGeometry(2400, 600, 1, 1);
  const cPlaneMat = new THREE.MeshBasicMaterial({ map:cloudTex, transparent:true, opacity:0.72, depthWrite:false, side:THREE.DoubleSide });
  const cloudMesh = new THREE.Mesh(cPlaneGeo, cPlaneMat);
  cloudMesh.rotation.x = -Math.PI/2; cloudMesh.position.set(0, 320, 400);
  scene.add(cloudMesh);
  scene.userData.cloudMesh = cloudMesh;
  scene.environment = skyTex;
})();

// ═══════════════════════════════════════════════════════════════
//  TRACK
// ═══════════════════════════════════════════════════════════════
const TRACK_LENGTH = 880;
const TRACK_WIDTH  = 24;
const asphaltTex   = makeAsphaltTexture(1024,1024);
const normalTex    = makeAsphaltNormal(512,512);
const grassTex     = makeGrassTexture(512,512);

const roadGeo = new THREE.PlaneGeometry(TRACK_WIDTH, TRACK_LENGTH, 8, 80);
const rPos = roadGeo.attributes.position;
for(let i=0;i<rPos.count;i++){
  const x = rPos.getX(i);
  rPos.setY(i, rPos.getY(i) - Math.abs(x/TRACK_WIDTH)*0.04);
}
roadGeo.computeVertexNormals();
const roadMat = new THREE.MeshStandardMaterial({
  map:asphaltTex, normalMap:normalTex,
  normalScale:new THREE.Vector2(0.45,0.45),
  roughness:0.80, metalness:0.04, envMapIntensity:0.35
});
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x=-Math.PI/2; road.position.set(0,0,TRACK_LENGTH/2-10); road.receiveShadow=true;
scene.add(road);

const gGeo = new THREE.PlaneGeometry(280, TRACK_LENGTH+100);

(function buildMountains(){
  const ranges=[
    {dist:920, w:2000, h:260, color:new THREE.Color(0.08,0.28,0.08), opacity:0.95, ySeg:28, xOffset:0},
    {dist:840, w:1700, h:240, color:new THREE.Color(0.10,0.33,0.10), opacity:0.90, ySeg:26, xOffset:0},
    {dist:760, w:1500, h:200, color:new THREE.Color(0.12,0.38,0.12), opacity:0.88, ySeg:22, xOffset:0},
  ];
  ranges.forEach((r,ri)=>{
    const geo=new THREE.PlaneGeometry(r.w,r.h,r.ySeg*3,r.ySeg);
    const pos=geo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i), y=pos.getY(i);
      if(y>-r.h/2+20){
        const xNorm=x/r.w;
        const valleyDepth=Math.abs(xNorm)*2.2;
        const n=Math.sin(x*0.004+ri)*45+Math.sin(x*0.012+ri*1.7)*30+Math.sin(x*0.028+ri)*15+Math.sin(x*0.06)*8;
        const topness=(y+r.h/2)/r.h;
        const mountainShape=valleyDepth*topness;
        pos.setY(i, y + n*topness*1.2 + mountainShape*r.h*0.35);
      }
    }
    geo.computeVertexNormals();
    const colors=[];
    for(let i=0;i<pos.count;i++){
      const y=pos.getY(i);
      const shade=0.85+Math.random()*0.3;
      const darkFactor=Math.max(0, (y-r.h*0.1)/(r.h*0.5));
      const gr=r.color.r*shade + darkFactor*0.04;
      const gg=r.color.g*shade + darkFactor*0.06;
      const gb=r.color.b*shade + darkFactor*0.03;
      colors.push(gr, gg, gb);
    }
    geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(colors),3));
    const mat=new THREE.MeshStandardMaterial({
      vertexColors:true, roughness:0.94, metalness:0,
      transparent:true, opacity:r.opacity, fog:true
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(0, 65+ri*15, r.dist-ri*80);
    scene.add(mesh);
  });
})();

function setupCarModel(model, paintColor){
  // Body paint
  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: paintColor,
    metalness: 0.9,
    roughness: 0.5,
    clearcoat: 1.0,
    clearcoatRoughness: 0.03,
    envMapIntensity: 1.6
  });

  // Details/trim
  const detailsMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    metalness: 1.0,
    roughness: 0.5
  });

  // Glass
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0.25,
    roughness: 0,
    transmission: 1.0
  });

  const wheels = [];

  model.traverse(function(child){
    if(child.isMesh){
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });

  // Set materials by name
  const body = model.getObjectByName('body');
  if(body) body.material = bodyMat;

  const trim = model.getObjectByName('trim');
  if(trim) trim.material = detailsMat;

  const glass = model.getObjectByName('glass');
  if(glass) glass.material = glassMat;

  // Rims
  ['rim_fl','rim_fr','rim_rl','rim_rr'].forEach(name => {
    const rim = model.getObjectByName(name);
    if(rim) rim.material = detailsMat;
  });

  // Wheels (for spinning)
  ['wheel_fl','wheel_fr','wheel_rl','wheel_rr'].forEach(name => {
    const w = model.getObjectByName(name);
    if(w) wheels.push(w);
  });

  return wheels;
}

    // Car 1 - Gold
    const car1Model = carModel.clone();
    car1._wheels = setupCarModel(car1Model, 0xFFCC00);
    car1.add(car1Model);

    // Car 2 - Blue
    const car2Model = carModel.clone();
    car2._wheels = setupCarModel(car2Model, 0x1E88E5);
    car2.add(car2Model);

    modelsLoaded = true;
    document.getElementById('timer-val').textContent = '0.000';

    // Cleanup
    dracoLoader.dispose();
  },
  function(xhr){
    if(xhr.total > 0){
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      document.getElementById('timer-val').textContent = 'Loading ' + pct + '%';
    }
  },
  function(error){
    console.error('Model load failed:', error);
    document.getElementById('timer-val').textContent = 'Load Error';
  }
);

// ═══════════════════════════════════════════════════════════════
//  PARTICLE SYSTEM — MAX_P 400
// ═══════════════════════════════════════════════════════════════
const MAX_P=400;
const pGeo=new THREE.BufferGeometry();
const pPos2=new Float32Array(MAX_P*3);
const pSz=new Float32Array(MAX_P);
const pLf=new Float32Array(MAX_P);
const pVx=new Float32Array(MAX_P), pVy=new Float32Array(MAX_P), pVz2=new Float32Array(MAX_P);
const pTy=new Uint8Array(MAX_P);
for(let i=0;i<MAX_P;i++){ pPos2[i*3]=9999; pPos2[i*3+1]=9999; pPos2[i*3+2]=9999; pLf[i]=0; pSz[i]=0; }
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos2,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(pSz,1));
const pC=document.createElement('canvas'); pC.width=64; pC.height=64;
const pCx=pC.getContext('2d');
const pG=pCx.createRadialGradient(32,32,0,32,32,32);
pG.addColorStop(0,'rgba(255,255,255,1)'); pG.addColorStop(0.5,'rgba(255,255,255,0.4)'); pG.addColorStop(1,'rgba(255,255,255,0)');
pCx.fillStyle=pG; pCx.fillRect(0,0,64,64);
const particleMat=new THREE.PointsMaterial({map:new THREE.CanvasTexture(pC),size:1.4,transparent:true,opacity:0.55,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
const particles=new THREE.Points(pGeo,particleMat);
scene.add(particles);
let pIdx2=0;
function spawnP(x,y,z,vx,vy,vz,type){
  const i=pIdx2%MAX_P; pIdx2++;
  pPos2[i*3]=x; pPos2[i*3+1]=y; pPos2[i*3+2]=z;
  pLf[i]=1.0; pSz[i]=type===3?0.3:(type===0?2.5:1.1);
  pVx[i]=vx+(Math.random()-0.5)*0.5; pVy[i]=vy+Math.random()*0.25; pVz2[i]=vz+(Math.random()-0.5)*0.35;
  pTy[i]=type;
}

// ═══════════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════════
const FINISH_Z=TRACK_LENGTH-22;
const START_Z=5;
const gears=[0,0.082,0.165,0.265,0.385,0.525,0.665];
const gearThr=[0,14,38,70,106,148,198];
const MAX_SPD=325;

const state={phase:'idle',timer:0,raceStart:0,
  p1:{pos:START_Z,speed:0,gear:1,finished:false,finTime:0},
  p2:{pos:START_Z,speed:0,gear:1,finished:false,finTime:0}};
let p1M=1,p2M=1,cShake=0;

function getGear(spd){ for(let g=gearThr.length-1;g>=0;g--) if(spd>=gearThr[g]) return g+1; return 1; }

function resetGame(){
  state.phase='idle'; state.timer=0; state.raceStart=0;
  state.p1={pos:START_Z,speed:0,gear:1,finished:false,finTime:0};
  state.p2={pos:START_Z,speed:0,gear:1,finished:false,finTime:0};
  car1.position.set(-3.6,0,START_Z); car2.position.set(3.6,0,START_Z);
  document.getElementById('winner-banner').style.display='none';
  document.getElementById('countdown').style.display='none';
  document.getElementById('launch-hint').style.display='block';
  p1M=0.92+Math.random()*0.16; p2M=0.92+Math.random()*0.16;
  cShake=0;
  for(let i=0;i<MAX_P;i++){ pPos2[i*3]=9999; pLf[i]=0; }
  _didScreech=false;
  if(!modelsLoaded){
    document.getElementById('timer-val').textContent = 'Loading...';
  } else {
    document.getElementById('timer-val').textContent = '0.000';
  }
}

function startCountdown(){
  if(state.phase!=='idle') return;
  if(!modelsLoaded){
    document.getElementById('timer-val').textContent = 'Loading...';
    return;
  }
  document.getElementById('launch-hint').style.display='none';
  state.phase='countdown';
  const el=document.getElementById('countdown');
  el.style.display='block'; el.classList.remove('go');
  for(let li=0;li<5;li++){
    const lm=scene.userData['light_'+li];
    if(lm){ lm.material.emissiveIntensity=0.2; }
  }
  let idx=0;
  const counts=['3','2','1','GO!'];
  function step(){
    if(idx<3){
      el.textContent=counts[idx];
      const lm=scene.userData['light_'+idx];
      if(lm){ lm.material.color.setHex(0xFF0000); lm.material.emissive.setHex(0xFF0000); lm.material.emissiveIntensity=3.0; }
    } else {
      el.textContent='GO!'; el.classList.add('go');
      for(let li=0;li<5;li++){
        const lm2=scene.userData['light_'+li];
        if(lm2){ lm2.material.color.setHex(0x00FF00); lm2.material.emissive.setHex(0x00FF00); lm2.material.emissiveIntensity=4.0; }
      }
    }
    el.style.animation='none'; el.offsetHeight; el.style.animation='countPulse 0.6s ease-out';
    idx++;
    if(idx<4) setTimeout(step,900);
    else{ setTimeout(()=>{ el.style.display='none'; state.phase='racing'; state.raceStart=performance.now(); cShake=0.22; },700); }
  }
  step();
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key===' '){ e.preventDefault(); if(state.phase==='idle') startCountdown(); else if(state.phase==='finished') resetGame(); }
});
document.getElementById('canvas-container').addEventListener('click',()=>{ if(state.phase==='idle') startCountdown(); else if(state.phase==='finished') resetGame(); });
document.getElementById('race-again-btn').addEventListener('click',e=>{ e.stopPropagation(); resetGame(); });

// ═══════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════
const camOff=new THREE.Vector3(0,5.5,-18);
const camLook=new THREE.Vector3(0,1.8,10);
function updateCamera(dt){
  const midZ=(state.p1.pos+state.p2.pos)*0.5;
  const sh=cShake*Math.sin(Date.now()*0.09)*0.14;
  const targetPos=new THREE.Vector3(camOff.x+sh, camOff.y+Math.abs(sh)*0.4, midZ+camOff.z);
  camera.position.lerp(targetPos,0.09);
  camera.lookAt(new THREE.Vector3(0,camLook.y,midZ+camLook.z));
  if(cShake>0) cShake=Math.max(0,cShake-dt*0.75);
}

// ═══════════════════════════════════════════════════════════════
//  PHYSICS
// ═══════════════════════════════════════════════════════════════
function updatePhysics(dt){
  if(state.phase!=='racing') return;
  const elapsed=(performance.now()-state.raceStart)/1000;
  state.timer=elapsed;
  function updateCar(cs,mult){
    if(cs.finished) return;
    cs.gear=getGear(cs.speed);
    const ga=gears[Math.min(cs.gear,gears.length-1)];
    const ar=cs.speed/MAX_SPD;
    const vr=1+(Math.sin(elapsed*3.9+mult*12)*0.022);
    cs.speed=Math.min(cs.speed+(ga*(1-ar*0.78)*mult*vr)*dt*285, MAX_SPD);
    cs.pos+=cs.speed/3.6*dt;
  }
  updateCar(state.p1,p1M); updateCar(state.p2,p2M);
  car1.position.z=state.p1.pos; car2.position.z=state.p2.pos;
  const ws=[car1,car2]; const spds=[state.p1.speed,state.p2.speed];
  ws.forEach((c,ci)=>{
    if(c._wheels && c._wheels.length > 0){
      c._wheels.forEach(w=>{ w.rotation.x += spds[ci] * 0.038 * dt; });
    }
  });
  car1.position.y=Math.max(0,-state.p1.speed/MAX_SPD*0.04);
  car2.position.y=Math.max(0,-state.p2.speed/MAX_SPD*0.04);
  const now=performance.now();
  if(!state.p1.finished&&state.p1.pos>=FINISH_Z){ state.p1.finished=true; state.p1.finTime=(now-state.raceStart)/1000; }
  if(!state.p2.finished&&state.p2.pos>=FINISH_Z){ state.p2.finished=true; state.p2.finTime=(now-state.raceStart)/1000; }
  if(state.p1.finished&&state.p2.finished&&state.phase==='racing'){
    state.phase='finished';
    const w=state.p1.finTime<=state.p2.finTime?'Player 1':'Player 2';
    showWinner(w,Math.min(state.p1.finTime,state.p2.finTime),Math.abs(state.p1.finTime-state.p2.finTime));
  } else if((state.p1.finished||state.p2.finished)&&state.phase==='racing'){
    const leader=state.p1.finished?state.p1:state.p2;
    const other=state.p1.finished?state.p2:state.p1;
    if(leader.pos>FINISH_Z+25&&!other.finished){
      other.finished=true; other.finTime=(now-state.raceStart)/1000+0.06+Math.random()*0.28;
      state.phase='finished';
      const wn=state.p1.finTime<=state.p2.finTime?'Player 1':'Player 2';
      showWinner(wn,Math.min(state.p1.finTime,state.p2.finTime),Math.abs(state.p1.finTime-state.p2.finTime));
    }
  }
}

function showWinner(n,t,m){
  document.getElementById('winner-name').textContent=n;
  document.getElementById('winner-time').textContent=`Time: ${t.toFixed(3)}s`;
  document.getElementById('winner-margin').textContent=m<0.001?'Photo Finish!':`Won by ${m.toFixed(3)}s`;
  document.getElementById('winner-banner').style.display='block';
}

// ═══════════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════════
function spawnCarParticles(){
  if(state.phase!=='racing') return;
  const elapsed=(performance.now()-state.raceStart)/1000;
  [[car1,state.p1],[car2,state.p2]].forEach(([c,s])=>{
    if(s.finished) return;
    const cx=c.position.x, cy=c.position.y, cz=c.position.z;
    if(elapsed<2.8&&s.speed<90){
      for(let i=0;i<5;i++) spawnP(cx+(Math.random()-0.5)*1.9,cy+0.14,cz-1.5+(Math.random()-0.5)*0.6,(Math.random()-0.5)*0.4,0.32+Math.random()*0.45,-(0.5+Math.random()*2.2),0);
    }
    for(let e=0;e<2;e++) spawnP(cx+(e===0?-0.42:0.42),cy+0.12,cz-2.3,(Math.random()-0.5)*0.2,0.07+Math.random()*0.12,-(0.3+Math.random()*1.1),2);
    if(s.speed>35) spawnP(cx+(Math.random()-0.5)*2,cy+0.07,cz-1.9+(Math.random()-0.5)*0.8,(Math.random()-0.5)*0.3,0.04+Math.random()*0.18,-(0.2+Math.random()*0.9),1);
    if(s.speed>185&&Math.random()<0.18) spawnP(cx+(Math.random()-0.5)*1.6,cy+0.05,cz-1.6,(Math.random()-0.5)*3,0.5+Math.random()*1.6,-(Math.random()*2),3);
  });
}

function updateParticles(dt){
  for(let i=0;i<MAX_P;i++){
    if(pLf[i]<=0) continue;
    const rate=pTy[i]===0?0.55:(pTy[i]===3?3.2:1.15);
    pLf[i]-=dt*rate;
    if(pLf[i]<=0){ pPos2[i*3]=9999; pSz[i]=0; continue; }
    pPos2[i*3]+=pVx[i]*dt*4; pPos2[i*3+1]+=pVy[i]*dt*4; pPos2[i*3+2]+=pVz2[i]*dt*4;
    pVy[i]-=dt*0.75;
    pSz[i]*=0.996;
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.size.needsUpdate=true;
}

// ═══════════════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════════════
function updateHUD(){
  document.getElementById('p1-speed').textContent=Math.round(state.p1.speed);
  document.getElementById('p2-speed').textContent=Math.round(state.p2.speed);
  const r1=Math.min(state.p1.speed/MAX_SPD*100,100), r2=Math.min(state.p2.speed/MAX_SPD*100,100);
  document.getElementById('p1-rpm').style.width=r1+'%';
  document.getElementById('p2-rpm').style.width=r2+'%';
  document.getElementById('p1-rpm').style.backgroundPosition=r1>82?'100% 0':'50% 0';
  document.getElementById('p1-gear').textContent=state.phase==='racing'?state.p1.gear:'N';
  document.getElementById('p2-gear').textContent=state.phase==='racing'?state.p2.gear:'N';
  if(state.phase==='racing') document.getElementById('timer-val').textContent=state.timer.toFixed(3);
  const prog=FINISH_Z-START_Z;
  document.getElementById('p1-fill').style.width=Math.min((state.p1.pos-START_Z)/prog*100,100)+'%';
  document.getElementById('p2-fill').style.width=Math.min((state.p2.pos-START_Z)/prog*100,100)+'%';
  const avgS=(state.p1.speed+state.p2.speed)/2;
  document.getElementById('speed-overlay').style.opacity=(avgS/MAX_SPD*0.5).toFixed(2);
  const lf=document.getElementById('lens-flare');
  const fa=Math.abs(Math.sin(Date.now()*0.00045));
  if(fa>0.62&&state.phase==='racing'){ lf.style.display='block'; lf.style.left=(38+fa*18)+'%'; lf.style.top='16%'; lf.style.opacity=((fa-0.62)*1.4).toFixed(2); }
  else lf.style.display='none';
}

// ═══════════════════════════════════════════════════════════════
//  AUDIO
// ═══════════════════════════════════════════════════════════════
let audioCtx=null, engOsc1=null, engOsc2=null, engOsc3=null, engGain=null,
    masterGain=null, windGain=null, audioReady=false;
function initAudio(){
  if(audioReady) return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=0.35;
    const comp=audioCtx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=8; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.18;
    masterGain.connect(comp); comp.connect(audioCtx.destination); masterGain.connect(audioCtx.destination);
    engOsc1=audioCtx.createOscillator(); engOsc1.type='sawtooth'; engOsc1.frequency.value=55;
    const ef1=audioCtx.createBiquadFilter(); ef1.type='lowpass'; ef1.frequency.value=500;
    engOsc1.connect(ef1);
    engOsc2=audioCtx.createOscillator(); engOsc2.type='square'; engOsc2.frequency.value=110;
    const ef2=audioCtx.createBiquadFilter(); ef2.type='bandpass'; ef2.frequency.value=400; ef2.Q.value=1.5;
    engOsc2.connect(ef2);
    engOsc3=audioCtx.createOscillator(); engOsc3.type='sawtooth'; engOsc3.frequency.value=220;
    const ef3=audioCtx.createBiquadFilter(); ef3.type='highpass'; ef3.frequency.value=300;
    engOsc3.connect(ef3);
    engGain=audioCtx.createGain(); engGain.gain.value=0;
    ef1.connect(engGain); ef2.connect(engGain); ef3.connect(engGain);
    engGain.connect(masterGain);
    engOsc1.start(); engOsc2.start(); engOsc3.start();
    const bufSz=audioCtx.sampleRate*2;
    const wBuf=audioCtx.createBuffer(1,bufSz,audioCtx.sampleRate);
    const wData=wBuf.getChannelData(0);
    for(let i=0;i<bufSz;i++) wData[i]=Math.random()*2-1;
    const wNode=audioCtx.createBufferSource(); wNode.buffer=wBuf; wNode.loop=true;
    const wf=audioCtx.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=800; wf.Q.value=0.5;
    windGain=audioCtx.createGain(); windGain.gain.value=0;
    wNode.connect(wf); wf.connect(windGain); windGain.connect(masterGain);
    wNode.start();
    audioReady=true;
  } catch(e){ console.warn('Audio failed:',e); }
}
function updateSound(dt){
  if(!audioReady) return;
  const avg=(state.p1.speed+state.p2.speed)*0.5;
  const sr=avg/MAX_SPD;
  if(state.phase==='racing'){
    const t=audioCtx.currentTime;
    const rpm=55+sr*330;
    engOsc1.frequency.setTargetAtTime(rpm,t,0.08);
    engOsc2.frequency.setTargetAtTime(rpm*2,t,0.08);
    engOsc3.frequency.setTargetAtTime(rpm*4,t,0.04);
    const el=(performance.now()-state.raceStart)/1000;
    engGain.gain.setTargetAtTime(Math.min(0.55+sr*0.45+(el<1.5?0.85:0),1.0),t,0.06);
    windGain.gain.setTargetAtTime(sr*0.32,t,0.12);
  } else {
    if(engGain) engGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.3);
    if(windGain) windGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.3);
  }
}
function playScreech(){
  if(!audioReady) return;
  const o=audioCtx.createOscillator(); o.type='sawtooth'; o.frequency.value=820;
  const g=audioCtx.createGain(); g.gain.value=0.22;
  const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200;
  o.connect(f); f.connect(g); g.connect(masterGain);
  o.start();
  o.frequency.exponentialRampToValueAtTime(180,audioCtx.currentTime+1.3);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.3);
  o.stop(audioCtx.currentTime+1.3);
}
document.addEventListener('click',initAudio,{once:false});
document.addEventListener('keydown',initAudio,{once:false});
let _didScreech=false;

// ═══════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════
let lastT=0;
function animate(time){
  requestAnimationFrame(animate);
  const dt=Math.min((time-lastT)/1000,0.05); lastT=time;
  if(scene.userData.cloudMesh) scene.userData.cloudMesh.material.map.offset.x+=dt*0.002;
  updatePhysics(dt);
  spawnCarParticles();
  updateParticles(dt);
  updateCamera(dt);
  updateHUD();
  if(state.phase==='racing'&&!_didScreech){ initAudio(); if(audioReady) playScreech(); _didScreech=true; }
  if(state.phase!=='racing') _didScreech=false;
  updateSound(dt);
  const avgS=(state.p1.speed+state.p2.speed)*0.5;
  renderer.domElement.style.filter=avgS>200?'saturate(1.2) contrast(1.04)':'';
  renderer.render(scene,camera);
}
resetGame();
requestAnimationFrame(animate);

})();
</script>
