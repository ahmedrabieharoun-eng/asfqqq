<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🏁 سباق السرعة - VIVAVIDEO</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800;900&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Fredoka', 'Orbitron', cursive;
    font-weight: 700;
    background: #0a0f1a;
}

/* شاشة البداية */
#startScreen {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: radial-gradient(circle at 20% 30%, #0b1a2e, #03060c);
    padding-bottom: 50px;
}

.start-ui {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    padding: 0 22px;
}

.start-title {
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(135deg, #FFD966, #FF8C42);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 20px rgba(255, 140, 66, 0.5);
    letter-spacing: 2px;
}

.start-cars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 40px;
    margin: 15px 0;
}

.start-cars img {
    height: 90px;
    width: auto;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
    animation: carBob 2s ease-in-out infinite;
}

.start-cars img:first-child {
    transform: scaleX(-1);
    animation-delay: 0.4s;
}

@keyframes carBob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.start-btn {
    width: 100%;
    max-width: 320px;
    padding: 18px;
    background: linear-gradient(135deg, #FFB347, #FF7E05);
    border: none;
    border-radius: 60px;
    color: white;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Fredoka', cursive;
    box-shadow: 0 0 30px rgba(255, 126, 5, 0.8);
    transition: transform 0.1s ease;
}

.start-btn:active { transform: scale(0.97); }

.stake-row {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(12px);
    border-radius: 40px;
    padding: 10px 24px;
    color: #FFD966;
    font-weight: bold;
    border: 1px solid rgba(255, 217, 0, 0.5);
}

/* لعبة السباق */
#gameWrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: none;
}

#raceCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
}

/* السيارات المتحركة */
.rs-car {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    transition: bottom 0.05s linear;
    filter: drop-shadow(0 20px 25px rgba(0,0,0,0.5));
}

.rs-car img {
    width: 100%;
    display: block;
}

/* تأثير النيترو */
.rs-car.nitro img {
    filter: drop-shadow(0 0 15px #ff5500) brightness(1.2);
}

/* خط النهاية */
#rsFinishLine {
    position: absolute;
    left: 5%;
    right: 5%;
    top: 38%;
    z-index: 15;
    display: none;
    pointer-events: none;
    animation: finishDrop 0.4s cubic-bezier(0.2, 1, 0.3, 1) both;
}

#rsFinishLine img {
    width: 100%;
    display: block;
    filter: drop-shadow(0 0 20px gold);
}

@keyframes finishDrop {
    from { transform: translateY(-100px) scaleY(0.3); opacity: 0; }
    to { transform: translateY(0) scaleY(1); opacity: 1; }
}

#rsFinishLine.show { display: block; }

/* HUD - تصميم احترافي مثل الصور */
.rs-hud {
    position: absolute;
    top: 20px;
    left: 0;
    right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    gap: 15px;
}

.rs-hud-card {
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(16px);
    border-radius: 30px;
    padding: 8px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    min-width: 110px;
}

.rs-hud-card.left { border-left: 4px solid #3b82f6; }
.rs-hud-card.right { border-right: 4px solid #ef4444; }

.rs-hud-name {
    font-size: 12px;
    font-weight: 800;
    color: #aaa;
    letter-spacing: 1px;
}

.rs-hud-speed {
    font-size: 46px;
    font-weight: 900;
    font-family: 'Orbitron', monospace;
    background: linear-gradient(135deg, #fff, #ffd966);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
}

.rs-hud-unit {
    font-size: 10px;
    color: #ffaa33;
    font-weight: bold;
}

/* مؤقت العد التنازلي */
.rs-timer-pill {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(20px);
    border-radius: 60px;
    padding: 8px 24px;
    border: 2px solid #FFD966;
    box-shadow: 0 0 25px rgba(255, 217, 0, 0.5);
    text-align: center;
}

.rs-timer-pill span {
    font-size: 32px;
    font-weight: 900;
    font-family: 'Orbitron', monospace;
    color: #FFE484;
    letter-spacing: 2px;
}

/* شاشة النتيجة */
#rsResultOverlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.94);
    backdrop-filter: blur(24px);
    gap: 20px;
}

.rsr-emoji { font-size: 90px; animation: popIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1); }
@keyframes popIn {
    0% { transform: scale(0.2); opacity: 0; }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
}

.rsr-title {
    font-size: 48px;
    font-weight: 900;
}

.rsr-title.win { color: #facc15; text-shadow: 0 0 20px #ffb347; }
.rsr-title.lose { color: #f87171; }

.rsr-reward {
    font-size: 28px;
    font-weight: bold;
    background: linear-gradient(135deg, #FFD966, #FFA500);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.rsr-vs {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255,255,255,0.08);
    padding: 20px;
    border-radius: 48px;
    width: 90%;
    max-width: 380px;
    justify-content: space-between;
}

.rsr-side {
    text-align: center;
    flex: 1;
}

.rsr-car-img {
    width: 85px;
    filter: drop-shadow(0 8px 12px black);
}

.rsr-sspd {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    color: #ffaa44;
}

.rsr-btn {
    background: linear-gradient(135deg, #3b82f6, #1e3a8a);
    border: none;
    padding: 16px 32px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    margin-top: 20px;
    width: 80%;
    max-width: 280px;
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- شاشة البداية -->
<div id="startScreen">
    <div class="start-ui">
        <div class="start-title">🏁 VIVAVIDEO RACING 🏁</div>
        <div class="start-cars">
            <img id="startCarAI" src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/cd488969-3a83-4b83-a686-cebc4f6c668f.png" alt="AI">
            <img id="startCarPl" src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/90f09e84-c74d-4c4e-ab08-9c4fe7f83db4.png" alt="Player">
        </div>
        <button class="start-btn" onclick="startRace()">⚡ ابدأ السباق ⚡</button>
        <div class="stake-row">🎲 رهان البداية: 0.5 TON</div>
    </div>
</div>

<div id="gameWrap">
    <canvas id="raceCanvas"></canvas>

    <div class="rs-car" id="rsCarAI"><img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/cd488969-3a83-4b83-a686-cebc4f6c668f.png" alt="AI"></div>
    <div class="rs-car" id="rsCarPlayer"><img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/90f09e84-c74d-4c4e-ab08-9c4fe7f83db4.png" alt="Player"></div>

    <div id="rsFinishLine"><img src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/6882ac9f-bd42-4d0b-89e4-a50b1ac2ac19.png" alt="Finish"></div>

    <div class="rs-hud">
        <div class="rs-hud-card left">
            <div class="rs-hud-name">🤖 AI</div>
            <div class="rs-hud-speed" id="rsHudP2Speed">0</div>
            <div class="rs-hud-unit">km/h</div>
        </div>
        <div class="rs-timer-pill"><span id="rsTimer">00:15</span></div>
        <div class="rs-hud-card right">
            <div class="rs-hud-name">🏁 أنت</div>
            <div class="rs-hud-speed" id="rsHudP1Speed">0</div>
            <div class="rs-hud-unit">km/h</div>
        </div>
    </div>

    <div id="rsResultOverlay">
        <div class="rsr-emoji" id="rsrEmoji">🏆</div>
        <div class="rsr-title" id="rsrTitle">فوز!</div>
        <div class="rsr-reward" id="rsrReward" style="display:none;">💰 +0.9 TON</div>
        <div class="rsr-vs">
            <div class="rsr-side">
                <img class="rsr-car-img" src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/90f09e84-c74d-4c4e-ab08-9c4fe7f83db4.png" alt="You">
                <div class="rsr-sname">أنت</div>
                <div class="rsr-sspd" id="rsrSpd1">— km/h</div>
            </div>
            <div class="rsr-sep">⚡VS⚡</div>
            <div class="rsr-side">
                <img class="rsr-car-img" src="https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/cd488969-3a83-4b83-a686-cebc4f6c668f.png" alt="AI">
                <div class="rsr-sname">AI</div>
                <div class="rsr-sspd" id="rsrSpd2">— km/h</div>
            </div>
        </div>
        <button class="rsr-btn" onclick="resetRace()">🔄 سباق جديد</button>
    </div>
</div>

<script>
// تحميل الصور
const SRC = {
    palm: 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/dac9b512-557d-41f7-8a84-6062343b5eda.png',
    mountain: 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/3a247e58-d369-417a-a039-10d47c840818.png',
    bushes: 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/f7948c31-84c8-4d5f-9f38-83d2357a7548.png',
    cloud: 'https://i.supaimg.com/ec27537b-aa6a-42cf-8ba1-d6850eeea36d/4f7087a7-89f5-444d-b628-25ab1ceed975.png',
};
const IMG = {};
let loaded = 0;
Object.entries(SRC).forEach(([k, s]) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { IMG[k] = img; loaded++; };
    img.onerror = () => { IMG[k] = null; loaded++; };
    img.src = s;
});

// متغيرات السباق
let bgCvs, bgCtx, bgRaf;
let raceActive = false, raceRaf = null, raceTmr = null;
let cvs, ctx, cW, cH;
let rR = 0, rT = 0, rC = 0;

// رسم الطريق والخلفية
const VP_Y = 0.42;
const ROAD_TOP_W = 0.12;
const ROAD_BOT_W = 0.88;

function drawSky(c, W, H) {
    const hy = H * VP_Y;
    const grad = c.createLinearGradient(0, 0, 0, hy);
    grad.addColorStop(0, '#0a1f3e');
    grad.addColorStop(0.5, '#1c4e80');
    grad.addColorStop(1, '#6ba5d1');
    c.fillStyle = grad;
    c.fillRect(0, 0, W, hy + 5);
}

function drawClouds(c, W, H, off) {
    const img = IMG.cloud;
    if (!img) return;
    const configs = [
        { bx: 0.05, by: 0.12, sc: 0.8, sp: 0.022 },
        { bx: 0.35, by: 0.07, sc: 1.0, sp: 0.018 },
        { bx: 0.65, by: 0.15, sc: 0.75, sp: 0.025 },
        { bx: 0.85, by: 0.09, sc: 0.9, sp: 0.02 }
    ];
    c.save();
    c.globalAlpha = 0.85;
    configs.forEach(cf => {
        const iw = img.naturalWidth || 200;
        const ih = img.naturalHeight || 100;
        const cw = iw * cf.sc * (W / 500);
        const ch = ih * cf.sc * (W / 500);
        let rx = cf.bx * W + off * cf.sp;
        let x = ((rx % (W + cw)) + W + cw) % (W + cw) - cw / 2;
        let y = H * VP_Y * cf.by - ch / 2;
        c.drawImage(img, x, y, cw, ch);
    });
    c.restore();
}

function drawMountains(c, W, H) {
    const img = IMG.mountain;
    const hy = H * VP_Y;
    if (!img) return;
    const iw = img.naturalWidth || 800;
    const ih = img.naturalHeight || 400;
    const dh = hy * 0.65;
    const dw = dh * (iw / ih);
    let x = -dw * 0.2;
    let flip = false;
    while (x < W + dw) {
        c.save();
        if (flip) { c.translate(x + dw, 0); c.scale(-1, 1); c.globalAlpha = 0.9; }
        else { c.translate(x, 0); }
        c.drawImage(img, 0, hy - dh * 0.85, dw, dh);
        c.restore();
        x += dw * 0.82;
        flip = !flip;
    }
}

function drawRoad(c, W, H, rOff) {
    const hy = H * VP_Y;
    const vpx = W * 0.5;
    const tw = W * ROAD_TOP_W;
    const bw = W * ROAD_BOT_W;
    const rt = hy, rb = H + 10;

    // Grass left
    c.beginPath();
    c.moveTo(vpx - tw / 2, rt);
    c.lineTo(0, rb);
    c.lineTo(vpx - bw / 2, rb);
    c.fillStyle = '#0f3b0a';
    c.fill();
    c.beginPath();
    c.moveTo(vpx + tw / 2, rt);
    c.lineTo(W, rb);
    c.lineTo(vpx + bw / 2, rb);
    c.fillStyle = '#0f3b0a';
    c.fill();

    // Asphalt
    c.beginPath();
    c.moveTo(vpx - tw / 2, rt);
    c.lineTo(vpx + tw / 2, rt);
    c.lineTo(vpx + bw / 2, rb);
    c.lineTo(vpx - bw / 2, rb);
    const roadGrad = c.createLinearGradient(0, rt, 0, rb);
    roadGrad.addColorStop(0, '#2c2c2c');
    roadGrad.addColorStop(1, '#1a1a1a');
    c.fillStyle = roadGrad;
    c.fill();

    // Lanes marking
    c.beginPath();
    c.moveTo(vpx - tw / 2, rt);
    c.lineTo(vpx - bw / 2, rb);
    c.strokeStyle = '#ffcc44';
    c.lineWidth = 4;
    c.stroke();
    c.beginPath();
    c.moveTo(vpx + tw / 2, rt);
    c.lineTo(vpx + bw / 2, rb);
    c.stroke();

    // Dashed middle line
    for (let i = 0; i < 28; i++) {
        let t = (i / 28 + (rOff / (H * 0.9))) % 1;
        if (t < 0.03) continue;
        const y = rt + (rb - rt) * t;
        const pt = t * t;
        const dh = 18 * pt + 8;
        const dw = 6 * pt;
        if (Math.floor(t * 22) % 2 === 0) {
            c.fillStyle = `rgba(255, 210, 90, ${0.6 + pt * 0.3})`;
            c.fillRect(vpx - dw / 2, y - dh / 2, dw, dh);
        }
    }
}

function drawSideObjects(c, W, H, tOff) {
    const hy = H * VP_Y;
    const vpx = W * 0.5;
    const topHW = W * ROAD_TOP_W / 2;
    const botHW = W * ROAD_BOT_W / 2;
    const palm = IMG.palm;
    const bush = IMG.bushes;
    if (!palm) return;

    for (let i = 0; i < 14; i++) {
        let t = (i / 14 + tOff * 0.0007) % 1;
        if (t < 0.05 || t > 0.96) continue;
        const pt = t * t;
        const y = hy + (H - hy) * t;
        const hw = topHW + (botHW - topHW) * pt;
        const side = i % 2 === 0 ? -1 : 1;
        const x = vpx + side * (hw + 12 + pt * 28);
        if (x < -80 || x > W + 80) continue;
        const img = (i % 3 === 0) ? bush : palm;
        if (!img) continue;
        const dh = 28 + pt * 95;
        const dw = dh * (img.naturalWidth / img.naturalHeight) * 0.9;
        c.drawImage(img, x - dw / 2, y - dh, dw, dh);
    }
}

function drawFrame(c, W, H, rOff, tOff, cOff) {
    drawSky(c, W, H);
    drawClouds(c, W, H, cOff);
    drawMountains(c, W, H);
    drawRoad(c, W, H, rOff);
    drawSideObjects(c, W, H, tOff);
}

// شاشة البداية
function initBg() {
    bgCvs = document.getElementById('bgCanvas');
    bgCvs.width = window.innerWidth;
    bgCvs.height = window.innerHeight;
    bgCtx = bgCvs.getContext('2d');
    function bgLoop() {
        rR = (rR + 5) % (bgCvs.height * 2);
        rT = (rT + 4.8) % 10000;
        rC = (rC + 0.45) % 10000;
        drawFrame(bgCtx, bgCvs.width, bgCvs.height, rR, rT, rC);
        bgRaf = requestAnimationFrame(bgLoop);
    }
    bgLoop();
}

function startRace() {
    if (bgRaf) cancelAnimationFrame(bgRaf);
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameWrap').style.display = 'block';

    cvs = document.getElementById('raceCanvas');
    cW = cvs.width = window.innerWidth;
    cH = cvs.height = window.innerHeight;
    ctx = cvs.getContext('2d');

    rR = 0; rT = 0; rC = 0;
    raceActive = true;

    positionCars();

    function roadLoop() {
        if (!raceActive) return;
        rR = (rR + 13) % (cH * 2);
        rT = (rT + 12.6) % 10000;
        rC = (rC + 0.6) % 10000;
        drawFrame(ctx, cW, cH, rR, rT, rC);
        raceRaf = requestAnimationFrame(roadLoop);
    }
    if (raceRaf) cancelAnimationFrame(raceRaf);
    raceRaf = requestAnimationFrame(roadLoop);
    runRace();
}

function positionCars() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const vpx = W * 0.5;
    const bHW = W * ROAD_BOT_W / 2;
    const carW = W * 0.24;

    const aiX = vpx - bHW * 0.48 - carW / 2;
    const plX = vpx + bHW * 0.05 - carW / 2;

    const aiEl = document.getElementById('rsCarAI');
    const plEl = document.getElementById('rsCarPlayer');
    aiEl.style.width = carW + 'px';
    aiEl.style.left = aiX + 'px';
    aiEl.style.bottom = '3%';
    plEl.style.width = carW + 'px';
    plEl.style.left = plX + 'px';
    plEl.style.bottom = '2%';
}

function runRace() {
    const win = Math.random() > 0.45;
    const pSpd = Math.floor(65 + Math.random() * 25);
    const aSpd = Math.floor(60 + Math.random() * 22);
    const TOTAL = 14500, RAMP = 4000, FINISH_AT = 12500, TICK = 140;
    let elapsed = 0;
    let pBottom = 2, aBottom = 3;

    const aiCar = document.getElementById('rsCarAI');
    const plCar = document.getElementById('rsCarPlayer');
    const finishLine = document.getElementById('rsFinishLine');

    if (raceTmr) clearInterval(raceTmr);
    raceTmr = setInterval(() => {
        elapsed += TICK;
        if (!raceActive) { clearInterval(raceTmr); return; }

        const progress = Math.min(1, elapsed / RAMP);
        const easeOut = 1 - Math.pow(1 - progress, 2);
        const spdP = Math.floor(pSpd * easeOut);
        const spdA = Math.floor(aSpd * easeOut);
        document.getElementById('rsHudP1Speed').innerText = spdP;
        document.getElementById('rsHudP2Speed').innerText = spdA;

        const rem = Math.max(0, TOTAL - elapsed);
        const secs = Math.floor(rem / 1000);
        document.getElementById('rsTimer').innerText = `00:${secs.toString().padStart(2, '0')}`;

        const moveFactor = Math.min(1, elapsed / (TOTAL * 0.78));
        const boost = Math.min(18, Math.pow(moveFactor, 1.5) * 28);

        if (win) {
            pBottom = 2 + boost;
            aBottom = 3 + boost * 0.86;
            if (elapsed > TOTAL * 0.6) plCar.style.transform = `scale(${1 - (boost / 80)})`;
        } else {
            aBottom = 3 + boost;
            pBottom = 2 + boost * 0.86;
            if (elapsed > TOTAL * 0.6) aiCar.style.transform = `scale(${1 - (boost / 80)})`;
        }

        aiCar.style.bottom = Math.min(68, aBottom) + '%';
        plCar.style.bottom = Math.min(70, pBottom) + '%';

        if (elapsed >= FINISH_AT && finishLine && !finishLine.classList.contains('show')) {
            finishLine.classList.add('show');
        }

        if (elapsed >= TOTAL) {
            clearInterval(raceTmr);
            if (raceRaf) cancelAnimationFrame(raceRaf);
            raceActive = false;
            aiCar.classList.remove('racing');
            plCar.classList.remove('racing');
            setTimeout(() => showResult(win, pSpd, aSpd), 500);
        }
    }, TICK);
}

function showResult(win, p1, p2) {
    document.getElementById('rsrEmoji').innerText = win ? '🏆✨' : '💨😭';
    const title = document.getElementById('rsrTitle');
    title.innerText = win ? '🔥 فوز مذهل! 🔥' : '💀 خسرت... حاول مجدداً';
    title.className = 'rsr-title ' + (win ? 'win' : 'lose');
    const rewardDiv = document.getElementById('rsrReward');
    rewardDiv.style.display = win ? 'flex' : 'none';
    if (win) rewardDiv.innerText = '💰 +0.9 TON 🪙';
    document.getElementById('rsrSpd1').innerText = p1 + ' km/h';
    document.getElementById('rsrSpd2').innerText = p2 + ' km/h';
    document.getElementById('rsResultOverlay').style.display = 'flex';
}

function resetRace() {
    if (raceTmr) clearInterval(raceTmr);
    if (raceRaf) cancelAnimationFrame(raceRaf);
    raceActive = false;
    document.getElementById('rsResultOverlay').style.display = 'none';
    document.getElementById('gameWrap').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
    document.getElementById('rsFinishLine').classList.remove('show');
    rR = 0; rT = 0; rC = 0;
    initBg();
}

window.addEventListener('resize', () => {
    if (bgCvs) { bgCvs.width = window.innerWidth; bgCvs.height = window.innerHeight; }
    if (cvs && raceActive) {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
        positionCars();
    }
});

function waitReady() {
    if (loaded >= Object.keys(SRC).length) initBg();
    else setTimeout(waitReady, 80);
}
window.addEventListener('load', waitReady);
</script>
</body>
</html>
